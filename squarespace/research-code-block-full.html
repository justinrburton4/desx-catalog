<script>
/**
 * DesX Catalog renderer for Squarespace 7.0 (Bedford)
 * Loads shared GitHub JSON and renders Research rows or Tools grid.
 */
(function () {
  "use strict";

  // Card images:
  //   images = true  → all detailed cards show images
  //   images = false → hide images; if featured_images is true, only Featured cards keep them
  var images = false;
  var featured_images = true;

  var DEFAULT_IMAGE =
    "https://images.squarespace-cdn.com/content/5c7ee75b92441b465f176f7f/1596559556145-XTZEC1VK1GFU1GGLWS0X/DesignExLogoFavicon.png?content-type=image%2Fpng";

  var BADGE_LABELS = {
    journal: "Journal paper",
    conference: "Conference paper",
    whitepaper: "White paper",
  };

  function qs(root, sel) {
    return root.querySelector(sel);
  }

  function qsa(root, sel) {
    return Array.prototype.slice.call(root.querySelectorAll(sel));
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalize(str) {
    return String(str || "")
      .toLowerCase()
      .trim();
  }

  function itemImage(item) {
    return item && item.image ? item.image : DEFAULT_IMAGE;
  }

  function isValidResearch(item) {
    return (
      item &&
      item.kind === "research" &&
      item.id &&
      item.title &&
      item.abstract &&
      researchCardHref(item) &&
      item.badge &&
      Array.isArray(item.categories) &&
      item.categories.length
    );
  }

  function isValidTool(item) {
    return (
      item &&
      item.kind === "tool" &&
      item.id &&
      item.title &&
      item.blurb &&
      item.url &&
      Array.isArray(item.categories) &&
      item.categories.length
    );
  }

  function validateItems(items, kind) {
    var out = [];
    var seen = {};
    (items || []).forEach(function (item, index) {
      if (!item || item.kind !== kind) return;
      var ok = kind === "research" ? isValidResearch(item) : isValidTool(item);
      if (!ok) {
        console.warn("[DesX Catalog] Skipping invalid item at index " + index, item);
        return;
      }
      if (seen[item.id]) {
        console.warn("[DesX Catalog] Duplicate id skipped:", item.id);
        return;
      }
      if (item.hidden === true) {
        return;
      }
      seen[item.id] = true;
      out.push(item);
    });
    return out;
  }

  function matchesQuery(item, query) {
    if (!query) return true;
    var hay = [
      item.id,
      item.title,
      item.abstract,
      item.blurb,
      item.url,
      item.badge,
      BADGE_LABELS[item.badge] || "",
      (item.categories || []).join(" "),
      (item.authors || []).join(" "),
      String(item.year || ""),
    ]
      .join(" ")
      .toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function matchesBadgeFilters(item, badges) {
    if (!badges || !badges.length) return true;
    return badges.indexOf(item.badge) !== -1;
  }

  var YEAR_RANGE_START = 2007;

  function yearBounds(items) {
    var current = new Date().getFullYear();
    var minY = YEAR_RANGE_START;
    var maxY = current;
    (items || []).forEach(function (item) {
      var y = Number(item.year);
      if (!y || isNaN(y)) return;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    });
    if (maxY < minY) maxY = minY;
    return { min: minY, max: maxY };
  }

  function yearList(minY, maxY) {
    var years = [];
    for (var y = minY; y <= maxY; y++) years.push(y);
    return years;
  }

  function matchesYearRange(item, yearFrom, yearTo) {
    if (!item.year) return true;
    var y = Number(item.year);
    if (isNaN(y)) return true;
    return y >= yearFrom && y <= yearTo;
  }

  function yearOptionButtons(years, selected) {
    return years
      .map(function (y) {
        var sel = Number(y) === Number(selected) ? " is-selected" : "";
        return (
          '<li role="none">' +
          '<button type="button" class="desx-year-dd-option' +
          sel +

  function readYearRange(root) {

    var fromY = fromEl ? Number(fromEl.getAttribute("data-value")) : YEAR_RANGE_START;
    var toY = toEl ? Number(toEl.getAttribute("data-value")) : current;
    if (isNaN(fromY)) fromY = YEAR_RANGE_START;
    if (isNaN(toY)) toY = current;
    if (fromY > toY) {
      var swap = fromY;
      fromY = toY;
      toY = swap;
      if (fromEl) setYearDropdownValue(fromEl, fromY);
      if (toEl) setYearDropdownValue(toEl, toY);

    return { from: fromY, to: toY };
  }

  function orderedCategories(catalog, items) {

    });
    var result = order.filter(function (c) {
      return present[c];

    Object.keys(present).forEach(function (c) {
      if (result.indexOf(c) === -1) result.push(c);
    });
    return result;

  function bindRowArrows(rowEl, expandedMap) {
    var shell = qs(rowEl, ".pub-scroll-shell");
    var scroller = qs(rowEl, ".pub-scroll-container");
    var prev = qs(rowEl, ".desx-arrow-prev");
    var next = qs(rowEl, ".desx-arrow-next");
    var viewAll = qs(rowEl, ".desx-view-all");
    var category = rowEl.getAttribute("data-category") || "";
    if (!shell || !scroller || !prev || !next) return;

    function isExpanded() {
      return rowEl.classList.contains("is-expanded");
    }

    function setExpanded(on) {
      rowEl.classList.toggle("is-expanded", on);
      if (expandedMap) {
        if (on) expandedMap[category] = true;
        else delete expandedMap[category];
      }
      if (viewAll) {
        viewAll.textContent = on ? "Show less" : "Show all";
        viewAll.setAttribute("aria-expanded", on ? "true" : "false");
        viewAll.classList.toggle("is-hidden", false);
      }
      if (!on) {
        scroller.scrollLeft = 0;
      }
      update();
    }

    function pageStep() {
      var card = qs(scroller, ".pub-card");
      var cardW = card ? card.getBoundingClientRect().width : 255;
      var style = window.getComputedStyle(scroller);
      var gap = parseFloat(style.columnGap || style.gap) || 16;
      var visible = scroller.clientWidth;
      var step = Math.max(cardW + gap, visible - cardW - gap);
      return Math.max(step, visible * 0.85);
    }

    function positionArrows() {
      var card = qs(scroller, ".pub-card");
      if (!card) return;
      var shellRect = shell.getBoundingClientRect();
      var cardRect = card.getBoundingClientRect();
      var midY = Math.round(cardRect.top - shellRect.top + cardRect.height / 2);
      prev.style.top = midY + "px";
      next.style.top = midY + "px";
    }

    function update() {
      if (isExpanded()) {
        prev.classList.add("is-hidden");
        next.classList.add("is-hidden");
        prev.disabled = true;
        next.disabled = true;
        if (viewAll) {
          viewAll.classList.remove("is-hidden");
          viewAll.textContent = "Show less";
          viewAll.setAttribute("aria-expanded", "true");
        }
        return;
      }

      var max = scroller.scrollWidth - scroller.clientWidth;
      var canScroll = max > 8;
      var atStart = scroller.scrollLeft <= 12;
      var atEnd = !canScroll || scroller.scrollLeft >= max - 12;

      prev.classList.toggle("is-hidden", !canScroll || atStart);
      prev.disabled = !canScroll || atStart;
      next.classList.toggle("is-hidden", !canScroll || atEnd);
      next.disabled = !canScroll || atEnd;
      if (viewAll) {
        viewAll.classList.toggle("is-hidden", !canScroll);
        viewAll.textContent = "Show all";
        viewAll.setAttribute("aria-expanded", "false");
      }
      positionArrows();
    }

    prev.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      scroller.scrollBy({ left: -pageStep(), behavior: "smooth" });
    });
    next.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      scroller.scrollBy({ left: pageStep(), behavior: "smooth" });
    });
    if (viewAll) {
      viewAll.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setExpanded(!isExpanded());
      });
    }
    scroller.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    if (!isExpanded()) scroller.scrollLeft = 0;
    update();
  }

  function withCacheBust(url) {
    var sep = String(url).indexOf("?") >= 0 ? "&" : "?";
    return url + sep + "_=" + Date.now();
  }

  function parseGithubRaw(url) {
    var m = String(url).match(
      /^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/?#]+)\/([^?#]+)/
    );
    if (!m) return null;
    return { owner: m[1], repo: m[2], ref: m[3], path: m[4] };
  }

  function fetchJson(url) {
    return fetch(url, { credentials: "omit", cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
      return res.json();
    });
  }

  // Always load the latest GitHub file. Looks up the current commit SHA so
  // raw.githubusercontent.com cannot serve a stale cached copy of /main/.
  function fetchCatalogJson(url) {
    var gh = parseGithubRaw(url);
    if (!gh) {
      return fetchJson(withCacheBust(url)).then(function (catalog) {
        return { catalog: catalog, version: "direct-" + Date.now() };
      });
    }

    var api =
      "https://api.github.com/repos/" +
      gh.owner +
      "/" +
      gh.repo +
      "/commits?path=" +
      encodeURIComponent(gh.path) +
      "&sha=" +
      encodeURIComponent(gh.ref) +
      "&per_page=1";

    return fetch(api, {
      credentials: "omit",
      cache: "no-store",
      headers: { Accept: "application/vnd.github+json" },
    })
      .then(function (res) {
        if (!res.ok) throw new Error("GitHub API " + res.status);
        return res.json();
      })
      .then(function (commits) {
        var sha = commits && commits[0] && commits[0].sha;
        if (!sha) throw new Error("No commit SHA");
        return fetchJson(
          "https://raw.githubusercontent.com/" +
            gh.owner +
            "/" +
            gh.repo +
            "/" +
            sha +
            "/" +
            gh.path
        ).then(function (catalog) {
          return { catalog: catalog, version: sha };
        });
      })
      .catch(function () {
        return fetchJson(withCacheBust(url)).then(function (catalog) {
          return { catalog: catalog, version: "fallback-" + Date.now() };
        });
      });
  }

  function initMount(mount) {
    var kind = (mount.getAttribute("data-kind") || "research").toLowerCase();
    if (kind !== "research" && kind !== "tool") {
      console.error("[DesX Catalog] data-kind must be research or tool");
      return;
    }

    var shell = buildShell(mount, kind);
    var url = resolveCatalogUrl(mount);
    var cached = readCatalogCache(url);

    var state = {
      query: "",
      badges: [],
      yearFrom: YEAR_RANGE_START,
      yearTo: new Date().getFullYear(),
      layout: "detailed",
    };

    var catalog = null;
    var items = [];
    var wired = false;

    function applyCatalog(nextCatalog) {
      catalog = nextCatalog;
      items = validateItems(catalog.items || [], kind);
    }

    function paint() {
      state.query = normalize(shell.input.value);
      state.badges = selectedBadges(shell.root);
      if (kind === "research") {
        var range = readYearRange(shell.root);
        state.yearFrom = range.from;
        state.yearTo = range.to;
        renderResearch(shell.results, catalog, items, state);
      } else {
        renderTools(shell.results, catalog, items, state.query);
      }
    }

    function wireEvents() {
      if (wired) return;
      wired = true;

      if (kind === "research") {
        populateYearRange(shell.root, items);
        bindYearDropdowns(shell.root, paint);
        var initialRange = readYearRange(shell.root);
        state.yearFrom = initialRange.from;
        state.yearTo = initialRange.to;
      }

      shell.input.addEventListener("input", paint);

      qsa(shell.root, ".desx-filter-badge").forEach(function (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("is-active");
          paint();
        });
      });

      qsa(shell.root, ".desx-layout-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var layout = btn.getAttribute("data-layout") || "detailed";
          var toggle = qs(shell.root, ".desx-layout-toggle");
          qsa(shell.root, ".desx-layout-btn").forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
          });
          if (toggle) toggle.setAttribute("data-layout", layout);
          state.layout = layout;
          paint();
        });
      });
    }

    function finishLoad(nextCatalog) {
      applyCatalog(nextCatalog);
      wireEvents();
      paint();
      clearLoadingState(shell.results);
    }

    if (cached && cached.catalog) {
      finishLoad(cached.catalog);
    } else {
      showSkeleton(shell.results, kind);
    }

    fetchCatalogJson(url)
      .then(function (result) {
        writeCatalogCache(url, result.catalog, result.version);
        var cachedVersion = cached && cached.version;
        var cachedCatalog = cached && cached.catalog;
        if (
          !cachedCatalog ||
          result.version !== cachedVersion ||
          catalogDataVersion(result.catalog) !== catalogDataVersion(cachedCatalog)
        ) {
          finishLoad(result.catalog);
        } else {
          clearLoadingState(shell.results);
        }
      })
      .catch(function (err) {
        console.error("[DesX Catalog]", err);
        if (!catalog) {
          shell.results.innerHTML =
            '<div class="desx-empty">Could not load catalog. Check the JSON URL and that the repo is public.<\/div>';
          clearLoadingState(shell.results);
        }
      });
  }

  function boot() {
    qsa(document, "#desx-catalog, [data-desx-catalog]").forEach(initMount);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
