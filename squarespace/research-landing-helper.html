ms that traverse the Pareto frontiers of multiple system concepts through modularity","catalog_title":"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity","abstract":"Develops systems that traverse Pareto frontiers across multiple concepts as needs change over time.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1007/s00158-011-0735-7","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity","journal":"Structural and Multidisciplinary Optimization","year":2012,"volume":"45","issue":"4","page":"467","doi":"10.1007/s00158-011-0735-7","authors_resolved":[{"family":"Lewis","given":"P. K."},{"family":"Mattson","given":"C. A."}],"notes":[],"apa":"Lewis, P. K. & Mattson, C. A. (2012). A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity. Structural and Multidisciplinary Optimization, 45(4), 467. https://doi.org/10.1007/s00158-011-0735-7","mla":"Lewis, P. K., and Christopher A. Mattson. \"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity.\" Structural and Multidisciplinary Optimization, vol. 45, no. 4, 2012, p. 467, https://doi.org/10.1007/s00158-011-0735-7.","chicago_author_date":"Lewis, P. K. and Christopher A. Mattson. 2012. \"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity.\" Structural and Multidisciplinary Optimization 45 (4): 467. https://doi.org/10.1007/s00158-011-0735-7.","chicago_bibliography":"Lewis, P. K. and Christopher A. Mattson. \"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity.\" Structural and Multidisciplinary Optimization 45, no. 4 (2012): 467. https://doi.org/10.1007/s00158-011-0735-7.","chicago_footnote":"P. K. Lewis and Christopher A. Mattson, \"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity,\" Structural and Multidisciplinary Optimization 45, no. 4 (2012): 467, https://doi.org/10.1007/s00158-011-0735-7.","ieee":"P. K. Lewis and C. A. Mattson, \"A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity,\" Structural and Multidisciplinary Optimization, vol. 45, no. 4, pp. 467, Apr. 2012, doi: 10.1007/s00158-011-0735-7.","bibtex":"@article{lewis2012method,\n  author    = {Lewis, P. K. and Mattson, Christopher A.},\n  title     = {A method for developing systems that traverse the Pareto frontiers of multiple system concepts through modularity},\n  journal   = {Structural and Multidisciplinary Optimization},\n  volume    = {45},\n  number    = {4},\n  pages     = {467},\n  year      = {2012},\n  publisher = {Springer Science and Business Media LLC},\n  doi       = {10.1007/s00158-011-0735-7}\n}"},{"id":"design-space-exploration-for-quantifying-a-system-model-s-feasible-domain","slug":"/design-space-exploration-for-quantifying-a-system-model-s-feasible-domain","title":"Design Space Exploration for Quantifying a System Model’s Feasible Domain","catalog_title":"Design Space Exploration for Quantifying a System Modelâ€™s Feasible Domain","abstract":"A major challenge in multidisciplinary system design is predicting the effects of design decisions at the point these decisions are being made. Because decisions at the beginning of system design, when the least is known about the new system, have the greatest impact on its final behavior, designers are increasingly interested in using compositional system models (system models created from independent models of system components) to validate design decisions early in and throughout system design. Compositional system models, however, have several failure modes that often result in infeasible or failed model evaluation. In addition, these models change frequently as designs are refined, changing the model domain (set of valid inputs and states). To compute valid results, the system model inputs and states must remain within this domain throughout simulation. This paper develops an algorithm to efficiently quantify the system model domain. To do this, we (1) present a formulation for system model feasibility and identify types of system model failures, (2) develop a design space exploration algorithm that quantifies the system model domain, and (3) illustrate this algorithm using a solar-powered unmanned aerial vehicle model. This algorithm enables systematic improvements of compositional system model feasibility.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4005861","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Design Space Exploration for Quantifying a System Model’s Feasible Domain","journal":"Journal of Mechanical Design","year":2012,"volume":"134","issue":"4","page":"041010","doi":"10.1115/1.4005861","authors_resolved":[{"family":"Larson","given":"Brad J."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Larson, B. J. & Mattson, C. A. (2012). Design Space Exploration for Quantifying a System Model’s Feasible Domain. Journal of Mechanical Design, 134(4), Article 041010. https://doi.org/10.1115/1.4005861","mla":"Larson, Brad J., and Christopher A. Mattson. \"Design Space Exploration for Quantifying a System Model’s Feasible Domain.\" Journal of Mechanical Design, vol. 134, no. 4, 2012, p. 041010, https://doi.org/10.1115/1.4005861.","chicago_author_date":"Larson, Brad J. and Christopher A. Mattson. 2012. \"Design Space Exploration for Quantifying a System Model’s Feasible Domain.\" Journal of Mechanical Design 134 (4): 041010. https://doi.org/10.1115/1.4005861.","chicago_bibliography":"Larson, Brad J. and Christopher A. Mattson. \"Design Space Exploration for Quantifying a System Model’s Feasible Domain.\" Journal of Mechanical Design 134, no. 4 (2012): 041010. https://doi.org/10.1115/1.4005861.","chicago_footnote":"Brad J. Larson and Christopher A. Mattson, \"Design Space Exploration for Quantifying a System Model’s Feasible Domain,\" Journal of Mechanical Design 134, no. 4 (2012): 041010, https://doi.org/10.1115/1.4005861.","ieee":"B. J. Larson and C. A. Mattson, \"Design Space Exploration for Quantifying a System Model’s Feasible Domain,\" Journal of Mechanical Design, vol. 134, no. 4, Art. no. 041010, Apr. 2012, doi: 10.1115/1.4005861.","bibtex":"@article{larson2012design,\n  author    = {Larson, Brad J. and Mattson, Christopher A.},\n  title     = {Design Space Exploration for Quantifying a System Model’s Feasible Domain},\n  journal   = {Journal of Mechanical Design},\n  volume    = {134},\n  number    = {4},\n  pages     = {041010},\n  year      = {2012},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4005861}\n}"},{"id":"efficient-propagation-of-error-through-system-models-for-functions-common-in-eng","slug":"/efficient-propagation-of-error-through-system-models-for-functions-common-in-eng","title":"Efficient Propagation of Error Through System Models for Functions Common in Engineering","catalog_title":"Efficient Propagation of Error Through System Models for Functions Common in Engineering","abstract":"System modeling can help designers make and verify design decisions early in the design process if the model’s accuracy can be determined. The formula typically used to analytically propagate error is based on a first-order Taylor series expansion. Consequently, this formula can be wrong by one or more orders of magnitude for nonlinear systems. Clearly, adding higher-order terms increases the accuracy of the approximation but it also requires higher computational cost. This paper shows that truncation error can be reduced and accuracy increased without additional computational cost by applying a predictable correction factor to lower-order approximations. The efficiency of this method is demonstrated in the kinematic model of a flapping wing. While Taylor series error propagation is typically applicable only to closed-form equations, the procedure followed in this paper may be used with other types of models, provided that model outputs can be determined from model inputs, derivatives can be calculated, and truncation error is predictable.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4005444","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Efficient Propagation of Error Through System Models for Functions Common in Engineering","journal":"Journal of Mechanical Design","year":2012,"volume":"134","issue":"1","page":"014501","doi":"10.1115/1.4005444","authors_resolved":[{"family":"Anderson","given":"Travis V."},{"family":"Mattson","given":"Christopher A."},{"family":"Larson","given":"Brad J."},{"family":"Fullwood","given":"David T."}],"notes":[],"apa":"Anderson, T. V., Mattson, C. A., Larson, B. J., & Fullwood, D. T. (2012). Efficient Propagation of Error Through System Models for Functions Common in Engineering. Journal of Mechanical Design, 134(1), Article 014501. https://doi.org/10.1115/1.4005444","mla":"Anderson, Travis V., et al. \"Efficient Propagation of Error Through System Models for Functions Common in Engineering.\" Journal of Mechanical Design, vol. 134, no. 1, 2012, p. 014501, https://doi.org/10.1115/1.4005444.","chicago_author_date":"Anderson, Travis V., Christopher A. Mattson, Brad J. Larson, and David T. Fullwood. 2012. \"Efficient Propagation of Error Through System Models for Functions Common in Engineering.\" Journal of Mechanical Design 134 (1): 014501. https://doi.org/10.1115/1.4005444.","chicago_bibliography":"Anderson, Travis V., Christopher A. Mattson, Brad J. Larson, and David T. Fullwood. \"Efficient Propagation of Error Through System Models for Functions Common in Engineering.\" Journal of Mechanical Design 134, no. 1 (2012): 014501. https://doi.org/10.1115/1.4005444.","chicago_footnote":"Travis V. Anderson, Christopher A. Mattson, Brad J. Larson, and David T. Fullwood, \"Efficient Propagation of Error Through System Models for Functions Common in Engineering,\" Journal of Mechanical Design 134, no. 1 (2012): 014501, https://doi.org/10.1115/1.4005444.","ieee":"T. V. Anderson, C. A. Mattson, B. J. Larson, and D. T. Fullwood, \"Efficient Propagation of Error Through System Models for Functions Common in Engineering,\" Journal of Mechanical Design, vol. 134, no. 1, Art. no. 014501, Jan. 2012, doi: 10.1115/1.4005444.","bibtex":"@article{anderson2012efficient,\n  author    = {Anderson, Travis V. and Mattson, Christopher A. and Larson, Brad J. and Fullwood, David T.},\n  title     = {Efficient Propagation of Error Through System Models for Functions Common in Engineering},\n  journal   = {Journal of Mechanical Design},\n  volume    = {134},\n  number    = {1},\n  pages     = {014501},\n  year      = {2012},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4005444}\n}"},{"id":"hybrid-bishop-hill-model-for-elastic-yield-limited-design-with-non-orthorhombic","slug":"/hybrid-bishop-hill-model-for-elastic-yield-limited-design-with-non-orthorhombic","title":"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals","catalog_title":"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals","abstract":"A method is presented for adapting the classical Bishop-Hill model to the requirements of elastic/yield-limited design in metals of arbitrary crystallographic texture. The proposed Hybrid Bishop-Hill (HBH) model, which will be applied to ductile FCC metals, retains the “stress corners” of the polyhedral Bishop-Hill yield surface. However, it replaces the ‘maximum work criterion’ with a criterion that maximizes the projection of the applicable local corner stress state onto the macroscopic stress state. This compromise leads to a model that is much more accessible to yield-limited design problems. Demonstration of performance for the HBH model is presented for an extensive database for oxygen free electronic copper. The design problem considered is a hole-in-a-plate configuration of thin sheets loaded in uniaxial tension in arbitrary directions relative to the principal directions of material orthorhombicity. Results obtained demonstrate that HBH-based elastic/yield limited design is capable of predicting complex and highly nonintuitive behaviors, even within standard problems.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4004829","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals","journal":"Journal of Engineering Materials and Technology","year":2012,"volume":"134","issue":"1","page":"011003","doi":"10.1115/1.4004829","authors_resolved":[{"family":"Takahashi","given":"Ribeka"},{"family":"Prasai","given":"Dikshya"},{"family":"Adams","given":"Brent L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Takahashi, R., Prasai, D., Adams, B. L., & Mattson, C. A. (2012). Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals. Journal of Engineering Materials and Technology, 134(1), Article 011003. https://doi.org/10.1115/1.4004829","mla":"Takahashi, Ribeka, et al. \"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals.\" Journal of Engineering Materials and Technology, vol. 134, no. 1, 2012, p. 011003, https://doi.org/10.1115/1.4004829.","chicago_author_date":"Takahashi, Ribeka, Dikshya Prasai, Brent L. Adams, and Christopher A. Mattson. 2012. \"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals.\" Journal of Engineering Materials and Technology 134 (1): 011003. https://doi.org/10.1115/1.4004829.","chicago_bibliography":"Takahashi, Ribeka, Dikshya Prasai, Brent L. Adams, and Christopher A. Mattson. \"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals.\" Journal of Engineering Materials and Technology 134, no. 1 (2012): 011003. https://doi.org/10.1115/1.4004829.","chicago_footnote":"Ribeka Takahashi, Dikshya Prasai, Brent L. Adams, and Christopher A. Mattson, \"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals,\" Journal of Engineering Materials and Technology 134, no. 1 (2012): 011003, https://doi.org/10.1115/1.4004829.","ieee":"R. Takahashi, D. Prasai, B. L. Adams, and C. A. Mattson, \"Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals,\" Journal of Engineering Materials and Technology, vol. 134, no. 1, Art. no. 011003, Jan. 2012, doi: 10.1115/1.4004829.","bibtex":"@article{takahashi2012hybrid,\n  author    = {Takahashi, Ribeka and Prasai, Dikshya and Adams, Brent L. and Mattson, Christopher A.},\n  title     = {Hybrid Bishop-Hill Model for Elastic-Yield Limited Design With Non-orthorhombic Polycrystalline Metals},\n  journal   = {Journal of Engineering Materials and Technology},\n  volume    = {134},\n  number    = {1},\n  pages     = {011003},\n  year      = {2012},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4004829}\n}"},{"id":"propagating-skewness-and-kurtosis-through-engineering-models-for-low-cost-meanin","slug":"/propagating-skewness-and-kurtosis-through-engineering-models-for-low-cost-meanin","title":"Propagating Skewness and Kurtosis Through Engineering Models for Low-Cost, Meaningful, Nondeterministic Design","catalog_title":"Propagating Skewness and Kurtosis Through Engineering Models for Low-Cost, Meaningful, Nondeterministic Design","abstract":"System models help designers predict actual system output. Generally, variation in system inputs creates variation in system outputs. Designers often propagate variance through a system model by taking a derivative-based weighted sum of each input’s variance. This method is based on a Taylor-series expansion. Having an output mean and variance, designers typically assume the outputs are Gaussian. This paper demonstrates that outputs are rarely Gaussian for nonlinear functions, even with Gaussian inputs. This paper also presents a solution for system designers to more meaningfully describe the system output distribution. This solution consists of using equations derived from a second-order Taylor series that propagate skewness and kurtosis through a system model. If a second-order Taylor series is used to propagate variance, these higher-order statistics can also be propagated with minimal additional computational cost. These higher-order statistics allow the system designer to more accurately describe the distribution of possible outputs. The benefits of including higher-order statistics in error propagation are clearly illustrated in the example of a flat-rolling metalworking process used to manufacture metal plates.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4007389","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Propagating Skewness and Kurtosis Through Engineering Models for Low-Cost, Meaningful, Nondeterministic Design","journal":"Journal of Mechanical Design","year":2012,"volume":"134","issue":"10","page":"100911","doi":"10.1115/1.4007389","authors_resolved":[{"family":"Anderson","given":"Travis V."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Anderson, T. V. & Mattson, C. A. (2012). Propagating Skewness and Kurtosis Through Engineering Models for Low-Cost, Meaningful, Nondeterministic Design. Journal of Mechanical Design, 134(10), Article 100911. https://doi.org/10.1115/1.4007389","mla":"Anderson, Travis V., and Christopher A. Mattson. \" istopher Mattson. \"A Computationally-assisted Methodology for Preference-guided Conceptual Design.\" 13th AIAA/ISSMO Multidisciplinary Analysis Optimization Conference (2010). https://doi.org/10.2514/6.2010-9175.","chicago_footnote":"Garrett Barnum and Christopher Mattson, \"A Computationally-assisted Methodology for Preference-guided Conceptual Design,\" 13th AIAA/ISSMO Multidisciplinary Analysis Optimization Conference (2010), https://doi.org/10.2514/6.2010-9175.","ieee":"G. Barnum and C. Mattson, \"A Computationally-assisted Methodology for Preference-guided Conceptual Design,\" 13th AIAA/ISSMO Multidisciplinary Analysis Optimization Conference, Sep. 2010, doi: 10.2514/6.2010-9175.","bibtex":"@article{barnum2010computationally,\n  author    = {Barnum, Garrett and Mattson, Christopher},\n  title     = {A Computationally-assisted Methodology for Preference-guided Conceptual Design},\n  journal   = {13th AIAA/ISSMO Multidisciplinary Analysis Optimization Conference},\n  year      = {2010},\n  publisher = {American Institute of Aeronautics and Astronautics},\n  doi       = {10.2514/6.2010-9175}\n}"},{"id":"capitalizing-on-heterogeneity-and-anisotropy-to-design-desirable-hardware-that-i","slug":"/capitalizing-on-heterogeneity-and-anisotropy-to-design-desirable-hardware-that-i","title":"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer","catalog_title":"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer","abstract":"This paper presents a method for treating material microstructure (crystallographic grain size, orientation, and distribution) as design variables that can be manipulated—for common or exotic materials—to identify the unusual material properties and to design devices that are difficult to reverse engineer. A practical approach, carefully tied to proven manufacturing strategies, is used to tailor the material microstructures by strategically orienting and laminating thin anisotropic metallic sheets. The approach, coupled with numerical optimization, manipulates the material microstructures to obtain the desired material properties at designer-specified locations (heterogeneously) or across the entire part (homogeneously). A comparative study is provided, which examines various microstructures for a simple fixed geometry. These cases show how the proposed approach can provide hardware with enhanced mechanical performance in a way that is disguised within the microscopic features of the material microstructure.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4001874","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer","journal":"Journal of Mechanical Design","year":2010,"volume":"132","issue":"8","page":"081001","doi":"10.1115/1.4001874","authors_resolved":[{"family":"Harston","given":"Stephen P."},{"family":"Mattson","given":"Christopher A."},{"family":"Adams","given":"Brent L."}],"notes":[],"apa":"Harston, S. P., Mattson, C. A., & Adams, B. L. (2010). Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer. Journal of Mechanical Design, 132(8), Article 081001. https://doi.org/10.1115/1.4001874","mla":"Harston, Stephen P., et al. \"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer.\" Journal of Mechanical Design, vol. 132, no. 8, 2010, p. 081001, https://doi.org/10.1115/1.4001874.","chicago_author_date":"Harston, Stephen P., Christopher A. Mattson, and Brent L. Adams. 2010. \"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer.\" Journal of Mechanical Design 132 (8): 081001. https://doi.org/10.1115/1.4001874.","chicago_bibliography":"Harston, Stephen P., Christopher A. Mattson, and Brent L. Adams. \"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer.\" Journal of Mechanical Design 132, no. 8 (2010): 081001. https://doi.org/10.1115/1.4001874.","chicago_footnote":"Stephen P. Harston, Christopher A. Mattson, and Brent L. Adams, \"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer,\" Journal of Mechanical Design 132, no. 8 (2010): 081001, https://doi.org/10.1115/1.4001874.","ieee":"S. P. Harston, C. A. Mattson, and B. L. Adams, \"Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer,\" Journal of Mechanical Design, vol. 132, no. 8, Art. no. 081001, Aug. 2010, doi: 10.1115/1.4001874.","bibtex":"@article{harston2010capitalizing,\n  author    = {Harston, Stephen P. and Mattson, Christopher A. and Adams, Brent L.},\n  title     = {Capitalizing on Heterogeneity and Anisotropy to Design Desirable Hardware That is Difficult to Reverse Engineer},\n  journal   = {Journal of Mechanical Design},\n  volume    = {132},\n  number    = {8},\n  pages     = {081001},\n  year      = {2010},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4001874}\n}"},{"id":"metrics-for-evaluating-the-barrier-and-time-to-reverse-engineer-a-product","slug":"/metrics-for-evaluating-the-barrier-and-time-to-reverse-engineer-a-product","title":"Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product","catalog_title":"Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product","abstract":"Reverse engineering, defined as extracting information about a product from the product itself, is a common industry practice for gaining insight into innovative products. Both the original designer and those reverse engineering the original design can benefit from estimating the time and barrier to reverse engineer a product. This paper presents a set of metrics and parameters that can be used to calculate the barrier to reverse engineer any product, as well as the time required to do so. To the original designer, these numerical representations of the barrier and time can be used to strategically identify and improve product characteristics so as to increase the difficulty and time to reverse engineer them. As the metrics and parameters developed in this paper are quantitative in nature, they can also be used in conjunction with numerical optimization techniques, thereby enabling products to be developed with a maximum reverse engineering barrier and time—at a minimum development cost. On the other hand, these quantitative measures enable competitors who reverse engineer original designs to focus their efforts on products that will result in the greatest return on investment.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4001347","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product","journal":"Journal of Mechanical Design","year":2010,"volume":"132","issue":"4","page":"041009","doi":"10.1115/1.4001347","authors_resolved":[{"family":"Harston","given":"Stephen P."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Harston, S. P. & Mattson, C. A. (2010). Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product. Journal of Mechanical Design, 132(4), Article 041009. https://doi.org/10.1115/1.4001347","mla":"Harston, Stephen P., and Christopher A. Mattson. \"Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product.\" Journal of Mechanical Design, vol. 132, no. 4, 2010, p. 041009, https://doi.org/10.1115/1.4001347.","chicago_author_date":"Harston, Stephen P. and Christopher A. Mattson. 2010. \"Metrics for Evaluating the Barrier and Time to Reverse Engineer a Product.\" Journal of Mechanical Design 132 (4): 041009. https://doi.org/10.1115/1.4001347.","chicago_bib ion and selection with s-Pareto frontiers,\" International Journal of Product Development 9, no. 1/2/3 (2009): 32, https://doi.org/10.1504/ijpd.2009.026173.","ieee":"C. A. Mattson, A. A. Mullur, and A. Messac, \"Case studies in concept exploration and selection with s-Pareto frontiers,\" International Journal of Product Development, vol. 9, no. 1/2/3, pp. 32, 2009, doi: 10.1504/ijpd.2009.026173.","bibtex":"@article{mattson2009case,\n  author    = {Mattson, C.A. and Mullur, A.A. and Messac, A.},\n  title     = {Case studies in concept exploration and selection with s-Pareto frontiers},\n  journal   = {International Journal of Product Development},\n  volume    = {9},\n  number    = {1/2/3},\n  pages     = {32},\n  year      = {2009},\n  publisher = {Inderscience Publishers},\n  doi       = {10.1504/ijpd.2009.026173}\n}"},{"id":"configuration-selection-modeling-and-preliminary-testing-in-support-of-constant","slug":"/configuration-selection-modeling-and-preliminary-testing-in-support-of-constant","title":"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors","catalog_title":"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors","abstract":"The recent introduction and advancements in design of simple, constant-force mechanisms have created the potential for small-scale, low-cost, constant-force electronic connectors (CFECs). CFECs differ from traditional connectors by the separation or disassociation of contact normal force and contact deflection. By removing the traditional constraints imposed by forces and deflections that are dependent on each other, new types of electronic connectors can be explored. These new designs may lead to smaller and more reliable electronic connectors. In this paper, constant-force mechanisms are adapted to satisfy current industry practices for the design of electronic connectors. Different CFEC configurations are explored and one is selected, prototyped, and used as a proof-of-concept connector for a personal digital assistant (PDA) docking station. The modeling, optimization, and verification of the prototype CFEC is presented. Adaptation of constant-force technology to electronic connectors creates new possibilities in electronic connector designs, including allowing an optimal contact force to be utilized to decrease the effects of fretting and wear, lowering required manufacturing tolerances, reducing the system’s sensitivity to variations introduced by the user, and increasing the system’s robustness in applications where movement or vibrations exist.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.2721080","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors","journal":"Journal of Electronic Packaging","year":2007,"volume":"129","issue":"3","page":"236","doi":"10.1115/1.2721080","authors_resolved":[{"family":"Weight","given":"Brent L."},{"family":"Mattson","given":"Christopher A."},{"family":"Magleby","given":"Spencer P."},{"family":"Howell","given":"Larry L."}],"notes":[],"apa":"Weight, B. L., Mattson, C. A., Magleby, S. P., & Howell, L. L. (2007). Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors. Journal of Electronic Packaging, 129(3), 236. https://doi.org/10.1115/1.2721080","mla":"Weight, Brent L., et al. \"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors.\" Journal of Electronic Packaging, vol. 129, no. 3, 2007, p. 236, https://doi.org/10.1115/1.2721080.","chicago_author_date":"Weight, Brent L., Christopher A. Mattson, Spencer P. Magleby, and Larry L. Howell. 2007. \"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors.\" Journal of Electronic Packaging 129 (3): 236. https://doi.org/10.1115/1.2721080.","chicago_bibliography":"Weight, Brent L., Christopher A. Mattson, Spencer P. Magleby, and Larry L. Howell. \"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors.\" Journal of Electronic Packaging 129, no. 3 (2007): 236. https://doi.org/10.1115/1.2721080.","chicago_footnote":"Brent L. Weight, Christopher A. Mattson, Spencer P. Magleby, and Larry L. Howell, \"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors,\" Journal of Electronic Packaging 129, no. 3 (2007): 236, https://doi.org/10.1115/1.2721080.","ieee":"B. L. Weight, C. A. Mattson, S. P. Magleby, and L. L. Howell, \"Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors,\" Journal of Electronic Packaging, vol. 129, no. 3, pp. 236, Sep. 2007, doi: 10.1115/1.2721080.","bibtex":"@article{weight2007configuration,\n  author    = {Weight, Brent L. and Mattson, Christopher A. and Magleby, Spencer P. and Howell, Larry L.},\n  title     = {Configuration Selection, Modeling, and Preliminary Testing in Support of Constant Force Electrical Connectors},\n  journal   = {Journal of Electronic Packaging},\n  volume    = {129},\n  number    = {3},\n  pages     = {236},\n  year      = {2007},\n  publisher = {ASME International},\n  doi       = {10.1115/1.2721080}\n}"}];
    const REPO_BOOTSTRAP = {"version":1,"updatedAt":"2026-09-03T18:42:43.323Z","drafts":{"for-the-benefit-of-the-world-conference-desx-abstracts-2025":{"navTitle":"","slug":"","catalogId":"","catalogUrl":"","h1":"","teaser":"","abstract":"","publisherUrl":"","apa":"","mla":"","chicago":"","ieee":"","bibtex":""},"path-optimization-from-en-route-3d-printed-aircraft-using-physics-based-estimati":{"navTitle":"path optimization from en route 3d printed aircraft using physics based estimati","slug":"path-optimization-from-en-route-3d-printed-aircraft-using-physics-based-estimati","catalogId":"path-optimization-from-en-route-3d-printed-aircraft-using-physics-based-estimati","catalogUrl":"/path-optimization-from-en-route-3d-printed-aircraft-using-physics-based-estimati","h1":"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models","teaser":"Abstract In a previous study, a general approach to increasing the range capability of an unmanned aerial system was assessed by 3D printing components or parts for the unmanned aerial systems (UAS) while a carrier platform, of both the printer and UAS systems, travels to a launch point for the UAS.","abstract":"Abstract In a previous study, a general approach to increasing the range capability of an unmanned aerial system was assessed by 3D printing components or parts for the unmanned aerial systems (UAS) while a carrier platform, of both the printer and UAS systems, travels to a launch point for the UAS. As a result, the platform could launch the UAS from a distance further away from the location of interest. This article outlines the parameters of a physics-based model to determine the actual range increase of an attritable aircraft, constrained by the amount of time available for printing while en route. It develops the formulation of the UAS range increase from the lift-to-drag ratio increases caused by the physical wing section enhancements printed in a constrained amount of time while the carrier platform travels from one location to another. The relationship is leveraged to optimize the shortest path necessary for the carrier platform to access or reach the set of locations of interest in an operational environment. Scenarios of up to 15 locations are explored by first optimizing the sequence of the locations in a traveling salesman problem and then optimizing the actual path taken by the carrier platform along that sequence. Statistical results are presented to summarize the benefits of 3D printing en route across different scenarios.","publisherUrl":"https://doi.org/10.1115/1.4069685","apa":"Dickerson, T. J., Salmon, J. L., & Mattson, C. A. (2026). Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models. Journal of Mechanical Design, 148(4), Article 041704. https://doi.org/10.1115/1.4069685","mla":"Dickerson, Tevin J., et al. \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models.\" Journal of Mechanical Design, vol. 148, no. 4, 2026, p. 041704, https://doi.org/10.1115/1.4069685.","chicago":"Dickerson, Tevin J., John L. Salmon, and Christopher A. Mattson. 2026. \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models.\" Journal of Mechanical Design 148 (4): 041704. https://doi.org/10.1115/1.4069685.","ieee":"T. J. Dickerson, J. L. Salmon, and C. A. Mattson, \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models,\" Journal of Mechanical Design, vol. 148, no. 4, Art. no. 041704, Apr. 2026, doi: 10.1115/1.4069685.","bibtex":"@article{dickerson2026path,\n  author    = {Dickerson, Tevin J. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models},\n  journal   = {Journal of Mechanical Design},\n  volume    = {148},\n  number    = {4},\n  pages     = {041704},\n  year      = {2026},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4069685}\n}"},"an-approach-for-developing-a-decision-support-tool-for-emerging-concepts-designi":{"navTitle":"an approach for developing a decision support tool for emerging concepts designi","slug":"an-approach-for-developing-a-decision-support-tool-for-emerging-concepts-designi","catalogId":"an-approach-for-developing-a-decision-support-tool-for-emerging-concepts-designi","catalogUrl":"/an-approach-for-developing-a-decision-support-tool-for-emerging-concepts-designi","h1":"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions","teaser":"Abstract Developing decision support tools (DSTs) for novel or poorly defined design challenges presents unique challenges.","abstract":"Abstract Developing decision support tools (DSTs) for novel or poorly defined design challenges presents unique challenges. Emerging concepts often lack established design data and are characterized by high uncertainty and unconventional requirements, requiring a structured approach to tool development. This paper examines insights gained from two sources: (1) the development of a DST for early-stage exploration of blended wing body (BWB) aircraft, and (2) from the application of the Product Architecture Strategies and Effects (PASE) database. By leveraging these complementary sources, we identify nine principles to guide effective DST development in such environments. Our findings address fundamental challenges such as balancing resource efficiency with analytical depth, structuring user interactions to enhance decision-making, and ensuring that DSTs remain adaptable in evolving design environments. Finally, by drawing insights from these tools, we propose a framework for constructing DSTs that support exploratory design under uncertainty, providing actionable guidelines for structuring decision-making in engineering fields where innovation requires navigating ambiguity and incomplete data.1","publisherUrl":"https://doi.org/10.1115/detc2025-169042","apa":"Humphrey, T. M., Wooley, H. C. W., Mattson, C. A., Anderson, M. L., & Carr, R. W. (2025). An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions. Volume 3B: 51st Design Automation Conference (DAC), V03BT03A037. https://doi.org/10.1115/detc2025-169042","mla":"Humphrey, Tyson M., et al. \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions.\" Volume 3B: 51st Design Automation Conference (DAC), 2025, p. V03BT03A037, https://doi.org/10.1115/detc2025-169042.","chicago":"Humphrey, Tyson M., Henry C. W. Wooley, Christopher A. Mattson, Michael L. Anderson, and Ryan W. Carr. 2025. \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions.\" Volume 3B: 51st Design Automation Conference (DAC): V03BT03A037. https://doi.org/10.1115/detc2025-169042.","ieee":"T. M. Humphrey, H. C. W. Wooley, C. A. Mattson, M. L. Anderson, and R. W. Carr, \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions,\" Volume 3B: 51st Design Automation Conference (DAC), pp. V03BT03A037, Aug. 2025, doi: 10.1115/detc2025-169042.","bibtex":"@article{humphrey2025approach,\n  author    = {Humphrey, Tyson M. and Wooley, Henry C. W. and Mattson, Christopher A. and Anderson, Michael L. and Carr, Ryan W.},\n  title     = {An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions},\n  journal   = {Volume 3B: 51st Design Automation Conference (DAC)},\n  pages     = {V03BT03A037},\n  year      = {2025},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2025-169042}\n}"},"designing-for-machine-longevity-a-literature-survey":{"navTitle":"designing for machine longevity a literature survey","slug":"designing-for-machine-longevity-a-literature-survey","catalogId":"designing-for-machine-longevity-a-literature-survey","catalogUrl":"/designing-for-machine-longevity-a-literature-survey","h1":"Designing for Machine Longevity - A Literature Survey","teaser":"ABSTRACT: Complex machines are increasingly expensive to develop and build, which causes many to be maintained in service for longer than initially designed, as they still effectively perform valuable tasks.","abstract":"ABSTRACT: Complex machines are increasingly expensive to develop and build, which causes many to be maintained in service for longer than initially designed, as they still effectively perform valuable tasks. Longlasting, effective service lives of centuries rather than decades are a valuable characteristic for certain machines in several industries, whether for continual service, extended storage, or extremely remote deployment, such as in military service, agriculture and space exploration. Although there are various archival publications that focus on longevity, we seek to identify product architecture decisions which impact a machine’s longevity and can then be extrapolated out for timescales greater than 100 years. We refer to this as hyper-longevity. This paper seeks to find patterns in the literature that can identify causes linked to longevity effects, their frequency in the literature, and the types of impacts they have in facilitating longevity.","publisherUrl":"https://doi.org/10.1017/pds.2025.10147","apa":"Rice, S. E., Sannar, B. C., Mattson, C. A., & Anderson, M. L. (2025). Designing for Machine Longevity - A Literature Survey. Proceedings of the Design Society, 5, 1335. https://doi.org/10.1017/pds.2025.10147","mla":"Rice, Scott E., et al. \"Designing for Machine Longevity - A Literature Survey.\" Proceedings of the Design Society, vol. 5, 2025, p. 1335, https://doi.org/10.1017/pds.2025.10147.","chicago":"Rice, Scott E., Benjamin C. Sannar, Christopher A. Mattson, and Michael L. Anderson. 2025. \"Designing for Machine Longevity - A Literature Survey.\" Proceedings of the Design Society 5: 1335. https://doi.org/10.1017/pds.2025.10147.","ieee":"S. E. Rice, B. C. Sannar, C. A. Mattson, and M. L. Anderson, \"Designing for Machine Longevity - A Literature Survey,\" Proceedings of the Design Society, vol. 5, pp. 1335, Aug. 2025, doi: 10.1017/pds.2025.10147.","bibtex":"@article{rice2025designing,\n  author    = {Rice, Scott E. and Sannar, Benjamin C. and Mattson, Christopher A. and Anderson, Michael L.},\n  title     = {Designing for Machine Longevity - A Literature Survey},\n  journal   = {Proceedings of the Design Society},\n  volume    = {5},\n  pages     = {1335},\n  year      = {2025},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2025.10147}\n}"},"extending-solid-principles-to-systems-engineering-leveraging-sysml-for-modular-d":{"navTitle":"extending solid principles to systems engineering leveraging sysml for modular d","slug":"extending-solid-principles-to-systems-engineering-leveraging-sysml-for-modular-d","catalogId":"extending-solid-principles-to-systems-engineering-leveraging-sysml-for-modular-d","catalogUrl":"/extending-solid-principles-to-systems-engineering-leveraging-sysml-for-modular-d","h1":"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis","teaser":"Abstract Software systems are usually designed for modularity and maintenance due to ever-changing package and system configurations and have, in recent years, implemented abstract design methods such as Agile Development and SOLID Principles.","abstract":"Abstract Software systems are usually designed for modularity and maintenance due to ever-changing package and system configurations and have, in recent years, implemented abstract design methods such as Agile Development and SOLID Principles. Software Engineering can also be considered a subdivision of the large and extensive field of Systems Engineering (SE), and therefore, extending and applying Agile and SOLID Principles into SE may be beneficial as SE also must respond to changing requirements, technology obsolescence and evolution, stakeholders dynamics, and other factors. A commonly used format for Systems Engineering is SysML. This paper seeks to develop a method for quantifying feature os SysML that can help validate SOLID and Agile design principles. During this process and development, tools are proposed to help users make better decisions when designing SysML diagrams and in other SE processes. Diagrams are then converted to Design Structure Matrices, Domain Mapping Matrices, and Multi-Domain Matrices. These matrices are then used to measure the system complexity. A case study with a simple arduino blinking light is presented.","publisherUrl":"https://doi.org/10.1115/detc2025-169752","apa":"Dickerson, T., Salmon, J. L., & Mattson, C. A. (2025). Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis. Volume 2B: 45th Computers and Information in Engineering Conference (CIE), V02BT02A062. https://doi.org/10.1115/detc2025-169752","mla":"Dickerson, Tevin, et al. \"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis.\" Volume 2B: 45th Computers and Information in Engineering Conference (CIE), 2025, p. V02BT02A062, https://doi.org/10.1115/detc2025-169752.","chicago":"Dickerson, Tevin, John L. Salmon, and Christopher A. Mattson. 2025. \"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis.\" Volume 2B: 45th Computers and Information in Engineering Conference (CIE): V02BT02A062. https://doi.org/10.1115/detc2025-169752.","ieee":"T. Dickerson, J. L. Salmon, and C. A. Mattson, \"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis,\" Volume 2B: 45th Computers and Information in Engineering Conference (CIE), pp. V02BT02A062, Aug. 2025, doi: 10.1115/detc2025-169752.","bibtex":"@article{dickerson2025extending,\n  author    = {Dickerson, Tevin and Salmon, John L. and Mattson, Christopher A.},\n  title     = {Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis},\n  journal   = {Volume 2B: 45th Computers and Information in Engineering Conference (CIE)},\n  pages     = {V02BT02A062},\n  year      = {2025},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2025-169752}\n}"},"graph-based-social-impact-diffusion-optimization-across-a-theoretical-socio-tech":{"navTitle":"graph based social impact diffusion optimization across a theoretical socio tech","slug":"graph-based-social-impact-diffusion-optimization-across-a-theoretical-socio-tech","catalogId":"graph-based-social-impact-diffusion-optimization-across-a-theoretical-socio-tech","catalogUrl":"/graph-based-social-impact-diffusion-optimization-across-a-theoretical-socio-tech","h1":"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System","teaser":"ABSTRACT: The engineering design community has increased their focus on sustainable development, which has resulted in design methodologies and optimization techniques for the design of socio-technical systems involving engineered products.","abstract":"ABSTRACT: The engineering design community has increased their focus on sustainable development, which has resulted in design methodologies and optimization techniques for the design of socio-technical systems involving engineered products. An essential part of design for sustainable development is understanding the social impacts that technology has on people. Social impact diffusion can model how these impacts propagate through society. This paper combines social impact diffusion models, graph-based socio-technical representations, and computational optimization techniques to present a social impact diffusion objective function for optimizing social impact in socio-technical systems. The results of the paper indicate that using social impact diffusion objective functions can improve upon random or best guess designs for socio-technical systems.","publisherUrl":"https://doi.org/10.1017/pds.2025.10210","apa":"McKinnon, S. A. & Mattson, C. A. (2025). Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System. Proceedings of the Design Society, 5, 1963. https://doi.org/10.1017/pds.2025.10210","mla":"McKinnon, Samuel A., and Christopher A. Mattson. \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System.\" Proceedings of the Design Society, vol. 5, 2025, p. 1963, https://doi.org/10.1017/pds.2025.10210.","chicago":"McKinnon, Samuel A. and Christopher A. Mattson. 2025. \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System.\" Proceedings of the Design Society 5: 1963. https://doi.org/10.1017/pds.2025.10210.","ieee":"S. A. McKinnon and C. A. Mattson, \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System,\" Proceedings of the Design Society, vol. 5, pp. 1963, Aug. 2025, doi: 10.1017/pds.2025.10210.","bibtex":"@article{mckinnon2025graph,\n  author    = {McKinnon, Samuel A. and Mattson, Christopher A.},\n  title     = {Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System},\n  journal   = {Proceedings of the Design Society},\n  volume    = {5},\n  pages     = {1963},\n  year      = {2025},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2025.10210}\n}"},"quantifiable-theory-of-change":{"navTitle":"quantifiable theory of change","slug":"quantifiable-theory-of-change","catalogId":"quantifiable-theory-of-change","catalogUrl":"/quantifiable-theory-of-change","h1":"Quantifiable Theory of Change","teaser":"Presents a quantifiable Theory of Change approach for measuring and designing toward intended social outcomes.","abstract":"Presents a quantifiable Theory of Change approach for measuring and designing toward intended social outcomes.","publisherUrl":"https://doi.org/10.1109/ghtc66843.2025.11266770","apa":"Busse, F., Mattson, C., & Spring, T. (2025). Quantifiable Theory of Change. 2025 IEEE Global Humanitarian Technology Conference (GHTC), 1. https://doi.org/10.1109/ghtc66843.2025.11266770","mla":"Busse, Franz, et al. \"Quantifiable Theory of Change.\" 2025 IEEE Global Humanitarian Technology Conference (GHTC), 2025, p. 1, https://doi.org/10.1109/ghtc66843.2025.11266770.","chicago":"Busse, Franz, Chris Mattson, and Truman Spring. 2025. \"Quantifiable Theory of Change.\" 2025 IEEE Global Humanitarian Technology Conference (GHTC): 1. https://doi.org/10.1109/ghtc66843.2025.11266770.","ieee":"F. Busse, C. Mattson, and T. Spring, \"Quantifiable Theory of Change,\" 2025 IEEE Global Humanitarian Technology Conference (GHTC), pp. 1, Oct. 2025, doi: 10.1109/ghtc66843.2025.11266770.","bibtex":"@article{busse2025quantifiable,\n  author    = {Busse, Franz and Mattson, Chris and Spring, Truman},\n  title     = {Quantifiable Theory of Change},\n  journal   = {2025 IEEE Global Humanitarian Technology Conference (GHTC)},\n  pages     = {1},\n  year      = {2025},\n  publisher = {IEEE},\n  doi       = {10.1109/ghtc66843.2025.11266770}\n}"},"a-decision-support-system-for-multi-stakeholder-exploration-of-the-airship-desig":{"navTitle":"a decision support system for multi stakeholder exploration of the airship desig","slug":"a-decision-support-system-for-multi-stakeholder-exploration-of-the-airship-desig","catalogId":"a-decision-support-system-for-multi-stakeholder-exploration-of-the-airship-desig","catalogUrl":"/a-decision-support-system-for-multi-stakeholder-exploration-of-the-airship-desig","h1":"A decision support system for multi-stakeholder exploration of the airship design space","teaser":"Although there have been oscillations in airship interest since their use in the early 1900s, technological advancements and the need for more flexible and environmentally friendly transportation modes have caused a stream of study and surge in airship development in recent years.","abstract":"Although there have been oscillations in airship interest since their use in the early 1900s, technological advancements and the need for more flexible and environmentally friendly transportation modes have caused a stream of study and surge in airship development in recent years. For companies and governments to understand how airships can be incorporated into their fleets to fulfill new or existing mission types, system design space exploration is an important step in understanding airships, their uses, and their design parameters. A decision support system (DSS), Design Exploration of Lighter-Than-Air Systems (DELTAS), was developed to help stakeholders with this task. DELTAS allows users to design airships and missions to determine how a design will perform in the scenario. As airships are sensitive to elevation and altitude, wind and terrain can also be studied to see how they may affect a mission scenario. Simulations can also be run for a given mission to find the Pareto-optimal designs for user-defined ranges of high-level airship design parameters. A case study is provided that demonstrates how DELTAS can be used to explore the airship design space for a specified mission. This case study shows how a design of experiments is important to more thoroughly cover the design space and to find and understand the relationships between airship design variables that lead to optimal mission times and costs.","publisherUrl":"https://doi.org/10.1177/15485129231164416","apa":"Richards, D., Salmon, J. L., Dickerson, T. J., Mattson, C. A., & Neff, W. J. (2024). A decision support system for multi-stakeholder exploration of the airship design space. The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology, 21(4), 363. https://doi.org/10.1177/15485129231164416","mla":"Richards, DC, et al. \"A decision support system for multi-stakeholder exploration of the airship design space.\" The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology, vol. 21, no. 4, 2024, p. 363, https://doi.org/10.1177/15485129231164416.","chicago":"Richards, DC, John L Salmon, Tevin J Dickerson, Christopher A Mattson, and William J Neff. 2024. \"A decision support system for multi-stakeholder exploration of the airship design space.\" The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology 21 (4): 363. https://doi.org/10.1177/15485129231164416.","ieee":"D. Richards, J. L. Salmon, T. J. Dickerson, C. A. Mattson, and W. J. Neff, \"A decision support system for multi-stakeholder exploration of the airship design space,\" The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology, vol. 21, no. 4, pp. 363, Oct. 2024, doi: 10.1177/15485129231164416.","bibtex":"@article{richards2024decision,\n  author    = {Richards, DC and Salmon, John L and Dickerson, Tevin J and Mattson, Christopher A and Neff, William J},\n  title     = {A decision support system for multi-stakeholder exploration of the airship design space},\n  journal   = {The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology},\n  volume    = {21},\n  number    = {4},\n  pages     = {363},\n  year      = {2024},\n  publisher = {SAGE Publications},\n  doi       = {10.1177/15485129231164416}\n}"},"a-formal-consideration-of-user-tactics-during-product-evaluation-in-early-stage":{"navTitle":"a formal consideration of user tactics during product evaluation in early stage","slug":"a-formal-consideration-of-user-tactics-during-product-evaluation-in-early-stage","catalogId":"a-formal-consideration-of-user-tactics-during-product-evaluation-in-early-stage","catalogUrl":"/a-formal-consideration-of-user-tactics-during-product-evaluation-in-early-stage","h1":"A formal consideration of user tactics during product evaluation in early-stage product development","teaser":"Formalizes user tactics during early product evaluation to better connect intended use with design decisions.","abstract":"Formalizes user tactics during early product evaluation to better connect intended use with design decisions.","publisherUrl":"https://doi.org/10.1504/ijpd.2024.137784","apa":"Owens, T., Mattson, C. A., Sorensen, C. D., & Anderson, M. L. (2024). A formal consideration of user tactics during product evaluation in early-stage product development. International Journal of Product Development, 28(1/2), 104. https://doi.org/10.1504/ijpd.2024.137784","mla":"Owens, Trent, et al. \"A formal consideration of user tactics during product evaluation in early-stage product development.\" International Journal of Product Development, vol. 28, no. 1/2, 2024, p. 104, https://doi.org/10.1504/ijpd.2024.137784.","chicago":"Owens, Trent, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. 2024. \"A formal consideration of user tactics during product evaluation in early-stage product development.\" International Journal of Product Development 28 (1/2): 104. https://doi.org/10.1504/ijpd.2024.137784.","ieee":"T. Owens, C. A. Mattson, C. D. Sorensen, and M. L. Anderson, \"A formal consideration of user tactics during product evaluation in early-stage product development,\" International Journal of Product Development, vol. 28, no. 1/2, pp. 104, 2024, doi: 10.1504/ijpd.2024.137784.","bibtex":"@article{owens2024formal,\n  author    = {Owens, Trent and Mattson, Christopher A. and Sorensen, Carl D. and Anderson, Michael L.},\n  title     = {A formal consideration of user tactics during product evaluation in early-stage product development},\n  journal   = {International Journal of Product Development},\n  volume    = {28},\n  number    = {1/2},\n  pages     = {104},\n  year      = {2024},\n  publisher = {Inderscience Publishers},\n  doi       = {10.1504/ijpd.2024.137784}\n}"},"an-approach-for-predicting-social-environmental-and-economic-product-impacts-and":{"navTitle":"an approach for predicting social environmental and economic product impacts and","slug":"an-approach-for-predicting-social-environmental-and-economic-product-impacts-and","catalogId":"an-approach-for-predicting-social-environmental-and-economic-product-impacts-and","catalogUrl":"/an-approach-for-predicting-social-environmental-and-economic-product-impacts-and","h1":"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design","teaser":"Abstract There is a growing demand for sustainable products and systems.","abstract":"Abstract There is a growing demand for sustainable products and systems. Sustainability encompasses environmental, social, and economic aspects, often referred to as the three pillars of sustainability. To make more sustainable design decisions, engineers need tools to predict the environmental, social, and economic impacts of products and characterize potential sustainability tradeoffs. To predict the total impact of a product, the quantity of functional units of the product in society and the impact of each product needs to be estimated. This article uses agent-based modeling (ABM), combined with tools such as life cycle assessment (LCA), to predict impacts across all three pillars of sustainability. By using the product impact results, the multidimensional sustainability tradespace can be characterized. The approach described in this article is based on three main components for the predictive modeling of product impacts and the characterization of the sustainability trade space: (i) ABM of product adoption, (ii) the assessment of product impacts, and (iii) an approach for the characterization of product sustainability tradeoffs at the population level. The tradespace characterization uses a Pareto-based method presented visually to find the nondominated solutions in the product impact space. To illustrate and describe how to use the method, a case study is presented that predicts the impact of residential solar panels in a region of the United States under various scenarios. The findings of the case study can help policy makers understand suitable implementation strategies for residential solar panels while considering the impact tradeoffs involved.","publisherUrl":"https://doi.org/10.1115/1.4064041","apa":"Mabey, C. S., Dickerson, T. J., Salmon, J. L., & Mattson, C. A. (2024). An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design. Journal of Mechanical Design, 146(2), Article 020904. https://doi.org/10.1115/1.4064041","mla":"Mabey, Christopher S., et al. \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design.\" Journal of Mechanical Design, vol. 146, no. 2, 2024, p. 020904, https://doi.org/10.1115/1.4064041.","chicago":"Mabey, Christopher S., Tevin J. Dickerson, John L. Salmon, and Christopher A. Mattson. 2024. \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design.\" Journal of Mechanical Design 146 (2): 020904. https://doi.org/10.1115/1.4064041.","ieee":"C. S. Mabey, T. J. Dickerson, J. L. Salmon, and C. A. Mattson, \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design,\" Journal of Mechanical Design, vol. 146, no. 2, Art. no. 020904, Feb. 2024, doi: 10.1115/1.4064041.","bibtex":"@article{mabey2024approach,\n  author    = {Mabey, Christopher S. and Dickerson, Tevin J. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design},\n  journal   = {Journal of Mechanical Design},\n  volume    = {146},\n  number    = {2},\n  pages     = {020904},\n  year      = {2024},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4064041}\n}"},"optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders":{"navTitle":"optimizing engineered products for their social impacts on multiple stakeholders","slug":"optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders","catalogId":"optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders","catalogUrl":"/optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders","h1":"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders","teaser":"Abstract Engineered products are often optimized based on engineering requirements, user requirements, cost, and performance.","abstract":"Abstract Engineered products are often optimized based on engineering requirements, user requirements, cost, and performance. This strategy is well suited for most applications, but products designed specifically to improve the lives of users and communities would benefit from an approach that helps engineers optimize a product based also on its social impacts. This paper introduces several optimization problem formulations adapted from multi-stakeholder strategies in the economics and business management literature. Each optimization problem formulation optimizes a product’s social impact according to the ideology and principles inherent to the adapted multi-stakeholder strategy. A case study is presented for a cassava peeling machine that is being developed for farmers in the Brazilian Amazon. Finally, the resulting peeler design configurations and social impacts are discussed to illustrate the advantages and disadvantages of each strategy.","publisherUrl":"https://doi.org/10.1115/1.4064694","apa":"Stevenson, P. D., Mattson, C. A., Salmon, J. L., & Hatch, N. W. (2024). Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders. Journal of Mechanical Design, 146(9), Article 091702. https://doi.org/10.1115/1.4064694","mla":"Stevenson, Phillip D., et al. \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders.\" Journal of Mechanical Design, vol. 146, no. 9, 2024, p. 091702, https://doi.org/10.1115/1.4064694.","chicago":"Stevenson, Phillip D., Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. 2024. \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders.\" Journal of Mechanical Design 146 (9): 091702. https://doi.org/10.1115/1.4064694.","ieee":"P. D. Stevenson, C. A. Mattson, J. L. Salmon, and N. W. Hatch, \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders,\" Journal of Mechanical Design, vol. 146, no. 9, Art. no. 091702, Sep. 2024, doi: 10.1115/1.4064694.","bibtex":"@article{stevenson2024optimizing,\n  author    = {Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W.},\n  title     = {Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders},\n  journal   = {Journal of Mechanical Design},\n  volume    = {146},\n  number    = {9},\n  pages     = {091702},\n  year      = {2024},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4064694}\n}"},"product-architecture-strategies-and-effects-matrices-for-early-evaluation-and-se":{"navTitle":"product architecture strategies and effects matrices for early evaluation and se","slug":"product-architecture-strategies-and-effects-matrices-for-early-evaluation-and-se","catalogId":"product-architecture-strategies-and-effects-matrices-for-early-evaluation-and-se","catalogUrl":"/product-architecture-strategies-and-effects-matrices-for-early-evaluation-and-se","h1":"Product architecture strategies and effects matrices for early evaluation and selection of product architectures","teaser":"Abstract Product architecture decisions are made early in the product development process and have far-reaching effects.","abstract":"Abstract Product architecture decisions are made early in the product development process and have far-reaching effects. Unless anticipated through experience or intuition, many of these effects may not be apparent until much later in the development process, making changes to the architecture costly in time, effort and resources. Many researchers through the years have studied various elements of product architecture and their effects. By using a repeatable process for aggregating statements on the effects of architecture strategies from a selection of the literature on the topic and storing them in a systematic database, this information can then be recalled and presented in the form of a Product Architecture Strategy and Effect (PASE) matrix. PASE matrices allow for the identification, comparison, evaluation, and then selection of the most desirable product architecture strategies before expending resources along a specific development path. This paper introduces the PASE Database and matrix and describes their construction and use in guiding design decisions. This paper also provides metrics for understanding the robustness of this database.","publisherUrl":"https://doi.org/10.1017/dsj.2024.18","apa":"Rice, S. E., Sannar, B. C., McKinnon, S. A., Humphrey, T. M., Mattson, C. A., Sorensen, C. D., & Anderson, M. L. (2024). Product architecture strategies and effects matrices for early evaluation and selection of product architectures. Design Science, 10, e41. https://doi.org/10.1017/dsj.2024.18","mla":"Rice, Scott E., et al. \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures.\" Design Science, vol. 10, 2024, p. e41, https://doi.org/10.1017/dsj.2024.18.","chicago":"Rice, Scott E., Benjamin C. Sannar, Samuel A. McKinnon, Tyson M. Humphrey, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. 2024. \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures.\" Design Science 10: e41. https://doi.org/10.1017/dsj.2024.18.","ieee":"S. E. Rice, B. C. Sannar, S. A. McKinnon, T. M. Humphrey, C. A. Mattson, C. D. Sorensen, and M. L. Anderson, \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures,\" Design Science, vol. 10, pp. e41, Dec. 2024, doi: 10.1017/dsj.2024.18.","bibtex":"@article{rice2024product,\n  author    = {Rice, Scott E. and Sannar, Benjamin C. and McKinnon, Samuel A. and Humphrey, Tyson M. and Mattson, Christopher A. and Sorensen, Carl D. and Anderson, Michael L.},\n  title     = {Product architecture strategies and effects matrices for early evaluation and selection of product architectures},\n  journal   = {Design Science},\n  volume    = {10},\n  pages     = {e41},\n  year      = {2024},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2024.18}\n}"},"advancing-sustainable-development-emerging-factors-and-futures-for-the-engineeri":{"navTitle":"advancing sustainable development emerging factors and futures for the engineeri","slug":"advancing-sustainable-development-emerging-factors-and-futures-for-the-engineeri","catalogId":"advancing-sustainable-development-emerging-factors-and-futures-for-the-engineeri","catalogUrl":"/advancing-sustainable-development-emerging-factors-and-futures-for-the-engineeri","h1":"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field","teaser":"This study set out to identify emerging trends in advancing engineering for sustainable development, supporting the engineering workforce to address wicked problems, and strengthening pathways between engineering education, industry, and policy.","abstract":"This study set out to identify emerging trends in advancing engineering for sustainable development, supporting the engineering workforce to address wicked problems, and strengthening pathways between engineering education, industry, and policy. The following question guided this work: What are the emerging factors impacting the future of global sustainability efforts within engineering, and how can these be amplified to increase the impact of engineering for sustainable development? Using an adapted Delphi method with surveys, focus groups, and member-checking interviews, we hosted the American Society of Mechanical Engineers (ASME) 2022 Engineering Global Development (EGD) Stakeholder Summit. The summit convened industry leaders, innovators, and academics to explore emerging factors impacting the future of global sustainability efforts in engineering. This manuscript synthesizes emerging trends and proposes recommendations for engineering, particularly in the specific focus area of engineering for sustainable development (e.g., ‘humanitarian engineering’, ‘global engineering’). Critical recommendations include the adoption of emerging cultural mindsets, which include: (1) take an interdisciplinary and multi-stakeholder approach, (2) consider dynamic and interconnected systems, (3) increase humility and intercultural competence, (4) prioritize diversity and inclusion, (5) increase localization and center community perspectives, (6) challenge the perception that engineering is neutral, and (7) broaden the goals of engineering. Ultimately, this study highlights pathways forward for the broader engineering community to more effectively contribute to advancing the United Nations Sustainable Development Goals.","publisherUrl":"https://doi.org/10.3390/su15107869","apa":"Burleson, G., Lajoie, J., Mabey, C., Sours, P., Ventrella, J., Peiffer, E., Stine, E., Stettler Kleine, M., MacDonald, L., Austin-Breneman, J., Javernick-Will, A., Winter, A., Lucena, J., Knight, D., Daniel, S., Thomas, E., Mattson, C., & Aranda, I. (2023). Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field. Sustainability, 15(10), 7869. https://doi.org/10.3390/su15107869","mla":"Burleson, Grace, et al. \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field.\" Sustainability, vol. 15, no. 10, 2023, p. 7869, https://doi.org/10.3390/su15107869.","chicago":"Burleson, Grace, Jason Lajoie, Christopher Mabey, Patrick Sours, Jennifer Ventrella, Erin Peiffer, Emma Stine, Marie Stettler Kleine, Laura MacDonald, Jesse Austin-Breneman, Amy Javernick-Will, Amos Winter, Juan Lucena, David Knight, Scott Daniel, Evan Thomas, Christopher Mattson, and Iana Aranda. 2023. \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field.\" Sustainability 15 (10): 7869. https://doi.org/10.3390/su15107869.","ieee":"G. Burleson, J. Lajoie, C. Mabey, P. Sours, J. Ventrella, E. Peiffer, E. Stine, M. Stettler Kleine, L. MacDonald, J. Austin-Breneman, A. Javernick-Will, A. Winter, J. Lucena, D. Knight, S. Daniel, E. Thomas, C. Mattson, and I. Aranda, \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field,\" Sustainability, vol. 15, no. 10, pp. 7869, May 2023, doi: 10.3390/su15107869.","bibtex":"@article{burleson2023advancing,\n  author    = {Burleson, Grace and Lajoie, Jason and Mabey, Christopher and Sours, Patrick and Ventrella, Jennifer and Peiffer, Erin and Stine, Emma and Stettler Kleine, Marie and MacDonald, Laura and Austin-Breneman, Jesse and Javernick-Will, Amy and Winter, Amos and Lucena, Juan and Knight, David and Daniel, Scott and Thomas, Evan and Mattson, Christopher and Aranda, Iana},\n  title     = {Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field},\n  journal   = {Sustainability},\n  volume    = {15},\n  number    = {10},\n  pages     = {7869},\n  year      = {2023},\n  publisher = {MDPI AG},\n  doi       = {10.3390/su15107869}\n}"},"agent-based-product-social-impact-modeling-a-systematic-literature-review-and-mo":{"navTitle":"agent based product social impact modeling a systematic literature review and mo","slug":"agent-based-product-social-impact-modeling-a-systematic-literature-review-and-mo","catalogId":"agent-based-product-social-impact-modeling-a-systematic-literature-review-and-mo","catalogUrl":"/agent-based-product-social-impact-modeling-a-systematic-literature-review-and-mo","h1":"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process","teaser":"Abstract A key part of an engineer’s purpose is to create products and services that benefit society, or, in other words, to create products with a positive social impact.","abstract":"Abstract A key part of an engineer’s purpose is to create products and services that benefit society, or, in other words, to create products with a positive social impact. While engineers have many predictive models to aid in making design decisions about the functional performance or safety of a product, very few models exist for estimating or planning for the wide range of social impacts an engineered product can have. To model social impact, a model must contain representations of both the product and society. Agent-based modeling is a tool that can model society and incorporate social impact factors. In this paper, we investigate factors that have historically limited the usefulness of product adoption agent-based models and predictive social impact models through a systematic literature review. Common themes of limiting factors are identified, steps are presented to improve the usefulness of agent-based product adoption models and predictive social impact models, and a general process for the creation of agent-based social impact models is presented. Improving the usefulness of these predictive models can aid engineers in making better design decisions. Predictive social impact models can help identify areas in the design space to improve the social impact of products. When coupled with existing design methods, agent-based predictive social impact models can help increase the probability that a product achieves positive social impact.","publisherUrl":"https://doi.org/10.1115/1.4063004","apa":"Mabey, C. S., Salmon, J. L., & Mattson, C. A. (2023). Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process. Journal of Mechanical Design, 145(11), Article 110801. https://doi.org/10.1115/1.4063004","mla":"Mabey, Christopher S., et al. \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process.\" Journal of Mechanical Design, vol. 145, no. 11, 2023, p. 110801, https://doi.org/10.1115/1.4063004.","chicago":"Mabey, Christopher S., John L. Salmon, and Christopher A. Mattson. 2023. \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process.\" Journal of Mechanical Design 145 (11): 110801. https://doi.org/10.1115/1.4063004.","ieee":"C. S. Mabey, J. L. Salmon, and C. A. Mattson, \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process,\" Journal of Mechanical Design, vol. 145, no. 11, Art. no. 110801, Nov. 2023, doi: 10.1115/1.4063004.","bibtex":"@article{mabey2023agent,\n  author    = {Mabey, Christopher S. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {11},\n  pages     = {110801},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4063004}\n}"},"an-approach-for-including-social-impact-measures-in-systems-design-exploration":{"navTitle":"an approach for including social impact measures in systems design exploration","slug":"an-approach-for-including-social-impact-measures-in-systems-design-exploration","catalogId":"an-approach-for-including-social-impact-measures-in-systems-design-exploration","catalogUrl":"/an-approach-for-including-social-impact-measures-in-systems-design-exploration","h1":"An approach for including social impact measures in systems design exploration","teaser":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability.","abstract":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability. This paper seeks to explore interactions between design parameters when social impacts are incorporated into the concept development phase of the systems design process. Social impact evaluation is increasing in importance similar to what has happened in recent years with environmental impact consideration in the design of engineered products. Concurrently, research into new airship design has increased. Airships have yet to be reintroduced at a large scale or for a range of applications in society. Although airships have the potential for positive environmental and economic impacts, the social impacts are still rarely considered. This paper presents a case study of the hypothetical introduction of airships in the Amazon region of Brazil to help local farmers transport their produce to market. It explores the design space in terms of both engineering parameters and social impacts using a discrete-event simulation to model the system. The social impacts are found to be dependent not only on the social factors and airship design parameters but also on the farmer-airship system, suggesting that socio-technical systems design will be
