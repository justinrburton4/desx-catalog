, John and Salmon, John L.},\n  title     = {Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {3},\n  pages     = {030801},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4055325}\n}"},{"id":"use-of-simulation-and-wear-prediction-to-explore-design-improvements-to-the-cup","slug":"/use-of-simulation-and-wear-prediction-to-explore-design-improvements","title":"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system","catalog_title":"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system","abstract":"Uses simulation and wear prediction to improve cup seals in India Mark II/III hand pumps.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1016/j.deveng.2022.100092","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system","journal":"Development Engineering","year":2022,"volume":"7","issue":"","page":"100092","doi":"10.1016/j.deveng.2022.100092","authors_resolved":[{"family":"Ottosson","given":"Hans J."},{"family":"Mattson","given":"Christopher A."},{"family":"Johnson","given":"Oliver K."},{"family":"Irot","given":"Immy"}],"notes":[],"apa":"Ottosson, H. J., Mattson, C. A., Johnson, O. K., & Irot, I. (2022). Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system. Development Engineering, 7, Article 100092. https://doi.org/10.1016/j.deveng.2022.100092","mla":"Ottosson, Hans J., et al. \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system.\" Development Engineering, vol. 7, 2022, p. 100092, https://doi.org/10.1016/j.deveng.2022.100092.","chicago_author_date":"Ottosson, Hans J., Christopher A. Mattson, Oliver K. Johnson, and Immy Irot. 2022. \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system.\" Development Engineering 7: 100092. https://doi.org/10.1016/j.deveng.2022.100092.","chicago_bibliography":"Ottosson, Hans J., Christopher A. Mattson, Oliver K. Johnson, and Immy Irot. \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system.\" Development Engineering 7 (2022): 100092. https://doi.org/10.1016/j.deveng.2022.100092.","chicago_footnote":"Hans J. Ottosson, Christopher A. Mattson, Oliver K. Johnson, and Immy Irot, \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system,\" Development Engineering 7 (2022): 100092, https://doi.org/10.1016/j.deveng.2022.100092.","ieee":"H. J. Ottosson, C. A. Mattson, O. K. Johnson, and I. Irot, \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system,\" Development Engineering, vol. 7, Art. no. 100092, 2022, doi: 10.1016/j.deveng.2022.100092.","bibtex":"@article{ottosson2022use,\n  author    = {Ottosson, Hans J. and Mattson, Christopher A. and Johnson, Oliver K. and Irot, Immy},\n  title     = {Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system},\n  journal   = {Development Engineering},\n  volume    = {7},\n  pages     = {100092},\n  year      = {2022},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2022.100092}\n}"},{"id":"a-framework-for-predicting-potential-product-impact-during-product-design","slug":"/a-framework-for-predicting-potential-product-impact-during-product-design","title":"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN","catalog_title":"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN","abstract":"Abstract The impact of products is becoming a topic of concern in society. Product impact may fall under the categories of economic, environmental, or social impact and is defined by the effect of a product on day-to-day life. Design teams lack sufficient tools to predict the impact of products they are designing. In this paper we present a framework for the prediction of product impact during product design. This framework integrates models of the product, scenario, society, and impact into an agent-based model to predict product impact. Although this paper focuses on social impact, the framework can also be applied to economic or environmental impacts. An illustration of using the framework is also presented. Agent-based modeling has been used previously for adoption models, but it has not been extended to predict product impact. Having tools for impact prediction allows for optimizing the product design parameters to increase potential positive impact and reduce potential negative impact.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/pds.2021.11","badge":"conference","categories":["Other"],"hidden":false,"resolved_title":"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN","journal":"Proceedings of the Design Society","year":2021,"volume":"1","issue":"","page":"101","doi":"10.1017/pds.2021.11","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Armstrong","given":"Andrew G."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."},{"family":"Hatch","given":"Nile W."}],"notes":[],"apa":"Mabey, C. S., Armstrong, A. G., Mattson, C. A., Salmon, J. L., & Hatch, N. W. (2021). A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN. Proceedings of the Design Society, 1, 101. https://doi.org/10.1017/pds.2021.11","mla":"Mabey, Christopher S., et al. \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN.\" Proceedings of the Design Society, vol. 1, 2021, p. 101, https://doi.org/10.1017/pds.2021.11.","chicago_author_date":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. 2021. \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN.\" Proceedings of the Design Society 1: 101. https://doi.org/10.1017/pds.2021.11.","chicago_bibliography":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN.\" Proceedings of the Design Society 1 (2021): 101. https://doi.org/10.1017/pds.2021.11.","chicago_footnote":"Christopher S. Mabey, Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, and Nile W. Hatch, \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN,\" Proceedings of the Design Society 1 (2021): 101, https://doi.org/10.1017/pds.2021.11.","ieee":"C. S. Mabey, A. G. Armstrong, C. A. Mattson, J. L. Salmon, and N. W. Hatch, \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN,\" Proceedings of the Design Society, vol. 1, pp. 101, Aug. 2021, doi: 10.1017/pds.2021.11.","bibtex":"@article{mabey2021framework,\n  author    = {Mabey, Christopher S. and Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W.},\n  title     = {A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN},\n  journal   = {Proceedings of the Design Society},\n  volume    = {1},\n  pages     = {101},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2021.11}\n}"},{"id":"a-computational-simulation-based-framework-for-estimating-potential-product-impa","slug":"/a-computational-simulation-framework-for-estimating-potential-product-impact","title":"A computational simulation-based framework for estimating potential product impact during product design","catalog_title":"A computational simulation-based framework for estimating potential product impact during product design","abstract":"Abstract The impact of engineered products is a topic of concern in society. Product impact may fall under the categories of economic, environmental or social impact, with the last category defined as the effect of a product on the day-to-day life of people. Design teams lack sufficient tools to estimate the social impact of products, and the combined impacts of economic, environmental and social impacts for the products they are designing. This paper aims to provide a framework for the estimation of product impact during product design. To estimate product impact, models of both the product and society are required. This framework integrates models of the product, scenario, society and impact into an agent-based model to estimate product impact. Although this paper demonstrates the framework using only social impact, the framework can also be applied to economic or environmental impacts individually or all three concurrently. Agent-based modelling has been used previously for product adoption models, but it has not been extended to estimate product impact. Having tools for impact estimation allows for optimising the product design parameters to increase the potential positive impact and reduce potential negative impact.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/dsj.2021.16","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"A computational simulation-based framework for estimating potential product impact during product design","journal":"Design Science","year":2021,"volume":"7","issue":"","page":"e15","doi":"10.1017/dsj.2021.16","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Armstrong","given":"Andrew G."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."},{"family":"Hatch","given":"Nile W."},{"family":"Dahlin","given":"Eric C."}],"notes":[],"apa":"Mabey, C. S., Armstrong, A. G., Mattson, C. A., Salmon, J. L., Hatch, N. W., & Dahlin, E. C. (2021). A computational simulation-based framework for estimating potential product impact during product design. Design Science, 7, e15. https://doi.org/10.1017/dsj.2021.16","mla":"Mabey, Christopher S., et al. \"A computational simulation-based framework for estimating potential product impact during product design.\" Design Science, vol. 7, 2021, p. e15, https://doi.org/10.1017/dsj.2021.16.","chicago_author_date":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, Nile W. Hatch, and Eric C. Dahlin. 2021. \"A computational simulation-based framework for estimating potential product impact during product design.\" Design Science 7: e15. https://doi.org/10.1017/dsj.2021.16.","chicago_bibliography":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, Nile W. Hatch, and Eric C. Dahlin. \"A computational simulation-based framework for estimating potential product impact during product design.\" Design Science 7 (2021): e15. https://doi.org/10.1017/dsj.2021.16.","chicago_footnote":"Christopher S. Mabey, Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, Nile W. Hatch, and Eric C. Dahlin, \"A computational simulation-based framework for estimating potential product impact during product design,\" Design Science 7 (2021): e15, https://doi.org/10.1017/dsj.2021.16.","ieee":"C. S. Mabey, A. G. Armstrong, C. A. Mattson, J. L. Salmon, N. W. Hatch, and E. C. Dahlin, \"A computational simulation-based framework for estimating potential product impact during product design,\" Design Science, vol. 7, pp. e15, Sep. 2021, doi: 10.1017/dsj.2021.16.","bibtex":"@article{mabey2021computational,\n  author    = {Mabey, Christopher S. and Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W. and Dahlin, Eric C.},\n  title     = {A computational simulation-based framework for estimating potential product impact during product design},\n  journal   = {Design Science},\n  volume    = {7},\n  pages     = {e15},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2021.16}\n}"},{"id":"fmea-inspired-analysis-for-social-impact-of-engineered-products","slug":"/fmea-inspired-analysis-for-social-impact-of-engineered-products","title":"FMEA-Inspired Analysis for Social Impact of Engineered Products","catalog_title":"FMEA-Inspired Analysis for Social Impact of Engineered Products","abstract":"Abstract Social Impact has been widely discussed by the engineering community, but studies show that there is currently little systematic consideration of the social impact of products in both academia and in industry beyond social impacts on health and safety. This paper illustrates how Failure Mode and Effect Analaysis (FMEA) style analysis can be applied to evaluating the social impact of products. The authors propose a new method titled Social Impact Effects Analysis (SIEA), describe how it is performed, and explain the benefits of performing SIEA.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2021-70595","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"FMEA-Inspired Analysis for Social Impact of Engineered Products","journal":"Volume 3B: 47th Design Automation Conference (DAC)","year":2021,"volume":"","issue":"","page":"V03BT03A017","doi":"10.1115/detc2021-70595","authors_resolved":[{"family":"Armstrong","given":"Andrew G."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."},{"family":"Dahlin","given":"Eric C."}],"notes":[],"apa":"Armstrong, A. G., Mattson, C. A., Salmon, J. L., & Dahlin, E. C. (2021). FMEA-Inspired Analysis for Social Impact of Engineered Products. Volume 3B: 47th Design Automation Conference (DAC), V03BT03A017. https://doi.org/10.1115/detc2021-70595","mla":"Armstrong, Andrew G., et al. \"FMEA-Inspired Analysis for Social Impact of Engineered Products.\" Volume 3B: 47th Design Automation Conference (DAC), 2021, p. V03BT03A017, https://doi.org/10.1115/detc2021-70595.","chicago_author_date":"Armstrong, Andrew G., Christopher A. Mattson, John L. Salmon, and Eric C. Dahlin. 2021. \"FMEA-Inspired Analysis for Social Impact of Engineered Products.\" Volume 3B: 47th Design Automation Conference (DAC): V03BT03A017. https://doi.org/10.1115/detc2021-70595.","chicago_bibliography":"Armstrong, Andrew G., Christopher A. Mattson, John L. Salmon, and Eric C. Dahlin. \"FMEA-Inspired Analysis for Social Impact of Engineered Products.\" Volume 3B: 47th Design Automation Conference (DAC) (2021): V03BT03A017. https://doi.org/10.1115/detc2021-70595.","chicago_footnote":"Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, and Eric C. Dahlin, \"FMEA-Inspired Analysis for Social Impact of Engineered Products,\" Volume 3B: 47th Design Automation Conference (DAC) (2021): V03BT03A017, https://doi.org/10.1115/detc2021-70595.","ieee":"A. G. Armstrong, C. A. Mattson, J. L. Salmon, and E. C. Dahlin, \"FMEA-Inspired Analysis for Social Impact of Engineered Products,\" Volume 3B: 47th Design Automation Conference (DAC), pp. V03BT03A017, Aug. 2021, doi: 10.1115/detc2021-70595.","bibtex":"@article{armstrong2021fmea,\n  author    = {Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Dahlin, Eric C.},\n  title     = {FMEA-Inspired Analysis for Social Impact of Engineered Products},\n  journal   = {Volume 3B: 47th Design Automation Conference (DAC)},\n  pages     = {V03BT03A017},\n  year      = {2021},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2021-70595}\n}"},{"id":"factors-leading-to-sustainable-social-impact-on-the-affected-communities-of-engi","slug":"/factors-leading-to-sustainable-social-impact-on-affected-communities","title":"Factors leading to sustainable social impact on the affected communities of engineering service learning projects","catalog_title":"Factors leading to sustainable social impact on the affected communities of engineering service learning projects","abstract":"Identifies factors that lead to sustainable social impact from engineering service-learning projects.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1016/j.deveng.2021.100066","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Factors leading to sustainable social impact on the affected communities of engineering service learning projects","journal":"Development Engineering","year":2021,"volume":"6","issue":"","page":"100066","doi":"10.1016/j.deveng.2021.100066","authors_resolved":[{"family":"Armstrong","given":"Andrew G."},{"family":"Mattson","given":"Christopher A."},{"family":"Lewis","given":"Randy S."}],"notes":[],"apa":"Armstrong, A. G., Mattson, C. A., & Lewis, R. S. (2021). Factors leading to sustainable social impact on the affected communities of engineering service learning projects. Development Engineering, 6, Article 100066. https://doi.org/10.1016/j.deveng.2021.100066","mla":"Armstrong, Andrew G., et al. \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects.\" Development Engineering, vol. 6, 2021, p. 100066, https://doi.org/10.1016/j.deveng.2021.100066.","chicago_author_date":"Armstrong, Andrew G., Christopher A. Mattson, and Randy S. Lewis. 2021. \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects.\" Development Engineering 6: 100066. https://doi.org/10.1016/j.deveng.2021.100066.","chicago_bibliography":"Armstrong, Andrew G., Christopher A. Mattson, and Randy S. Lewis. \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects.\" Development Engineering 6 (2021): 100066. https://doi.org/10.1016/j.deveng.2021.100066.","chicago_footnote":"Andrew G. Armstrong, Christopher A. Mattson, and Randy S. Lewis, \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects,\" Development Engineering 6 (2021): 100066, https://doi.org/10.1016/j.deveng.2021.100066.","ieee":"A. G. Armstrong, C. A. Mattson, and R. S. Lewis, \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects,\" Development Engineering, vol. 6, Art. no. 100066, 2021, doi: 10.1016/j.deveng.2021.100066.","bibtex":"@article{armstrong2021factors,\n  author    = {Armstrong, Andrew G. and Mattson, Christopher A. and Lewis, Randy S.},\n  title     = {Factors leading to sustainable social impact on the affected communities of engineering service learning projects},\n  journal   = {Development Engineering},\n  volume    = {6},\n  pages     = {100066},\n  year      = {2021},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2021.100066}\n}"},{"id":"integrating-social-impact-measures-into-the-airship-design-process","slug":"/integrating-social-impact-measures-into-the-airship-design-process","title":"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS","catalog_title":"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS","abstract":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability. This paper seeks to determine the interaction between design parameters when the social impacts are incorporated into the design process. Social impact evaluation is increasing in importance similar to what has happened with environmental impact consideration in recent years in the design of engineered products. Concurrently, research into new airship design has increased, however airships have yet to be reintroduced at a large scale and for a range of applications in society. Although airships have the potential for positive environmental and economic impacts, the social impacts are still rarely considered. This paper presents a case study of the hypothetical introduction of airships in the Amazon to help local farmers transport their produce to market. It explores the design space in terms of the airship's social impacts connected to the design parameters. The social impacts are found to be dependent not only on the social factors and airship design parameters, but also on the farmer-airship system, suggesting that socio-technical systems design will benefit from integrated social impact metric analysis.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/pds.2021.449","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS","journal":"Proceedings of the Design Society","year":2021,"volume":"1","issue":"","page":"1877","doi":"10.1017/pds.2021.449","authors_resolved":[{"family":"Richards","given":"D.C."},{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Richards, D. C., Stevenson, P. D., Mattson, C. A., & Salmon, J. L. (2021). INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS. Proceedings of the Design Society, 1, 1877. https://doi.org/10.1017/pds.2021.449","mla":"Richards, D.C., et al. \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS.\" Proceedings of the Design Society, vol. 1, 2021, p. 1877, https://doi.org/10.1017/pds.2021.449.","chicago_author_date":"Richards, D.C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. 2021. \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS.\" Proceedings of the Design Society 1: 1877. https://doi.org/10.1017/pds.2021.449.","chicago_bibliography":"Richards, D.C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS.\" Proceedings of the Design Society 1 (2021): 1877. https://doi.org/10.1017/pds.2021.449.","chicago_footnote":"D.C. Richards, Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon, \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS,\" Proceedings of the Design Society 1 (2021): 1877, https://doi.org/10.1017/pds.2021.449.","ieee":"D. C. Richards, P. D. Stevenson, C. A. Mattson, and J. L. Salmon, \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS,\" Proceedings of the Design Society, vol. 1, pp. 1877, Aug. 2021, doi: 10.1017/pds.2021.449.","bibtex":"@article{richards2021integrating,\n  author    = {Richards, D.C. and Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L.},\n  title     = {INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS},\n  journal   = {Proceedings of the Design Society},\n  volume    = {1},\n  pages     = {1877},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2021.449}\n}"},{"id":"identifying-high-potential-work-areas-in-engineering-for-global-development-link","slug":"/identifying-high-potential-work-areas-in-engineering-for-global-development-link","title":"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index","catalog_title":"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index","abstract":"Abstract Those working in Engineering for Global Development seek to improve the conditions in developing countries. A common metric for understanding the development state of a given country is the Human Development Index (HDI), which focuses on three dimensions: health, education, and income. An engineer’s expertise does not always align with any of those dimensions directly, while they still hope to perform impactful work for human development. To discover other areas of expertise that are highly associated with the HDI, correlations and variable selection were performed between all World Development Indicators and the HDI. The resultant associations are presented according to industry sector for a straightforward connection to engineering expertise. The associated areas of expertise can be used during opportunity development as surrogates for focusing on the HDI dimensions themselves. The data analysis shows that work related to “Trade, Transportation, and Utilities,” such as electricity distribution, and exports or imports, “Natural Resources and Mining,” such as energy resources, agriculture, or access to clean water, and “Manufacturing,” in general, are most commonly associated with improvements in the HDI in developing countries. Also, because the associations were discovered at country-level, they direct where geographically particular areas of expertise have been historically associated with improving HDI.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4048746","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index","journal":"Journal of Mechanical Design","year":2021,"volume":"143","issue":"6","page":"061404","doi":"10.1115/1.4048746","authors_resolved":[{"family":"Smith","given":"Daniel O."},{"family":"Mattson","given":"Christopher A."},{"family":"Dahlin","given":"Eric C."}],"notes":["Publisher link updated to stable DOI https://doi.org/10.1115/1.4048746 (catalog had a temporary/legacy link)."],"apa":"Smith, D. O., Mattson, C. A., & Dahlin, E. C. (2021). Identifying High-Potential Work Areas in Engineer t without problems that are often exacerbated when modeling social impact in an engineering for global development setting. The purpose of this paper is to articulate some of the barriers and open research questions for handling multiple stakeholder interests during the process of designing engineering for global development products. Six challenges and sixteen research questions are presented.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2021-71835","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development","journal":"Volume 3B: 47th Design Automation Conference (DAC)","year":2021,"volume":"","issue":"","page":"V03BT03A020","doi":"10.1115/detc2021-71835","authors_resolved":[{"family":"Stevenson","given":"Phillip D."},{"family":"Wood","given":"Amy E."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Stevenson, P. D., Wood, A. E., Mattson, C. A., & Salmon, J. L. (2021). Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development. Volume 3B: 47th Design Automation Conference (DAC), V03BT03A020. https://doi.org/10.1115/detc2021-71835","mla":"Stevenson, Phillip D., et al. \"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development.\" Volume 3B: 47th Design Automation Conference (DAC), 2021, p. V03BT03A020, https://doi.org/10.1115/detc2021-71835.","chicago_author_date":"Stevenson, Phillip D., Amy E. Wood, Christopher A. Mattson, and John L. Salmon. 2021. \"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development.\" Volume 3B: 47th Design Automation Conference (DAC): V03BT03A020. https://doi.org/10.1115/detc2021-71835.","chicago_bibliography":"Stevenson, Phillip D., Amy E. Wood, Christopher A. Mattson s’ Sustainable Development Goals (SDGs). Surveys showed high correlations between Health and Safety and Population Change to the majority of SEE Aspects. There were also high correlations between the SICs and economic and environmental factors. Further research will survey perceived relations between all three SEE impact categories.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2021-72065","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories","journal":"Volume 5: 26th Design for Manufacturing and the Life Cycle Conference (DFMLC)","year":2021,"volume":"","issue":"","page":"V005T05A028","doi":"10.1115/detc2021-72065","authors_resolved":[{"family":"Johnson","given":"Gabrielle E."},{"family":"Fisher","given":"Marin J."},{"family":"Salmon","given":"John L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Johnson, G. E., Fisher, M. J., Salmon, J. L., & Mattson, C. A. (2021). Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories. Volume 5: 26th Design for Manufacturing and the Life Cycle Conference (DFMLC), V005T05A028. https://doi.org/10.1115/detc2021-72065","mla":"Johnson, Gabrielle E., et al. \"Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories.\" Volume 5: 26th Design for Manufacturing and the Life Cycle Conference (DFMLC), 2021, p. V005T05A028, https://doi.org/10.1115/detc2021-72065.","chicago_author_date":"Johnson, Gabrielle E., Marin J. Fisher, John L. Salmon, and Christopher A. Mattson. 2021. \"Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories.\" Volume 5: 26th Design for Manufacturing and the Life C ping Countries","catalog_title":"Remote Data Collection Devices for Social Impact Indicators of Products in Developing Countries","abstract":"Designs remote data collection devices for tracking social impact indicators of products in developing countries.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1016/j.deveng.2021.100062","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Design of remote data collection devices for social impact indicators of products in developing countries","journal":"Development Engineering","year":2021,"volume":"6","issue":"","page":"100062","doi":"10.1016/j.deveng.2021.100062","authors_resolved":[{"family":"Stringham","given":"Bryan J."},{"family":"Mattson","given":"Christopher A."}],"notes":["Publisher link updated to stable DOI https://doi.org/10.1016/j.deveng.2021.100062 (catalog had a temporary/legacy link)."],"apa":"Stringham, B. J. & Mattson, C. A. (2021). Design of remote data collection devices for social impact indicators of products in developing countries. Development Engineering, 6, Article 100062. https://doi.org/10.1016/j.deveng.2021.100062","mla":"Stringham, Bryan J., and Christopher A. Mattson. \"Design of remote data collection devices for social impact indicators of products in developing countries.\" Development Engineering, vol. 6, 2021, p. 100062, https://doi.org/10.1016/j.deveng.2021.100062.","chicago_author_date":"Stringham, Bryan J. and Christopher A. Mattson. 2021. \"Design of remote data collection devices for social impact indicators of products in developing countries.\" Development Engineering 6: 100062. https://doi.org/10.1016/j.deveng.2021.100062.","chicago_bibliography":"Stringham, Bryan J. and Christopher A. Mattson. \"Design of remote data collection devices for social impact indicators of products in developing countries.\" Development Engineering 6 (2021): 100062. https://doi.org/10.1016/j.deveng.2021.100062.","chicago_footnote":"Bryan J. Stringham and Christopher A. Mattson, \"Design of remote data collection devices for social impact indicators of products in developing countries,\" Development Engineering 6 (2021): 100062, https://doi.org/10.1016/j.deveng.2021.100062.","ieee":"B. J. Stringham and C. A. Mattson, \"Design of remote data collection devices for social impact indicators of products in developing countries,\" Development Engineering, vol. 6, Art. no. 100062, 2021, doi: 10.1016/j.deveng.2021.100062.","bibtex":"@article{stringham2021design,\n  author    = {Stringham, Bryan J. and Mattson, Christopher A.},\n  title     = {Design of remote data collection devices for social impact indicators of products in developing countries},\n  journal   = {Development Engineering},\n  volume    = {6},\n  pages     = {100062},\n  year      = {2021},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2021.100062}\n}"},{"id":"analysis-of-perceived-social-impacts-of-existing-products-designed-for-the-devel","slug":"/analysis-of-perceived-social-impacts-of-existing-products","title":"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development","catalog_title":"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development","abstract":"Abstract Engineered products often have more social impacts than are realized. A product review was conducted to bring this to light. In this paper, we show the extent to which different social impacts in 11 impact categories are co-present in 150 products and how this can help engineers and others during the product development process. Specifically, we show how social impact categories not previously considered can be identified. The product review resulted in 13,200 data points that were divided into two data sets, one with 8800 data points from which a social impact probability table was created. The remaining data points were then used to validate the table. All data points were then combined to create a final social impact probability table. This table provides insight for how various social impact categories correlate and can assist engineers in expanding their views to include additional social impact objectives and thus achieve a design with broader social impact or a design with minimized unwanted negative social impact. A simple method for predicting social impact is also created in order to assist engineers when developing products with social impacts in mind.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4044323","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development","journal":"Journal of Mechanical Design","year":2020,"volume":"142","issue":"5","page":"051101","doi":"10.1115/1.4044323","authors_resolved":[{"family":"Ottosson","given":"Hans J."},{"family":"Mattson","given":"Christopher A."},{"family":"Dahlin","given":"Eric C."}],"notes":[],"apa":"Ottosson, H. J., Mattson, C. A., & Dahlin, E. C. (2020). Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development. Journal of Mechanical Design, 142(5), Article 051101. https://doi.org/10.1115/1.4044323","mla":"Ottosson, Hans J., et al. \"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development.\" Journal of Mechanical Design, vol. 142, no. 5, 2020, p. 051101, https://doi.org/10.1115/1.4044323.","chicago_author_date":"Ottosson, Hans J., Christopher A. Mattson, and Eric C. Dahlin. 2020. \"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development.\" Journal of Mechanical Design 142 (5): Evaders in the Border Defense Differential Game.\" Journal of Aerospace Information Systems 17, no. 5 (2020): 229. https://doi.org/10.2514/1.i010766.","chicago_footnote":"John L. Salmon, Landon C. Willey, David Casbeer, Eloy Garcia, and Alexander Von Moll, \"Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game,\" Journal of Aerospace Information Systems 17, no. 5 (2020): 229, https://doi.org/10.2514/1.i010766.","ieee":"J. L. Salmon, L. C. Willey, D. Casbeer, E. Garcia, and A. V. Moll, \"Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game,\" Journal of Aerospace Information Systems, vol. 17, no. 5, pp. 229, May 2020, doi: 10.2514/1.i010766.","bibtex":"@article{salmon2020single,\n  author    = {Salmon, John L. and Willey, Landon C. and Casbeer, David and Garcia, Eloy and Moll, Alexander Von},\n  title     = {Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game},\n  journal   = {Journal of Aerospace Information Systems},\n  volume    = {17},\n  number    = {5},\n  pages     = {229},\n  year      = {2020},\n  publisher = {American Institute of Aeronautics and Astronautics (AIAA)},\n  doi       = {10.2514/1.i010766}\n}"},{"id":"structural-design-space-exploration-using-principal-component-analysis","slug":"/structural-design-space-exploration-using-principal-component-analysis","title":"Structural Design Space Exploration Using Principal Component Analysis","catalog_title":"Structural Design Space Exploration Using Principal Component Analysis","abstract":"Abstract Design space exploration (DSE) is the process whereby a designer seeks to understand some results across a set of design variations. Structural DSE of turbomachinery compressor blades is often challenging because the large number of design variables make it difficult to learn the effect that each variable has upon the stress contours. Principal component analysis (PCA) of the stress contours is used as a way to understand how the stress contours change over the design space. Two methods are introduced to address the challenge of understanding how the stress changes over a large number of variables. First, a two-point correlation is applied to relate the design variables to the scores of each principal component. Second, a coupling of the stress and coordinate location of each node in PCA is developed which also indicates how the stress variations relate to geometric variations. These provide insight to how design variables influence the stress. It is shown how these methods use PCA as DSE tools to better explore the structural design space of compressor blades. Better DSE can improve compressor blades and the computational cost needed for their design.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4047428","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Structural Design Space Exploration Using Principal Component Analysis","journal":"Journal of Computing and Information Science in Engineering","year":2020,"volume":"20","issue":"6","page":"061014","doi":"10.1115/1.4047428","authors_resolved":[{"family":"Bunnell","given":"Spencer"},{"family":"Gorrell","given":"Steven"},{"family":"Salmon","given":"John"},{"family":"Thelin","given":"Christopher"},{"family":"Ruoti","given":"Christopher"}],"notes":[],"apa":"Bunnell, S., Gorrell, S., Salmon, J., Thelin, C., & Ruoti, C. (2020). Structural Design Space Exploration Using Principal Component Analysis. Journal of Computing and Information Science in Engineering, 20(6), Article 061014. https://doi.org/10.1115/1.4047428","mla":"Bunnell, Spencer, et al. \"Structural Design Space Exploration Using Principal Component Analysis.\" Journal of Computing and Information Science in Engineering, vol. 20, no. 6, 2020, p. 061014, https://doi.org/10.1115/1.4047428.","chicago_author_date":"Bunnell, Spencer, Steven Gorrell, John Salmon, Christopher Thelin, and Christopher Ruoti. 2020. \"Structural Design S her = {CAD Solutions LLC},\n  doi       = {10.14733/cadconfp.2019.377-381}\n}"},{"id":"deconfliction-in-high-density-unmanned-aerial-vehicle-systems","slug":"/deconfliction-in-high-density-unmanned-aerial-vehicle-systems","title":"Deconfliction in High-Density Unmanned Aerial Vehicle Systems","catalog_title":"Deconfliction in High-Density Unmanned Aerial Vehicle Systems","abstract":"Examines deconfliction strategies for safely coordinating high-density unmanned aerial vehicle operations.","abstract_source":"catalog","publisher_url":"https://doi.org/10.2514/1.d0119","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Deconfliction in High-Density Unmanned Aerial Vehicle Systems","journal":"Journal of Air Transportation","year":2019,"volume":"27","issue":"2","page":"61","doi":"10.2514/1.d0119","authors_resolved":[{"family":"Nysetvold","given":"Timothy B."},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Nysetvold, T. B. & Salmon, J. L. (2019). Deconfliction in High-Density Unmanned Aerial Vehicle Systems. Journal of Air Transportation, 27(2), 61. https://doi.org/10.2514/1.d0119","mla":"Nysetvold, Timothy B., and John L. Salmon. \"Deconfliction in High-Density Unmanned Aerial Vehicle Systems.\" Journal of Air Transportation, vol. 27, no. 2, 2019, p. 61, https://doi.org/10.2514/1.d0119.","chicago_author_date":"Nysetvold, Timothy B. and John L. Salmon. 2019. \"Deconfliction in High-Density Unmanned Aerial Vehicle Systems.\" Journal of Air Transportation 27 (2): 61. https://doi.org/10.2514/1.d0119.","chicago_bibliography":"Nysetvold, Timothy B. and John L. Salmon. \"Deconfliction in High-Density Unmanned Aerial Vehicle Systems.\" Journal of Air Transportation 27, no. 2 (2019): 61. https://doi.org/10.2514/1.d0119.","chicago_footnote":"Timothy B. Nysetvold and John L. Salmon, \"Deconfliction in High-Density Unmanned Aerial Vehicle Systems,\" Journal of Air Transportation 27, no. 2 (2019): 61, https://doi.org/10.2514/1.d0119.","ieee":"T. B. Nysetvold and J. L. Salmon, \"Deconfliction in High-Density Unmanned Aerial Vehicle Systems,\" Journal of Air Transportation, vol. 27, no. 2, pp. 61, Apr. 2019, doi: 10.2514/1.d0119.","bibtex":"@article{nysetvold2019deconfliction,\n  author    = {Nysetvold, Timothy B. and Salmon, John L.},\n  title     = {Deconfliction in High-Density Unmanned Aerial Vehicle Systems},\n  journal   = {Journal of Air Transportation},\n  volume    = {27},\n  number    = {2},\n  pages     = {61},\n  year      = {2019},\n  publisher = {American Institute of Aeronautics and Astronautics (AIAA)},\n  doi       = {10.2514/1.d0119}\n}"},{"id":"difference-modeling-for-design-space-exploration-and-comparison-of-three-dimensi","slug":"/difference-modeling-for-design-space-exploration-and-comparison-of-three-dimensi","title":"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results","catalog_title":"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results","abstract":"Design space exploration is an important part of design in engineering fields. Recent research employs surrogate models to emulate finite element analyses across a design space, allowing rapid design space exploration. With interactive speeds, there exists a need for tools that help designers compare designs to one another. This difference model is comprised of a three-dimensional rendering of the geometry with the location and magnitude of differences between the two designs displayed as colors on the model surface. This visualization is combined with juxtaposed views of the objects being compared. A user experiment was conducted with 28 volunteers to demonstrate whether or not including the difference model in the visualization can improve speed and accuracy for various comparative design tasks. It was found that, for certain comparison tasks, there is indeed statistical evidence that using the difference model alongside the two juxtaposed views improved speed and accuracy when making design judgments between two different designs.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1177/1473871619862791","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results","journal":"Information Visualization","year":2019,"volume":"18","issue":"4","page":"455","doi":"10.1177/1473871619862791","authors_resolved":[{"family":"Thelin","given":"Christopher"},{"family":"Bunnell","given":"Spencer"},{"family":"Salmon","given":"John"},{"family":"Gorrell","given":"Steve"}],"notes":[],"apa":"Thelin, C., Bunnell, S., Salmon, J., & Gorrell, S. (2019). Difference modeling for design space exploration and comparison of three-dimensional structural simulation results. Information Visualization, 18(4), 455. https://doi.org/10.1177/1473871619862791","mla":"Thelin, Christopher, et al. \"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results.\" Information Visualization, vol. 18, no. 4, 2019, p. 455, https://doi.org/10.1177/1473871619862791.","chicago_author_date":"Thelin, Christopher, Spencer Bunnell, John Salmon, and Steve Gorrell. 2019. \"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results.\" Information Visualization 18 (4): 455. https://doi.org/10.1177/1473871619862791.","chicago_bibliography":"Thelin, Christopher, Spencer Bunnell, John Salmon, and Steve Gorrell. \"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results.\" Information Visualization 18, no. 4 (2019): 455. https://doi.org/10.1177/1473871619862791.","chicago_footnote":"Christopher Thelin, Spencer Bunnell, John Salmon, and Steve Gorrell, \"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results,\" Information Visualization 18, no. 4 (2019): 455, https://doi.org/10.1177/1473871619862791.","ieee":"C. Thelin, S. Bunnell, J. Salmon, and S. Gorrell, \"Difference modeling for design space exploration and comparison of three-dimensional structural simulation results,\" Information Visualization, vol. 18, no. 4, pp. 455, Oct. 2019, doi: 10.1177/1473871619862791.","bibtex":"@article{thelin2019difference,\n  author    = {Thelin, Christopher and Bunnell, Spencer and Salmon, John and Gorrell, Steve},\n  title     = {Difference modeling for design space exploration and comparison of three-dimensional structural simulation results},\n  journal   = {Information Visualization},\n  volume    = {18},\n  number    = {4},\n  pages     = {455},\n  year      = {2019},\n  publisher = {SAGE Publications},\n  doi       = {10.1177/1473871619862791}\n}"},{"id":"establishing-baseline-performance-for-off-the-shelf-nitrile-seals-for-the-india","slug":"/establishing-baseline-performance-for-off-the-shelf-nitrile-seals-for-the-india","title":"Establishing Baseline Performance for Off-the-Shelf Nitrile Seals for the India Mark II Hand Pump System","catalog_title":"Establishing Baseline Performance for Off-the-Shelf Nitrile Seals for the India Mark II Hand Pump System","abstract":"Abstract Accessing clean water is a persistent, and life threatening, challenge for millions of people in the world. Mechanical hand pumps have a long history of helping people access clean ground water for drinking and daily use. Among the most ubiquitous are the India Mark II and III pump systems, for which there are more than 4,000,000 installed across the world. These are estimated to serve between 600M and 1B people. All pumps degrade in performance over time, requiring service; many do not receive it causing pumps to become dysfunctional. The purpose of this paper is to establish a baseline for nitrile seal performance of India Mark II hand pump systems. Understanding off-the-shelf performance and using it as a baseline is an important step toward understanding degradation of performance over time, which is the focus of a much larger study to understand — mechanically and socially — how hand pumps perform, degrade, and ultimately meet human needs. In this paper, 110 off-the-shelf nitrile seals that were purchased in Uganda were tested and the following was characterized: (i) geometric variation, (ii) material variation, (iii) leak performance, and (iv) correlation between these. The seal leak performance was found to be very robust to variations in geometry and material at zero cycles. This important baseline supports our future work to understand how and to what degree seals become sensitive to geometric and material degradation during use.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2019-98439","badge":"conference","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Establishing Baseline Performance for Off-the-Shelf Nitrile Seals for the India Mark II Hand Pump System","journal":"Volume 2B: 45th Design Automation Conference","year":2019,"volume":"","issue":"","page":"V02BT03A007","doi":"10.1115/detc2019-98439","authors_resolved":[{"family":"Ottosson","given":"Hans J."},{"family":"Naylor","given":"Thomas A."},{"family":"Johnson","given":"Oliver K."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Ottosson, H. J., Naylor, T. A., Johnson, O. K., & Mattson, C. A. (2019). Establishing Baseline Performance for Off-the-Shelf Nitrile Seals for the India Mark II Hand Pump System. Volume 2B: 45th Design Automation Conference, V02BT03A007. https://doi.org/10.1115/detc2019-98439","mla":"Ottosson, Hans J., et al. \"Establishing Baseline Performance for Off-the-Shelf Nitrile Seals for the India Mark II Hand Pump System.\" Volume 2B: 45th Design Automation Conference, 2019, p. V02BT03A007, https://doi.org/10.1115/detc2019-98439.","chicago_author_dat n the developing world","catalog_title":"Quantifying the effects of various factors on the utility of design ethnography in the developing world","abstract":"Quantifies how design ethnography utility changes across factors in developing-world product work.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1007/s00163-018-00304-2","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Quantifying the effects of various factors on the utility of design ethnography in the developing world","journal":"Research in Engineering Design","year":2019,"volume":"30","issue":"3","page":"317","doi":"10.1007/s00163-018-00304-2","authors_resolved":[{"family":"Wood","given":"Amy E."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Wood, A. E. & Mattson, C. A. (2019). Quantifying the effects of various factors on the utility of design ethnography in the developing world. Research in Engineering Design, 30(3), 317. https://doi.org/10.1007/s00163-018-00304-2","mla":"Wood, Amy E., and Christopher A. Mattson. \"Quantifying the effects of various factors on the utility of design ethnography in the developing world.\" Research in Engineering Design, vol. 30, no. 3, 2019, p. 317, https://doi.org/10.1007/s00163-018-00304-2.","chicago_author_date":"Wood, Amy E. and Christopher A. Mattson. 2019. \"Quantifying the effects of various factors on the utility of design ethnography in the developing world.\" Research in Engineering Design 30 (3): 317. https://doi.org/10.1007/s00163-018-00304-2.","chicago_bibliography":"Wood, Amy E. and Christopher A. Mattson. \"Quantifying the effects of various factors on the utility of design ethnography in the developing world.\" Research in Engineering Design 30, no. 3 (2019): 317. https://doi.org/10.1007/s00163-018-00304-2.","chicago_footnote":"Amy E. Wood and Christopher A. Mattson, \"Quantifying the effects of various factors on the utility of design ethnography in the developing world,\" Research in Engineering Design 30, no. 3 (2019): 317, https://doi.org/10.1007/s00163-018-00304-2.","ieee":"A. E. Wood and C. A. Mattson, \"Quantifying the effects of various factors on the utility of design ethnography in the developing world,\" Research in Engineering Design, vol. 30, no. 3, pp. 317, Jul. 2019, doi: 10.1007/s00163-018-00304-2.","bibtex":"@article{wood2019quantifying,\n  author    = {Wood, Amy E. and Mattson, Christopher A.},\n  title     = {Quantifying the effects of various factors on the utility of design ethnography in the developing world},\n  journal   = {Research in Engineering Design},\n  volume    = {30},\n  number    = {3},\n  pages     = {317},\n  year      = {2019},\n  publisher = {Springer Science and Business Media LLC},\n  doi       = {10.1007/s00163-018-00304-2}\n}"},{"id":"the-technology-tactics-tec-tac-plot-explicit-representation-of-user-actions-in-t","slug":"/the-technology-tactics-tec-tac-plot-explicit-representation-of-user-actions-in-t","title":"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space","catalog_title":"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space","abstract":"Abstract The initial phases of the design process — including interactions with stakeholders, ideation of concept candidates, and the selection of the best candidates — have a large impact on the success of a project as a whole. They also tend to be the most unstructured portion of the project, and are often marginalized by teams who assume they already understand stakeholder needs and the best solution paths to pursue. Design researchers have developed methods shown to increase the creativity and divergent thinking of the design team during these initial phases of design. Nevertheless, these methods often rely on only a vague or amorphous representation of the design space (the set of all possible concepts the design team could feasibly select to meet the objective of the project). In this paper, we introduce a particular design-space structure that can help teams ideate and evaluate their ideation, thus improving the early phases of the design process. The design space presented here is a vector space with a basis of technology (the physical product people will use) and tactics (the procedure for using the product). Also presented are definitions, principles, and sub-theories that facilitate the creation and use of technology-tactics plots to represent the design space. Considering the design space in this structured way, the design team can gain valuable insights that improve the effectiveness of the initial stages of design, and may yield additional benefits to the design process as a whole, if further developed.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2019-98400","badge":"conference","categories":["Other"],"hidden":false,"resolved_title":"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space","journal":"Volume 2B: 45th Design Automation Conference","year":2019,"volume":"","issue":"","page":"V02BT03A013","doi":"10.1115/detc2019-98400","authors_resolved":[{"family":"Stapleton","given":"Tyler"},{"family":"Owens","given":"Trent"},{"family":"Mattson","given":"Christopher"},{"family":"Sorensen","given":"Carl"},{"family":"Anderson","given":"Michael"}],"notes":[],"apa":"Stapleton, T., Owens, T., Mattson, C., Sorensen, C., & Anderson, M. (2019). The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space. Volume 2B: 45th Design Automation Conference, V02BT03A013. https://doi.org/10.1115/detc2019-98400","mla":"Stapleton, Tyler, et al. \"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space.\" Volume 2B: 45th Design Automation Conference, 2019, p. V02BT03A013, https://doi.org/10.1115/detc2019-98400.","chicago_author_date":"Stapleton, Tyler, Trent Owens, Christopher Mattson, Carl Sorensen, and Michael Anderson. 2019. \"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space.\" Volume 2B: 45th Design Automation Conference: V02BT03A013. https://doi.org/10.1115/detc2019-98400.","chicago_bibliography":"Stapleton, Tyler, Trent Owens, Christopher Mattson, Carl Sorensen, and Michael Anderson. \"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space.\" Volume 2B: 45th Design Automation Conference (2019): V02BT03A013. https://doi.org/10.1115/detc2019-98400.","chicago_footnote":"Tyler Stapleton, Trent Owens, Christopher Mattson, Carl Sorensen, and Michael Anderson, \"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space,\" Volume 2B: 45th Design Automation Conference (2019): V02BT03A013, https://doi.org/10.1115/detc2019-98400.","ieee":"T. Stapleton, T. Owens, C. Mattson, C. Sorensen, and M. Anderson, \"The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space,\" Volume 2B: 45th Design Automation Conference, pp. V02BT03A013, Aug. 2019, doi: 10.1115/detc2019-98400.","bibtex":"@article{stapleton2019technology,\n  author    = {Stapleton, Tyler and Owens, Trent and Mattson, Christopher and Sorensen, Carl and Anderson, Michael},\n  title     = {The Technology/Tactics (TEC/TAC) Plot: Explicit Representation of User Actions in the Product Design Space},\n  journal   = {Volume 2B: 45th Design Automation Conference},\n  pages     = {V02BT03A013},\n  year      = {2019},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2019-98400}\n}"},{"id":"using-a-product-s-sustainability-space-as-a-design-exploration-tool","slug":"/using-a-product-s-sustainability-space-as-a-design-exploration-tool","title":"Using a Product’s Sustainability Space as a Design Exploration Tool","catalog_title":"Using a Productâ€™s Sustainability Space as a Design Exploration Tool","abstract":"Sustainable design is often practiced and assessed through the consideration of three essential areas: economic sustainability, environmental sustainability, and social sustainability. For even the simplest of products, the complexities of these three areas and their tradeoffs cause decision-making transparency to be lost in most practical situations. The existing field of multiobjective optimization offers a natural framework to define and explore a given design space. In this paper, a method for defining a product’s sustainability space (defined by economic, environmental, and social sustainability objectives) is outlined and used to explore the tradeoffs within the space, thus offering both the design team and the decision makers a means of better understanding the sustainability tradeoffs. This paper concludes that sustainable product development can indeed benefit from tradeoff characterization using multiobjective optimization techniques – even when using only basic models of sustainability. Interestingly, the unique characteristics of the three essential sustainable development areas lead to an alternative view of some traditional multiobjective optimization concepts, such as weak-Pareto optimality. The sustainable redesign of a machine to drill boreholes for water wells is presented as a practical example for method demonstration and discussion.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/dsj.2018.6","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Using a Product’s Sustainability Space as a Design Exploration Tool","journal":"Design Science","year":2019,"volume":"5","issue":"","page":"e1","doi":"10.1017/dsj.2018.6","authors_resolved":[{"family":"Mattson","given":"Christopher A."},{"family":"Pack","given":"Andrew T."},{"family":"Lofthouse","given":"Vicky"},{"family":"Bhamra","given":"Tracy"}],"notes":[],"apa":"Mattson, C. A., Pack, A. T., Lofthouse, V., & Bhamra, T. (2019). Using a Product’s Sustainability Space as a Design Exploration Tool. Design Science, 5, e1. https://doi.org/10.1017/dsj.2018.6","mla":"Mattson, Christopher A., et al. \"Using a Product’s Sustainability Space as a Design Exploration Tool.\" Design Science, vol. 5, 2019, p. e1, https://doi.org/10.1017/dsj.2018.6.","chicago_author_date":"Mattson, Christopher A., Andrew T. Pack, Vicky Lofthouse, and Tracy Bhamra. 2019. \"Using a Product’s Sustainability Space as a Design Exploration Tool.\" Design Science 5: e1. https://doi.org/10.1017/dsj.2018.6.","chicago_bibliography":"Mattson, Christopher A., Andrew T. Pack, Vicky Lofthouse, and Tracy Bhamra. \"Using a Product’s Sustainability Space as a Design Exploration Tool.\" Design Science 5 (2019): e1. https://doi.org/10.1017/dsj.2018.6.","chicago_footnote":"Christopher A. Mattson, Andrew T. Pack, Vicky Lofthouse, and Tracy Bhamra, \"Using a Product’s Sustainability Space as a Design Exploration Tool,\" Design Science 5 (2019): e1, https://doi.org/10.1017/dsj.2018.6.","ieee":"C. A. Mattson, A. T. Pack, V. Lofthouse, and T. Bhamra, \"Using a Product’s Sustainability Space as a Design Exploration Tool,\" Design Science, vol. 5, pp. e1, Jan. 2019, doi: 10.1017/dsj.2018.6.","bibtex":"@article{mattson2019using,\n  author    = {Mattson, Christopher A. and Pack, Andrew T. and Lofthouse, Vicky and Bhamra, Tracy},\n  title     = {Using a Product’s Sustainability Space as a Design Exploration Tool},\n  journal   = {Design Science},\n  volume    = {5},\n  pages     = {e1},\n  year      = {2019},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2018.6}\n}"},{"id":"a-cad-assembly-simplification-approach-with-ray-casting","slug":"/a-cad-assembly-simplification-approach-with-ray-casting","title":"A CAD Assembly Simplification Approach with Ray Casting","catalog_title":"A CAD Assembly Simplification Approach with Ray Casting","abstract":"Simplifies CA agergren","given":"Fred"}],"notes":[],"apa":"Eves, K., Salmon, J., Olsen, J., & Fagergren, F. (2018). A comparative analysis of computer-aided design team performance with collaboration software. Computer-Aided Design and Applications, 15(4), 476. https://doi.org/10.1080/16864360.2017.1419649","mla":"Eves, Keenan, et al. \"A comparative analysis of computer-aided design team performance with collaboration software.\" Computer-Aided Design and Applications, vol. 15, no. 4, 2018, p. 476, https://doi.org/10.1080/16864360.2017.1419649.","chicago_author_date":"Eves, Keenan, John Salmon, Jacob Olsen, and Fred Fagergren. 2018. \"A comparative analysis of computer-aided design team performance with collaboration software.\" Computer-Aided Design and Applications 15 (4): 476. https://doi.org/10.1080/16864360.2017.1419649.","chicago_bibliography":"Eves, Keenan, John Salmon, Jacob Olsen, and Fred Fagergren. \"A comparative analysis of computer-aided design team performance with collaboration software.\" Computer-Aided Design and Applications 15, no. 4 (2018): 476. https://doi.org/10.1080/16864360.2017.1419649.","chicago_footnote":"Keenan Eves, John Salmon, Jacob Olsen, and Fred Fagergren, \"A comparative analysis of computer-aided design team performance with collaboration software,\" Computer-Aided Design and Applications 15, no. 4 (2018): 476, https://doi.org/10.1080/16864360.2017.1419649.","ieee":"K. Eves, J. Salmon, J. Olsen, and F. Fagergren, \"A comparative analysis of computer-aided design team performance with collaboration software,\" Computer-Aided Design and Applications, vol. 15, no. 4, pp. 476, Jul. 2018, doi: 10.1080/16864360.2017.1419649.","bibtex":"@article{eves2018comparative,\n  author    = {Eves, Keenan and Salmon, John and Olsen, Jacob and Fagergren, Fred},\n  title     = {A comparative analysis of computer-aided design team performance with collaboration software},\n  journal   = {Computer-Aided Design and Applications},\n  volume    = {15},\n  number    = {4},\n  pages     = {476},\n  year      = {2018},\n  publisher = {U-turn Press LLC},\n  doi       = {10.1080/16864360.2017.1419649}\n}"},{"id":"effectiveness-of-an-immersive-virtual-environment-for-collaboration-with-gesture","slug":"/effectiveness-of-an-immersive-virtual-environment-for-collaboration-with-gesture","title":"Effectiveness of an Immersive Virtual Environment for Collaboration With Gesture Support Using Low-Cost Hardware","catalog_title":"Effectiveness of an Immersive Virtual Environment for Collaboration With Gesture Support Using Low-Cost Hardware","abstract":"Since the advent of modern computer-aided design software, engineers have been divorced from the highly collaborative environment previously enjoyed. Today's highly complex designs require modern software tools and the realities of a global economy often constrain engineers to remote collaboration. These conditions make it highly impractical to collaborate locally around physical models. Various approaches to creating new collaboration tools and software, which alleviate these issues, have been tried previously. However, past solutions either used expensive hardware, which is not widely available, or used standard two-dimensional (2D) monitors to share three-dimensional (3D) information. Recently, new low-cost virtual reality (VR) hardware has been introduced, which creates a highly immersive 3D experience at a tiny fraction of the cost of previous hardware. This work demonstrates an immersive collaborative environment built using a network of this hardware, which allows users to interact with gestures virtually and conducts a study to show its advantages over traditional video conferencing software.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4039006","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Effectiveness of an Immersive Virtual Environment for Collaboration With Gesture Support Using Low-Cost Hardware","journal":"Journal of Mechan ct Development 22, no. 5 (2018): 333. https://doi.org/10.1504/ijpd.2018.093428.","chicago_footnote":"Kendall S. Thacker, K. McCall Barger, and Christopher A. Mattson, \"Incorporating global and local customer needs into early stages of improved cookstove design,\" International Journal of Product Development 22, no. 5 (2018): 333, https://doi.org/10.1504/ijpd.2018.093428.","ieee":"K. S. Thacker, K. M. Barger, and C. A. Mattson, \"Incorporating global and local customer needs into early stages of improved cookstove design,\" International Journal of Product Development, vol. 22, no. 5, pp. 333, 2018, doi: 10.1504/ijpd.2018.093428.","bibtex":"@article{thacker2018incorporating,\n  author    = {Thacker, Kendall S. and Barger, K. McCall and Mattson, Christopher A.},\n  title     = {Incorporating global and local customer needs into early stages of improved cookstove design},\n  journal   = {International Journal of Product Development},\n  volume    = {22},\n  number    = {5},\n  pages     = {333},\n  year      = {2018},\n  publisher = {Inderscience Publishers},\n  doi       = {10.1504/ijpd.2018.093428}\n}"},{"id":"over-design-versus-redesign-as-a-response-to-future-requirements","slug":"/over-design-versus-redesign-as-a-response-to-future-requirements","title":"Over-Design Versus Redesign As a Response to Future Requirements","catalog_title":"Over-Design Versus Redesign As a Response to Future Requirements","abstract":"Though little research has been done in the field of over-design as a product development strategy, an over-design approach can help products avoid the issue of premature obsolescence. This paper compares over-design to redesign as approaches to address the emergence of future requirements. Net present value (NPV) analyses of several real world applications are examined from the perspective of manufacturers and customers. This analysis is used to determine the conditions under which an over-design approach provides a greater benefit than a redesign approach. Over-design is found to have a higher net present value than redesign when future requirements occur soon after the initial release, discount rates are low, initial research and development cost or price is high, and when the incremental costs of the future requirements are low.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2018-86156","badge":"conference","categories":["Other"],"hidden":false,"resolved_title":"Over-Design Versus Redesign As a Response to Future Requirements","journal":"Volume 2A: 44th Design Automation Conference","year":2018,"volume":"","issue":"","page":"V02AT03A023","doi":"10.1115/detc2018-86156","authors_resolved":[{"family":"Allen","given":"Jeffrey D."},{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Hatch","given":"Nile W."}],"notes":[],"apa":"Allen, J. D., Stevenson, P. D., Mattson, C. A., & Hatch, N. W. (2018). Over-Design Versus Redesign As a Response to Future Requirements. Volume 2A: 44th Design Automation Conference, V02AT03A023. https://doi.org/10.1115/detc2018-86156","mla":"Allen, Jeffrey D., et al. \"Over-Design Versus Redesign As a Response to Future Requirements.\" Volume 2A: 44th Design Automation Conference, 2018, p. V02AT03A023, https://doi.org/10.1115/detc2018-86156.","chicago_author_date":"Allen, Jeffrey D., Phillip D. Stevenson, Christopher A. Mattson, and Nile W. Hatch. 2018. \"Over-Design Versus Redesign As a Response to Future Requirements.\" Volume 2A: 44th Design Automation Conference: V02AT03A023. https://doi.org/10.1115/detc2018-86156.","chicago_bibliography":"Allen, Jeffrey D., Phillip D. Stevenson, Christopher A. Mattson, and Nile W. Hatch. \"Over-Design Versus Redesign As a Response to Future Requirements.\" Volume 2A: 44th Design Automation Conference (2018): V02AT03A023. https://doi.org/10.1115/detc2018-86156.","chicago_footnote":"Jeffrey D. Allen, Phillip D. Stevenson, Christopher A. Mattson, and Nile W. Hatch, \"Over-Design Versus Redesign As a Response to Future Requirements,\" Volume 2A: 44th Design Automation Conference (2018): V02AT03A023, https://doi.org/10.1115/detc2018-86156.","ieee":"J. D. Allen, P. D. Stevenson, C. A. Mattson, and N. W. Hatch, \"Over-Design Versus Redesign As a Response to Future Requirements,\" Volume 2A: 44th Design Automation Conference, pp. V02AT03A023, Aug. 2018, doi: 10.1115/detc2018-86156.","bibtex":"@article{allen2018over,\n  author    = {Allen, Jeffrey D. and Stevenson, Phillip D. and Mattson, Christopher A. and Hatch, Nile W.},\n  title     = {Over-Design Versus Redesign As a Response to Future Requirements},\n  journal   = {Volume 2A: 44th Design Automation Conference},\n  pages     = {V02AT03A023},\n  year      = {2018},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2018-86156}\n}"},{"id":"the-social-impacts-of-products-a-review","slug":"/the-social-impacts-of-products-a-review","title":"The social impacts of products: a review","catalog_title":"The social impacts of products: a review","abstract":"Reviews literature on how engineered products create social impacts across communities and stakeholders.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1080/14615517.2018.1445176","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"The social impacts of products: a review","journal":"Impact Assessment and Project Appraisal","year":2018,"volume":"36","issue":"3","page":"230","doi":"10.1080/14615517.2018.1445176","authors_resolved":[{"family":"Rainock","given":"Meagan"},{"family":"Everett","given":"Dallin"},{"family":"Pack","given":"Andrew"},{"family":"Dahlin","given":"Eric C."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Rainock, M., Everett, D., Pack, A., Dahlin, E. C., & Mattson, C. A. (2018). The social impacts of products: a review. Impact Assessment and Project Appraisal, 36(3), 230. https://doi.org/10.1080/14615517.2018.1445176","mla":"Rainock, Meagan, et al. \"The social impacts of products: a review.\" Impact Assessment and Project Appraisal, vol. 36, no. 3, 2018, p. 230, https://doi.org/10.1080/14615517.2018.1445176.","chicago_author_date":"Rainock, Meagan, Dallin Everett, Andrew Pack, Eric C. Dahlin, and Christopher A. Mattson. 2018. \"The social impacts of products: a review.\" Impact Assessment and Project Appraisal 36 (3): 230. https://doi.org/10.1080/14615517.2018.1445176.","chicago_bibliography":"Rainock, Meagan, Dallin Everett, Andrew Pack, Eric C. Dahlin, and Christopher A. Mattson. \"The social impacts of products: a review.\" Impact Assessment and Project Appraisal 36, no. 3 (2018): 230. https://doi.org/10.1080/14615517.2018.1445176.","chicago_footnote":"Meagan Rainock, Dallin Everett, Andrew Pack, Eric C. Dahlin, and Christopher A. Mattson, \"The social impacts of products: a review,\" Impact Assessment and Project Appraisal 36, no. 3 (2018): 230, https://doi.org/10.1080/14615517.2018.1445176.","ieee":"M. Rainock, D. Everett, A. Pack, E. C. Dahlin, and C. A. Mattson, \"The social impacts of products: a review,\" Impact Assessment and Project Appraisal, vol. 36, no. 3, pp. 230, May 2018, doi: 10.1080/14615517.2018.1445176.","bibtex":"@article{rainock2018social,\n  author    = {Rainock, Meagan and Everett, Dallin and Pack, Andrew and Dahlin, Eric C. and Mattson, Christopher A.},\n  title     = {The social impacts of products: a review},\n  journal   = {Impact Assessment and Project Appraisal},\n  volume    = {36},\n  number    = {3},\n  pages     = {230},\n  year      = {2018},\n  publisher = {Informa UK Limited},\n  doi       = {10.1080/14615517.2018.1445176}\n}"},{"id":"toward-a-universal-social-impact-metric-for-engineered-products-that-alleviate-p","slug":"/toward-a-universal-social-impact-metric-for-engineered-products-that-alleviate-p","title":"Toward a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","catalog_title":"Toward a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","abstract":"One of the purposes of creating products for developing countries is to improve the consumer's quality of life. Currently, there is no standard method for measuring the social impact of these types of products. As a result, engineers have used their own metrics, if at all. Some of the common metrics used include products sold and revenue, which measure the financial success of a product without recognizing the social successes or failures it might have. In this paper, we introduce a potential universal metric, the product impact metric (PIM), which quantifies the impact a product has on impoverished individuals—especially those living in developing countries. It measures social impact broadly in five dimensions: health, education, standard of living, employment quality, and security. By measuring impact multidimensionally, it captures impacts both anticipated and unanticipated, thereby providing a broader assessment of the product's total impact than with other more specific metrics. The PIM is calculated based on 18 simple field measurements of the consumer. It is inspired by the UN's Multidimensional Poverty Index (UNMPI) created by the United Nations Development Programme (UNDP). The UNMPI measures how level of poverty within a nation changes year after year, and the PIM measures how an individual's poverty level changes after being affected by an engineered product. The PIM can be used to measure social impact (using specific data from products introduced into the market) or predict social impact (using personas that represent real individuals).","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4038925","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Toward a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","journal":"Journal of Mechanical Design","year":2018,"volume":"140","issue":"4","page":"041404  to the same model in a single-user CAD environment, it is seen that use of a MUCAD system can significantly increase the value-added per unit of calendar time for a modeling effort. An investigation was also made into the causes of the performance differences among the various MUCAD teams which participated in the competition. Analysis of the results shows that teams that encouraged effective forms of communication and teams whose members scored similarly on the Purdue Spatial Visualization Test: Visualization of Rotations (PSVT:R) performed better than other teams. Areas of future research in analyzing teams in MUCAD environments are suggested.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4035674","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"A Multi-User Computer-Aided Design Competition: Experimental Findings and Analysis of Team-Member Dynamics","journal":"Journal of Computing and Information Science in Engineering","year":2017,"volume":"17","issue":"3","page":"031003","doi":"10.1115/1.4035674","authors_resolved":[{"family":"Stone","given":"Brett"},{"family":"Salmon","given":"John"},{"family":"Eves","given":"Keenan"},{"family":"Killian","given":"Matthew"},{"family":"Wright","given":"Landon"},{"family":"Oldroyd","given":"Jordan"},{"family":"Gorrell","given":"Steve"},{"family":"Richey","given":"Michael C."}],"notes":[],"apa":"Stone, B., Salmon, J., Eves, K., Killian, M., Wright, L., Oldroyd, J., Gorrell, S., & Richey, M. C. (2017). A Multi-User Computer-Aided Design Competition: Experimental Findings and Analysis of Team-Member Dynamics. Journal of Computing and Information Science in Engineering, 17(3), Article 031003. https://doi.org/10.1115/1.4035674","mla":"Stone, Brett, et al. \"A Multi-User Computer-Aided Design Competition: Experimental Findings and Analysis of Team-Member Dynamics.\" Journal of Computing and Information Science in Engineering, vol. 17, no. 3, 2017, p. 031003, https://doi.org/10.1115/ isher = {ASME International},\n  doi       = {10.1115/1.4035674}\n}"},{"id":"a-review-of-the-capabilities-of-current-low-cost-virtual-reality-technology-and","slug":"/a-review-of-the-capabilities-of-current-low-cost-virtual-reality-technology-and","title":"A Review of the Capabilities of Current Low-Cost Virtual Reality Technology and Its Potential to Enhance the Design Process","catalog_title":"A Review of the Capabilities of Current Low-Cost Virtual Reality Technology and Its Potential to Enhance the Design Process","abstract":"In the past few years, there have been some significant advances in consumer virtual reality (VR) devices. Devices such as the Oculus Rift, HTC Vive, Leap Motion™ Controller, and Microsoft Kinect® are bringing immersive VR experiences into the homes of consumers with much lower cost and space requirements than previous generations of VR hardware. These new devices are also lowering the barrier to entry for VR engineering applications. Past research has suggested that there are significant opportunities for using VR during design tasks to improve results and reduce development time. This work reviews the latest generation of VR hardware and reviews research studying VR in the design process. Additionally, this work extracts the major themes from the reviews and discusses how the latest technology and research may affect the engineering design process. We conclude that these new devices have the potential to significantly improve portions of the design process.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4036921","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"A Review of the Capabilities of Current Low-Cost Virtual Reality Technology and Its Potential to Enhance the Design Process","journal":"Journal of Computing and Information Science in Engineering","year":2017,"volume":"17","issue":"3","page":"031013","doi":"10.1115/1.4036921","authors_resolved":[{"family":"Coburn","given":"Joshua Q.
