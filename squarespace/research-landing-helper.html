nefit from integrated social impact metric analysis.","publisherUrl":"https://doi.org/10.1017/dsj.2023.13","apa":"Richards, D. C., Stevenson, P. D., Mattson, C. A., & Salmon, J. L. (2023). An approach for including social impact measures in systems design exploration. Design Science, 9, e16. https://doi.org/10.1017/dsj.2023.13","mla":"Richards, Daniel C., et al. \"An approach for including social impact measures in systems design exploration.\" Design Science, vol. 9, 2023, p. e16, https://doi.org/10.1017/dsj.2023.13.","chicago":"Richards, Daniel C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. 2023. \"An approach for including social impact measures in systems design exploration.\" Design Science 9: e16. https://doi.org/10.1017/dsj.2023.13.","ieee":"D. C. Richards, P. D. Stevenson, C. A. Mattson, and J. L. Salmon, \"An approach for including social impact measures in systems design exploration,\" Design Science, vol. 9, pp. e16, Jul. 2023, doi: 10.1017/dsj.2023.13.","bibtex":"@article{richards2023approach,\n  author    = {Richards, Daniel C. and Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L.},\n  title     = {An approach for including social impact measures in systems design exploration},\n  journal   = {Design Science},\n  volume    = {9},\n  pages     = {e16},\n  year      = {2023},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2023.13}\n}"},"creating-predictive-social-impact-models-of-engineered-products-using-synthetic":{"navTitle":"creating predictive social impact models of engineered products using synthetic","slug":"creating-predictive-social-impact-models-of-engineered-products-using-synthetic","catalogId":"creating-predictive-social-impact-models-of-engineered-products-using-synthetic","catalogUrl":"/creating-predictive-social-impact-models-of-engineered-products-using-synthetic","h1":"Creating predictive social impact models of engineered products using synthetic populations","teaser":"Creates predictive social impact models of engineered products using synthetic population data.","abstract":"Creates predictive social impact models of engineered products using synthetic population data.","publisherUrl":"https://doi.org/10.1007/s00163-023-00424-4","apa":"Stevenson, P. D., Mattson, C. A., Dahlin, E. C., & Salmon, J. L. (2023). Creating predictive social impact models of engineered products using synthetic populations. Research in Engineering Design, 34(4), 461. https://doi.org/10.1007/s00163-023-00424-4","mla":"Stevenson, Phillip D., et al. \"Creating predictive social impact models of engineered products using synthetic populations.\" Research in Engineering Design, vol. 34, no. 4, 2023, p. 461, https://doi.org/10.1007/s00163-023-00424-4.","chicago":"Stevenson, Phillip D., Christopher A. Mattson, Eric C. Dahlin, and John L. Salmon. 2023. \"Creating predictive social impact models of engineered products using synthetic populations.\" Research in Engineering Design 34 (4): 461. https://doi.org/10.1007/s00163-023-00424-4.","ieee":"P. D. Stevenson, C. A. Mattson, E. C. Dahlin, and J. L. Salmon, \"Creating predictive social impact models of engineered products using synthetic populations,\" Research in Engineering Design, vol. 34, no. 4, pp. 461, Oct. 2023, doi: 10.1007/s00163-023-00424-4.","bibtex":"@article{stevenson2023creating,\n  author    = {Stevenson, Phillip D. and Mattson, Christopher A. and Dahlin, Eric C. and Salmon, John L.},\n  title     = {Creating predictive social impact models of engineered products using synthetic populations},\n  journal   = {Research in Engineering Design},\n  volume    = {34},\n  number    = {4},\n  pages     = {461},\n  year      = {2023},\n  publisher = {Springer Science and Business Media LLC},\n  doi       = {10.1007/s00163-023-00424-4}\n}"},"enabling-insights-by-long-term-evaluation-of-social-impact-indicators-of-enginee":{"navTitle":"enabling insights by long term evaluation of social impact indicators of enginee","slug":"enabling-insights-by-long-term-evaluation-of-social-impact-indicators-of-enginee","catalogId":"enabling-insights-by-long-term-evaluation-of-social-impact-indicators-of-enginee","catalogUrl":"/enabling-insights-by-long-term-evaluation-of-social-impact-indicators-of-enginee","h1":"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning","teaser":"Abstract Remotely measuring social impact indicators of products in developing countries can enable researchers and practitioners to make informed decisions relative to the design of products, improvement of products, or social interventions that can help improve the lives of individuals.","abstract":"Abstract Remotely measuring social impact indicators of products in developing countries can enable researchers and practitioners to make informed decisions relative to the design of products, improvement of products, or social interventions that can help improve the lives of individuals. Collecting data for determining social impact indicators for long-term periods through manual methods can be cost prohibitive and preclude collection of data that could provide valuable insights. Using in situ sensors remotely deployed and paired with deep learning can enable practitioners to collect long-term data that provide insights that can be as beneficial as data collected through manual observation but with the cost and continuity made possible by sensor devices. Postulates related to successfully developing and deploying this approach have been identified and their usefulness demonstrated through an example application related to a water hand pump in Uganda in which sensor data were collected over a five-month span. Following these postulates can help researchers and practitioners avoid potential issues that could be encountered without them.","publisherUrl":"https://doi.org/10.1115/1.4062944","apa":"Stringham, B. J., Mattson, C. A., Jenkins, P., Dahlin, E., & Okware, I. I. (2023). Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning. Journal of Mechanical Design, 145(11), Article 111401. https://doi.org/10.1115/1.4062944","mla":"Stringham, Bryan J., et al. \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning.\" Journal of Mechanical Design, vol. 145, no. 11, 2023, p. 111401, https://doi.org/10.1115/1.4062944.","chicago":"Stringham, Bryan J., Christopher A. Mattson, Porter Jenkins, Eric Dahlin, and Immaculate Irot Okware. 2023. \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning.\" Journal of Mechanical Design 145 (11): 111401. https://doi.org/10.1115/1.4062944.","ieee":"B. J. Stringham, C. A. Mattson, P. Jenkins, E. Dahlin, and I. I. Okware, \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning,\" Journal of Mechanical Design, vol. 145, no. 11, Art. no. 111401, Nov. 2023, doi: 10.1115/1.4062944.","bibtex":"@article{stringham2023enabling,\n  author    = {Stringham, Bryan J. and Mattson, Christopher A. and Jenkins, Porter and Dahlin, Eric and Okware, Immaculate Irot},\n  title     = {Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {11},\n  pages     = {111401},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4062944}\n}"},"simulating-the-adoption-and-social-impact-of-improved-cookstoves-in-uganda-using":{"navTitle":"simulating the adoption and social impact of improved cookstoves","slug":"simulating-the-adoption-and-social-impact-of-improved-cookstoves","catalogId":"simulating-the-adoption-and-social-impact-of-improved-cookstoves","catalogUrl":"/simulating-the-adoption-and-social-impact-of-improved-cookstoves","h1":"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks","teaser":"Abstract This paper presents a methodology for predicting a product’s adoption and social impact using agent-based modeling (ABM) and neural networks to aid in decision-making related to the design and implementation of the product in a sociotechnical system.","abstract":"Abstract This paper presents a methodology for predicting a product’s adoption and social impact using agent-based modeling (ABM) and neural networks to aid in decision-making related to the design and implementation of the product in a sociotechnical system. The collection of primary data on the social impact of a product is also outlined. Although this paper illustrates the method for improved cookstoves in Uganda, the general method can be applied to a wide range of contexts. A field study was carried out in Uganda, consisting of two phases of data collection. The data from the field work were used to train a neural network to predict if an individual would adopt an improved cookstove. Data collected from surveys and the trained adoption model were used to create an ABM to estimate adoption rates and social impacts experienced by households that had adopted technology and to assess social impact indicators. The contributions of this article are a method for collecting primary social impact data on a product and how to integrate those data into a predictive agent-based social impact model. This methodology also enables the examination of leverage points in the sociotechnical system to improve the social impact of a product as it is implemented in society.","publisherUrl":"https://doi.org/10.1115/1.4063237","apa":"Mabey, C. S., Peiffer, E. E., MacCarty, N., & Mattson, C. A. (2023). Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks. Journal of Mechanical Design, 145(12), Article 121701. https://doi.org/10.1115/1.4063237","mla":"Mabey, Christopher S., et al. \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks.\" Journal of Mechanical Design, vol. 145, no. 12, 2023, p. 121701, https://doi.org/10.1115/1.4063237.","chicago":"Mabey, Christopher S., Erin E. Peiffer, Nordica MacCarty, and Christopher A. Mattson. 2023. \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks.\" Journal of Mechanical Design 145 (12): 121701. https://doi.org/10.1115/1.4063237.","ieee":"C. S. Mabey, E. E. Peiffer, N. MacCarty, and C. A. Mattson, \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks,\" Journal of Mechanical Design, vol. 145, no. 12, Art. no. 121701, Dec. 2023, doi: 10.1115/1.4063237.","bibtex":"@article{mabey2023simulating,\n  author    = {Mabey, Christopher S. and Peiffer, Erin E. and MacCarty, Nordica and Mattson, Christopher A.},\n  title     = {Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {12},\n  pages     = {121701},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4063237}\n}"},"trade-off-characterization-between-social-and-environmental-impacts-using-agent":{"navTitle":"trade off characterization between social and environmental impacts","slug":"trade-off-characterization-between-social-and-environmental-impacts","catalogId":"trade-off-characterization-between-social-and-environmental-impacts","catalogUrl":"/trade-off-characterization-between-social-and-environmental-impacts","h1":"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment","teaser":"Abstract Meeting the United Nations (UN) sustainable development goals efficiently requires designers and engineers to solve multi-objective optimization problems involving trade-offs between social, environmental, and economical impacts.","abstract":"Abstract Meeting the United Nations (UN) sustainable development goals efficiently requires designers and engineers to solve multi-objective optimization problems involving trade-offs between social, environmental, and economical impacts. This paper presents an approach for designers and engineers to quantify the social and environmental impacts of a product at a population level and then perform a trade-off analysis between those impacts. In this approach, designers and engineers define the attributes of the product as well as the materials and processes used in the product’s life cycle. Agent-based modeling (ABM) tools that have been developed to model the social impacts of products are combined with life cycle assessment (LCA) tools that have been developed to evaluate the pressures that different processes create on the environment. Designers and engineers then evaluate the trade-offs between impacts by finding non-dominated solutions that minimize environmental impacts while maximizing positive and/or minimizing negative social impacts. Product adoption models generated by ABM allow designers and engineers to approximate population level environmental impacts and avoid Simpson’s paradox, where a reversal in choices is preferred when looking at the population level impacts versus the individual product-level impacts. This analysis of impacts has the potential to help designers and engineers create more impactful products that aid in reaching the UN sustainable development goals.","publisherUrl":"https://doi.org/10.1115/1.4056006","apa":"Liechty, J. C., Mabey, C. S., Mattson, C. A., Salmon, J. L., & Weaver, J. M. (2023). Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment. Journal of Mechanical Design, 145(3), Article 032001. https://doi.org/10.1115/1.4056006","mla":"Liechty, Joseph C., et al. \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment.\" Journal of Mechanical Design, vol. 145, no. 3, 2023, p. 032001, https://doi.org/10.1115/1.4056006.","chicago":"Liechty, Joseph C., Christopher S. Mabey, Christopher A. Mattson, John L. Salmon, and Jason M. Weaver. 2023. \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment.\" Journal of Mechanical Design 145 (3): 032001. https://doi.org/10.1115/1.4056006.","ieee":"J. C. Liechty, C. S. Mabey, C. A. Mattson, J. L. Salmon, and J. M. Weaver, \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment,\" Journal of Mechanical Design, vol. 145, no. 3, Art. no. 032001, Mar. 2023, doi: 10.1115/1.4056006.","bibtex":"@article{liechty2023trade,\n  author    = {Liechty, Joseph C. and Mabey, Christopher S. and Mattson, Christopher A. and Salmon, John L. and Weaver, Jason M.},\n  title     = {Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {3},\n  pages     = {032001},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4056006}\n}"},"assessing-global-needs-when-identifying-potential-engineering-for-global-develop":{"navTitle":"assessing global needs for global development","slug":"assessing-global-needs-for-global-development","catalogId":"assessing-global-needs-for-global-development","catalogUrl":"/assessing-global-needs-for-global-development","h1":"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects","teaser":"Abstract With limited time and resources available to carry out Engineering for Global Development (EGD) projects, it can be difficult to know where those resources should be allocated to have greater potential for meaningful impact.","abstract":"Abstract With limited time and resources available to carry out Engineering for Global Development (EGD) projects, it can be difficult to know where those resources should be allocated to have greater potential for meaningful impact. It is easy to assume that projects should occur in a particular location based on personal experience or where other development projects are taking place. This can be a consideration, but it may not lead to the greatest social impact. Where to work on a project and what problem to work on are key questions in the early stages of product development in the context of EGD. To aid in this process, this article presents a method for assessing global needs to ensure thoughtful use of limited EGD resources. We introduce a method for identifying locations where there is human need, gaps in technological achievement, and what the work environment is in a country. Results of the method are compared to what countries receive the most foreign aid dollars per capita. Measures were calculated using the principal component analysis on data from development agencies. These results can help practitioners in selecting where to undertake development projects with an eye toward targeting locations that may yield high levels of social impact.","publisherUrl":"https://doi.org/10.1115/1.4052223","apa":"Mabey, C. S., Mattson, C. A., & Dahlin, E. C. (2022). Assessing Global Needs When Identifying Potential Engineering for Global Development Projects. Journal of Mechanical Design, 144(3), Article 031402. https://doi.org/10.1115/1.4052223","mla":"Mabey, Christopher S., et al. \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects.\" Journal of Mechanical Design, vol. 144, no. 3, 2022, p. 031402, https://doi.org/10.1115/1.4052223.","chicago":"Mabey, Christopher S., Christopher A. Mattson, and Eric C. Dahlin. 2022. \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects.\" Journal of Mechanical Design 144 (3): 031402. https://doi.org/10.1115/1.4052223.","ieee":"C. S. Mabey, C. A. Mattson, and E. C. Dahlin, \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects,\" Journal of Mechanical Design, vol. 144, no. 3, Art. no. 031402, Mar. 2022, doi: 10.1115/1.4052223.","bibtex":"@article{mabey2022assessing,\n  author    = {Mabey, Christopher S. and Mattson, Christopher A. and Dahlin, Eric C.},\n  title     = {Assessing Global Needs When Identifying Potential Engineering for Global Development Projects},\n  journal   = {Journal of Mechanical Design},\n  volume    = {144},\n  number    = {3},\n  pages     = {031402},\n  year      = {2022},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4052223}\n}"},"systematic-review-and-classification-of-the-engineering-for-global-development-l":{"navTitle":"systematic review and classification of the engineering for global development","slug":"systematic-review-and-classification-of-the-engineering-for-global-development","catalogId":"systematic-review-and-classification-of-the-engineering-for-global-development","catalogUrl":"/systematic-review-and-classification-of-the-engineering-for-global-development","h1":"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration","teaser":"Abstract While many tools and methodologies for assessing social impact exist and are used in the social science and global development fields, there is a lack of standard methods for considering the broader social impact of products in the engineering community.","abstract":"Abstract While many tools and methodologies for assessing social impact exist and are used in the social science and global development fields, there is a lack of standard methods for considering the broader social impact of products in the engineering community. Some reasons these methods are not as widely used in the engineering community include designers not being aware of the methods, or methods not being widely applicable. The purpose of this research is to help designers and researchers find relevant design tools and methods for implementing social impact considerations. This is done through the classification of 374 papers in the Engineering for Global Development (EGD) literature along several dimensions including method purpose, industry sector, social impacts considered, sustainable development goals, paper setting, and data inputs required. This article describes how designers and researchers can use this set of classified papers to locate relevant design tools and methods to improve social impact considerations in their work.","publisherUrl":"https://doi.org/10.1115/1.4055325","apa":"Armstrong, A. G., Suk, H., Mabey, C. S., Mattson, C. A., Hall, J., & Salmon, J. L. (2023). Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration. Journal of Mechanical Design, 145(3), Article 030801. https://doi.org/10.1115/1.4055325","mla":"Armstrong, Andrew G., et al. \"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration.\" Journal of Mechanical Design, vol. 145, no. 3, 2023, p. 030801, https://doi.org/10.1115/1.4055325.","chicago":"Armstrong, Andrew G., Hailie Suk, Christopher S. Mabey, Christopher A. Mattson, John Hall, and John L. Salmon. 2023. \"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration.\" Journal of Mechanical Design 145 (3): 030801. https://doi.org/10.1115/1.4055325.","ieee":"A. G. Armstrong, H. Suk, C. S. Mabey, C. A. Mattson, J. Hall, and J. L. Salmon, \"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration,\" Journal of Mechanical Design, vol. 145, no. 3, Art. no. 030801, Mar. 2023, doi: 10.1115/1.4055325.","bibtex":"@article{armstrong2023systematic,\n  author    = {Armstrong, Andrew G. and Suk, Hailie and Mabey, Christopher S. and Mattson, Christopher A. and Hall, John and Salmon, John L.},\n  title     = {Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {3},\n  pages     = {030801},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4055325}\n}"},"use-of-simulation-and-wear-prediction-to-explore-design-improvements-to-the-cup":{"navTitle":"use of simulation and wear prediction to explore design improvements","slug":"use-of-simulation-and-wear-prediction-to-explore-design-improvements","catalogId":"use-of-simulation-and-wear-prediction-to-explore-design-improvements","catalogUrl":"/use-of-simulation-and-wear-prediction-to-explore-design-improvements","h1":"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system","teaser":"Uses simulation and wear prediction to improve cup seals in India Mark II/III hand pumps.","abstract":"Uses simulation and wear prediction to improve cup seals in India Mark II/III hand pumps.","publisherUrl":"https://doi.org/10.1016/j.deveng.2022.100092","apa":"Ottosson, H. J., Mattson, C. A., Johnson, O. K., & Irot, I. (2022). Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system. Development Engineering, 7, Article 100092. https://doi.org/10.1016/j.deveng.2022.100092","mla":"Ottosson, Hans J., et al. \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system.\" Development Engineering, vol. 7, 2022, p. 100092, https://doi.org/10.1016/j.deveng.2022.100092.","chicago":"Ottosson, Hans J., Christopher A. Mattson, Oliver K. Johnson, and Immy Irot. 2022. \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system.\" Development Engineering 7: 100092. https://doi.org/10.1016/j.deveng.2022.100092.","ieee":"H. J. Ottosson, C. A. Mattson, O. K. Johnson, and I. Irot, \"Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system,\" Development Engineering, vol. 7, Art. no. 100092, 2022, doi: 10.1016/j.deveng.2022.100092.","bibtex":"@article{ottosson2022use,\n  author    = {Ottosson, Hans J. and Mattson, Christopher A. and Johnson, Oliver K. and Irot, Immy},\n  title     = {Use of simulation and wear prediction to explore design improvements to the cup seal in the India Mark II/III hand pump system},\n  journal   = {Development Engineering},\n  volume    = {7},\n  pages     = {100092},\n  year      = {2022},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2022.100092}\n}"},"a-framework-for-predicting-potential-product-impact-during-product-design":{"navTitle":"a framework for predicting potential product impact during product design","slug":"a-framework-for-predicting-potential-product-impact-during-product-design","catalogId":"a-framework-for-predicting-potential-product-impact-during-product-design","catalogUrl":"/a-framework-for-predicting-potential-product-impact-during-product-design","h1":"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN","teaser":"Abstract The impact of products is becoming a topic of concern in society.","abstract":"Abstract The impact of products is becoming a topic of concern in society. Product impact may fall under the categories of economic, environmental, or social impact and is defined by the effect of a product on day-to-day life. Design teams lack sufficient tools to predict the impact of products they are designing. In this paper we present a framework for the prediction of product impact during product design. This framework integrates models of the product, scenario, society, and impact into an agent-based model to predict product impact. Although this paper focuses on social impact, the framework can also be applied to economic or environmental impacts. An illustration of using the framework is also presented. Agent-based modeling has been used previously for adoption models, but it has not been extended to predict product impact. Having tools for impact prediction allows for optimizing the product design parameters to increase potential positive impact and reduce potential negative impact.","publisherUrl":"https://doi.org/10.1017/pds.2021.11","apa":"Mabey, C. S., Armstrong, A. G., Mattson, C. A., Salmon, J. L., & Hatch, N. W. (2021). A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN. Proceedings of the Design Society, 1, 101. https://doi.org/10.1017/pds.2021.11","mla":"Mabey, Christopher S., et al. \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN.\" Proceedings of the Design Society, vol. 1, 2021, p. 101, https://doi.org/10.1017/pds.2021.11.","chicago":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. 2021. \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN.\" Proceedings of the Design Society 1: 101. https://doi.org/10.1017/pds.2021.11.","ieee":"C. S. Mabey, A. G. Armstrong, C. A. Mattson, J. L. Salmon, and N. W. Hatch, \"A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN,\" Proceedings of the Design Society, vol. 1, pp. 101, Aug. 2021, doi: 10.1017/pds.2021.11.","bibtex":"@article{mabey2021framework,\n  author    = {Mabey, Christopher S. and Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W.},\n  title     = {A FRAMEWORK FOR PREDICTING POTENTIAL PRODUCT IMPACT DURING PRODUCT DESIGN},\n  journal   = {Proceedings of the Design Society},\n  volume    = {1},\n  pages     = {101},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2021.11}\n}"},"a-computational-simulation-based-framework-for-estimating-potential-product-impa":{"navTitle":"a computational simulation framework for estimating potential product impact","slug":"a-computational-simulation-framework-for-estimating-potential-product-impact","catalogId":"a-computational-simulation-framework-for-estimating-potential-product-impact","catalogUrl":"/a-computational-simulation-framework-for-estimating-potential-product-impact","h1":"A computational simulation-based framework for estimating potential product impact during product design","teaser":"Abstract The impact of engineered products is a topic of concern in society.","abstract":"Abstract The impact of engineered products is a topic of concern in society. Product impact may fall under the categories of economic, environmental or social impact, with the last category defined as the effect of a product on the day-to-day life of people. Design teams lack sufficient tools to estimate the social impact of products, and the combined impacts of economic, environmental and social impacts for the products they are designing. This paper aims to provide a framework for the estimation of product impact during product design. To estimate product impact, models of both the product and society are required. This framework integrates models of the product, scenario, society and impact into an agent-based model to estimate product impact. Although this paper demonstrates the framework using only social impact, the framework can also be applied to economic or environmental impacts individually or all three concurrently. Agent-based modelling has been used previously for product adoption models, but it has not been extended to estimate product impact. Having tools for impact estimation allows for optimising the product design parameters to increase the potential positive impact and reduce potential negative impact.","publisherUrl":"https://doi.org/10.1017/dsj.2021.16","apa":"Mabey, C. S., Armstrong, A. G., Mattson, C. A., Salmon, J. L., Hatch, N. W., & Dahlin, E. C. (2021). A computational simulation-based framework for estimating potential product impact during product design. Design Science, 7, e15. https://doi.org/10.1017/dsj.2021.16","mla":"Mabey, Christopher S., et al. \"A computational simulation-based framework for estimating potential product impact during product design.\" Design Science, vol. 7, 2021, p. e15, https://doi.org/10.1017/dsj.2021.16.","chicago":"Mabey, Christopher S., Andrew G. Armstrong, Christopher A. Mattson, John L. Salmon, Nile W. Hatch, and Eric C. Dahlin. 2021. \"A computational simulation-based framework for estimating potential product impact during product design.\" Design Science 7: e15. https://doi.org/10.1017/dsj.2021.16.","ieee":"C. S. Mabey, A. G. Armstrong, C. A. Mattson, J. L. Salmon, N. W. Hatch, and E. C. Dahlin, \"A computational simulation-based framework for estimating potential product impact during product design,\" Design Science, vol. 7, pp. e15, Sep. 2021, doi: 10.1017/dsj.2021.16.","bibtex":"@article{mabey2021computational,\n  author    = {Mabey, Christopher S. and Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W. and Dahlin, Eric C.},\n  title     = {A computational simulation-based framework for estimating potential product impact during product design},\n  journal   = {Design Science},\n  volume    = {7},\n  pages     = {e15},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2021.16}\n}"},"fmea-inspired-analysis-for-social-impact-of-engineered-products":{"navTitle":"fmea inspired analysis for social impact of engineered products","slug":"fmea-inspired-analysis-for-social-impact-of-engineered-products","catalogId":"fmea-inspired-analysis-for-social-impact-of-engineered-products","catalogUrl":"/fmea-inspired-analysis-for-social-impact-of-engineered-products","h1":"FMEA-Inspired Analysis for Social Impact of Engineered Products","teaser":"Abstract Social Impact has been widely discussed by the engineering community, but studies show that there is currently little systematic consideration of the social impact of products in both academia and in industry beyond social impacts on health and safety.","abstract":"Abstract Social Impact has been widely discussed by the engineering community, but studies show that there is currently little systematic consideration of the social impact of products in both academia and in industry beyond social impacts on health and safety. This paper illustrates how Failure Mode and Effect Analaysis (FMEA) style analysis can be applied to evaluating the social impact of products. The authors propose a new method titled Social Impact Effects Analysis (SIEA), describe how it is performed, and explain the benefits of performing SIEA.","publisherUrl":"https://doi.org/10.1115/detc2021-70595","apa":"Armstrong, A. G., Mattson, C. A., Salmon, J. L., & Dahlin, E. C. (2021). FMEA-Inspired Analysis for Social Impact of Engineered Products. Volume 3B: 47th Design Automation Conference (DAC), V03BT03A017. https://doi.org/10.1115/detc2021-70595","mla":"Armstrong, Andrew G., et al. \"FMEA-Inspired Analysis for Social Impact of Engineered Products.\" Volume 3B: 47th Design Automation Conference (DAC), 2021, p. V03BT03A017, https://doi.org/10.1115/detc2021-70595.","chicago":"Armstrong, Andrew G., Christopher A. Mattson, John L. Salmon, and Eric C. Dahlin. 2021. \"FMEA-Inspired Analysis for Social Impact of Engineered Products.\" Volume 3B: 47th Design Automation Conference (DAC): V03BT03A017. https://doi.org/10.1115/detc2021-70595.","ieee":"A. G. Armstrong, C. A. Mattson, J. L. Salmon, and E. C. Dahlin, \"FMEA-Inspired Analysis for Social Impact of Engineered Products,\" Volume 3B: 47th Design Automation Conference (DAC), pp. V03BT03A017, Aug. 2021, doi: 10.1115/detc2021-70595.","bibtex":"@article{armstrong2021fmea,\n  author    = {Armstrong, Andrew G. and Mattson, Christopher A. and Salmon, John L. and Dahlin, Eric C.},\n  title     = {FMEA-Inspired Analysis for Social Impact of Engineered Products},\n  journal   = {Volume 3B: 47th Design Automation Conference (DAC)},\n  pages     = {V03BT03A017},\n  year      = {2021},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2021-70595}\n}"},"factors-leading-to-sustainable-social-impact-on-the-affected-communities-of-engi":{"navTitle":"factors leading to sustainable social impact on affected communities","slug":"factors-leading-to-sustainable-social-impact-on-affected-communities","catalogId":"factors-leading-to-sustainable-social-impact-on-affected-communities","catalogUrl":"/factors-leading-to-sustainable-social-impact-on-affected-communities","h1":"Factors leading to sustainable social impact on the affected communities of engineering service learning projects","teaser":"Identifies factors that lead to sustainable social impact from engineering service-learning projects.","abstract":"Identifies factors that lead to sustainable social impact from engineering service-learning projects.","publisherUrl":"https://doi.org/10.1016/j.deveng.2021.100066","apa":"Armstrong, A. G., Mattson, C. A., & Lewis, R. S. (2021). Factors leading to sustainable social impact on the affected communities of engineering service learning projects. Development Engineering, 6, Article 100066. https://doi.org/10.1016/j.deveng.2021.100066","mla":"Armstrong, Andrew G., et al. \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects.\" Development Engineering, vol. 6, 2021, p. 100066, https://doi.org/10.1016/j.deveng.2021.100066.","chicago":"Armstrong, Andrew G., Christopher A. Mattson, and Randy S. Lewis. 2021. \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects.\" Development Engineering 6: 100066. https://doi.org/10.1016/j.deveng.2021.100066.","ieee":"A. G. Armstrong, C. A. Mattson, and R. S. Lewis, \"Factors leading to sustainable social impact on the affected communities of engineering service learning projects,\" Development Engineering, vol. 6, Art. no. 100066, 2021, doi: 10.1016/j.deveng.2021.100066.","bibtex":"@article{armstrong2021factors,\n  author    = {Armstrong, Andrew G. and Mattson, Christopher A. and Lewis, Randy S.},\n  title     = {Factors leading to sustainable social impact on the affected communities of engineering service learning projects},\n  journal   = {Development Engineering},\n  volume    = {6},\n  pages     = {100066},\n  year      = {2021},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2021.100066}\n}"},"integrating-social-impact-measures-into-the-airship-design-process":{"navTitle":"integrating social impact measures into the airship design process","slug":"integrating-social-impact-measures-into-the-airship-design-process","catalogId":"integrating-social-impact-measures-into-the-airship-design-process","catalogUrl":"/integrating-social-impact-measures-into-the-airship-design-process","h1":"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS","teaser":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability.","abstract":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability. This paper seeks to determine the interaction between design parameters when the social impacts are incorporated into the design process. Social impact evaluation is increasing in importance similar to what has happened with environmental impact consideration in recent years in the design of engineered products. Concurrently, research into new airship design has increased, however airships have yet to be reintroduced at a large scale and for a range of applications in society. Although airships have the potential for positive environmental and economic impacts, the social impacts are still rarely considered. This paper presents a case study of the hypothetical introduction of airships in the Amazon to help local farmers transport their produce to market. It explores the design space in terms of the airship's social impacts connected to the design parameters. The social impacts are found to be dependent not only on the social factors and airship design parameters, but also on the farmer-airship system, suggesting that socio-technical systems design will benefit from integrated social impact metric analysis.","publisherUrl":"https://doi.org/10.1017/pds.2021.449","apa":"Richards, D. C., Stevenson, P. D., Mattson, C. A., & Salmon, J. L. (2021). INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS. Proceedings of the Design Society, 1, 1877. https://doi.org/10.1017/pds.2021.449","mla":"Richards, D.C., et al. \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS.\" Proceedings of the Design Society, vol. 1, 2021, p. 1877, https://doi.org/10.1017/pds.2021.449.","chicago":"Richards, D.C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. 2021. \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS.\" Proceedings of the Design Society 1: 1877. https://doi.org/10.1017/pds.2021.449.","ieee":"D. C. Richards, P. D. Stevenson, C. A. Mattson, and J. L. Salmon, \"INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS,\" Proceedings of the Design Society, vol. 1, pp. 1877, Aug. 2021, doi: 10.1017/pds.2021.449.","bibtex":"@article{richards2021integrating,\n  author    = {Richards, D.C. and Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L.},\n  title     = {INTEGRATING SOCIAL IMPACT MEASURES INTO THE AIRSHIP DESIGN PROCESS},\n  journal   = {Proceedings of the Design Society},\n  volume    = {1},\n  pages     = {1877},\n  year      = {2021},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2021.449}\n}"},"identifying-high-potential-work-areas-in-engineering-for-global-development-link":{"navTitle":"identifying high potential work areas in engineering for global development link","slug":"identifying-high-potential-work-areas-in-engineering-for-global-development-link","catalogId":"identifying-high-potential-work-areas-in-engineering-for-global-development-link","catalogUrl":"/identifying-high-potential-work-areas-in-engineering-for-global-development-link","h1":"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index","teaser":"Abstract Those working in Engineering for Global Development seek to improve the conditions in developing countries.","abstract":"Abstract Those working in Engineering for Global Development seek to improve the conditions in developing countries. A common metric for understanding the development state of a given country is the Human Development Index (HDI), which focuses on three dimensions: health, education, and income. An engineer’s expertise does not always align with any of those dimensions directly, while they still hope to perform impactful work for human development. To discover other areas of expertise that are highly associated with the HDI, correlations and variable selection were performed between all World Development Indicators and the HDI. The resultant associations are presented according to industry sector for a straightforward connection to engineering expertise. The associated areas of expertise can be used during opportunity development as surrogates for focusing on the HDI dimensions themselves. The data analysis shows that work related to “Trade, Transportation, and Utilities,” such as electricity distribution, and exports or imports, “Natural Resources and Mining,” such as energy resources, agriculture, or access to clean water, and “Manufacturing,” in general, are most commonly associated with improvements in the HDI in developing countries. Also, because the associations were discovered at country-level, they direct where geographically particular areas of expertise have been historically associated with improving HDI.","publisherUrl":"https://doi.org/10.1115/1.4048746","apa":"Smith, D. O., Mattson, C. A., & Dahlin, E. C. (2021). Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index. Journal of Mechanical Design, 143(6), Article 061404. https://doi.org/10.1115/1.4048746","mla":"Smith, Daniel O., et al. \"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index.\" Journal of Mechanical Design, vol. 143, no. 6, 2021, p. 061404, https://doi.org/10.1115/1.4048746.","chicago":"Smith, Daniel O., Christopher A. Mattson, and Eric C. Dahlin. 2021. \"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index.\" Journal of Mechanical Design 143 (6): 061404. https://doi.org/10.1115/1.4048746.","ieee":"D. O. Smith, C. A. Mattson, and E. C. Dahlin, \"Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index,\" Journal of Mechanical Design, vol. 143, no. 6, Art. no. 061404, Jun. 2021, doi: 10.1115/1.4048746.","bibtex":"@article{smith2021identifying,\n  author    = {Smith, Daniel O. and Mattson, Christopher A. and Dahlin, Eric C.},\n  title     = {Identifying High-Potential Work Areas in Engineering for Global Development: Linking Industry Sectors to the Human Development Index},\n  journal   = {Journal of Mechanical Design},\n  volume    = {143},\n  number    = {6},\n  pages     = {061404},\n  year      = {2021},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4048746}\n}"},"nitrile-cup-seal-robustness-in-the-india-mark-ii-iii-hand-pump-system":{"navTitle":"nitrile cup seal robustness in the india mark ii iii hand pump system","slug":"nitrile-cup-seal-robustness-in-the-india-mark-ii-iii-hand-pump-system","catalogId":"nitrile-cup-seal-robustness-in-the-india-mark-ii-iii-hand-pump-system","catalogUrl":"/nitrile-cup-seal-robustness-in-the-india-mark-ii-iii-hand-pump-system","h1":"Nitrile cup seal robustness in the India Mark II/III hand pump system","teaser":"Assesses nitrile cup seal robustness in India Mark II/III hand pump systems under field conditions.","abstract":"Assesses nitrile cup seal robustness in India Mark II/III hand pump systems under field conditions.","publisherUrl":"https://doi.org/10.1016/j.deveng.2021.100060","apa":"Ottosson, H. J., Mattson, C. A., Johnson, O. K., & Naylor, T. A. (2021). Nitrile cup seal robustness in the India Mark II/III hand pump system. Development Engineering, 6, Article 100060. https://doi.org/10.1016/j.deveng.2021.100060","mla":"Ottosson, Hans J., et al. \"Nitrile cup seal robustness in the India Mark II/III hand pump system.\" Development Engineering, vol. 6, 2021, p. 100060, https://doi.org/10.1016/j.deveng.2021.100060.","chicago":"Ottosson, Hans J., Christopher A. Mattson, Oliver K. Johnson, and Thomas A. Naylor. 2021. \"Nitrile cup seal robustness in the India Mark II/III hand pump system.\" Development Engineering 6: 100060. https://doi.org/10.1016/j.deveng.2021.100060.","ieee":"H. J. Ottosson, C. A. Mattson, O. K. Johnson, and T. A. Naylor, \"Nitrile cup seal robustness in the India Mark II/III hand pump system,\" Development Engineering, vol. 6, Art. no. 100060, 2021, doi: 10.1016/j.deveng.2021.100060.","bibtex":"@article{ottosson2021nitrile,\n  author    = {Ottosson, Hans J. and Mattson, Christopher A. and Johnson, Oliver K. and Naylor, Thomas A.},\n  title     = {Nitrile cup seal robustness in the India Mark II/III hand pump system},\n  journal   = {Development Engineering},\n  volume    = {6},\n  pages     = {100060},\n  year      = {2021},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2021.100060}\n}"},"open-research-questions-for-incorporating-multi-stakeholder-interests-in-enginee":{"navTitle":"Open Research Questions for Incorporating Multi-Stakeholder Interests","slug":"open-research-questions-for-incorporating-multi-stakeholder-interests","catalogId":"open-research-questions-for-incorporating-multi-stakeholder-interests","catalogUrl":"/open-research-questions-for-incorporating-multi-stakeholder-interests","h1":"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development","teaser":"Abstract There is potential for multi-stakeholder social impact design approaches to help advance design and modeling processes in engineering for global development.","abstract":"Abstract There is potential for multi-stakeholder social impact design approaches to help advance design and modeling processes in engineering for global development. Adding multiple stakeholders, however, raises questions about how to choose stakeholders, weight their preferences, and ultimately model the perceived or actual impacts of products on stakeholders. While methods for handling the interests of multiple stakeholders exist in the literature, they are not without problems that are often exacerbated when modeling social impact in an engineering for global development setting. The purpose of this paper is to articulate some of the barriers and open research questions for handling multiple stakeholder interests during the process of designing engineering for global development products. Six challenges and sixteen research questions are presented.","publisherUrl":"https://doi.org/10.1115/detc2021-71835","apa":"Stevenson, P. D., Wood, A. E., Mattson, C. A., & Salmon, J. L. (2021). Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development. Volume 3B: 47th Design Automation Conference (DAC), V03BT03A020. https://doi.org/10.1115/detc2021-71835","mla":"Stevenson, Phillip D., et al. \"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development.\" Volume 3B: 47th Design Automation Conference (DAC), 2021, p. V03BT03A020, https://doi.org/10.1115/detc2021-71835.","chicago":"Stevenson, Phillip D., Amy E. Wood, Christopher A. Mattson, and John L. Salmon. 2021. \"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development.\" Volume 3B: 47th Design Automation Conference (DAC): V03BT03A020. https://doi.org/10.1115/detc2021-71835.","ieee":"P. D. Stevenson, A. E. Wood, C. A. Mattson, and J. L. Salmon, \"Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development,\" Volume 3B: 47th Design Automation Conference (DAC), pp. V03BT03A020, Aug. 2021, doi: 10.1115/detc2021-71835.","bibtex":"@article{stevenson2021open,\n  author    = {Stevenson, Phillip D. and Wood, Amy E. and Mattson, Christopher A. and Salmon, John L.},\n  title     = {Open Research Questions for Incorporating Multi-Stakeholder Interests in Engineering for Global Development},\n  journal   = {Volume 3B: 47th Design Automation Conference (DAC)},\n  pages     = {V03BT03A020},\n  year      = {2021},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2021-71835}\n}"},"product-development-using-perceived-correlations-between-the-united-nations-sust":{"navTitle":"product development using perceived correlations","slug":"product-development-using-perceived-correlations","catalogId":"product-development-using-perceived-correlations","catalogUrl":"/product-development-using-perceived-correlations","h1":"Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories","teaser":"Abstract This paper discusses the perceived relations between the Social Impact Categories (SIC) and Social, Economic, and Environmental (SEE) Aspects derived from the United Nations’ Sustainable Development Goals (SDGs).","abstract":"Abstract This paper discusses the perceived relations between the Social Impact Categories (SIC) and Social, Economic, and Environmental (SEE) Aspects derived from the United Nations’ Sustainable Development Goals (SDGs). Surveys showed high correlations between Health and Safety and Population Change to the majority of SEE Aspects. There were also high correlations between the SICs and economic and environmental factors. Further research will survey perceived relations between all three SEE impact categories.","publisherUrl":"https://doi.org/10.1115/detc2021-72065","apa":"Johnson, G. E., Fisher, M. J., Salmon, J. L., & Mattson, C. A. (2021). Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories. Volume 5: 26th Design for Manufacturing and the Life Cycle Conference (DFMLC), V005T05A028. https://doi.org/10.1115/detc2021-72065","mla":"Johnson, Gabrielle E., et al. \"Product Development Using Perceived Correlations Between the United Nations Sustainable Development Goals and Social Impact Categories.\" Volume 5: 26th Design for Manufacturing and the Life Cycle Co isting Products Designed for the Developing World, With Implications for New Product Development","teaser":"Abstract Engineered products often have more social impacts than are realized.","abstract":"Abstract Engineered products often have more social impacts than are realized. A product review was conducted to bring this to light. In this paper, we show the extent to which different social impacts in 11 impact categories are co-present in 150 products and how this can help engineers and others during the product development process. Specifically, we show how social impact categories not previously considered can be identified. The product review resulted in 13,200 data points that were divided into two data sets, one with 8800 data points from which a social impact probability table was created. The remaining data points were then used to validate the table. All data points were then combined to create a final social impact probability table. This table provides insight for how various social impact categories correlate and can assist engineers in expanding their views to include additional social impact objectives and thus achieve a design with broader social impact or a design with minimized unwanted negative social impact. A simple method for predicting social impact is also created in order to assist engineers when developing products with social impacts in mind.","publisherUrl":"https://doi.org/10.1115/1.4044323","apa":"Ottosson, H. J., Mattson, C. A., & Dahlin, E. C. (2020). Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development. Journal of Mechanical Design, 142(5), Article 051101. https://doi.org/10.1115/1.4044323","mla":"Ottosson, Hans J., et al. \"Analysis of Perceived Social Impacts of Existing Products Designed for the Developing World, With Implications for New Product Development.\" Journal of Mechanical Design, vol. 142, no. 5, 2020, p. 051101, https://doi.org/10.1115 ce Information Systems, 17(5), 229. https://doi.org/10.2514/1.i010766","mla":"Salmon, John L., et al. \"Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game.\" Journal of Aerospace Information Systems, vol. 17, no. 5, 2020, p. 229, https://doi.org/10.2514/1.i010766.","chicago":"Salmon, John L., Landon C. Willey, David Casbeer, Eloy Garcia, and Alexander Von Moll. 2020. \"Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game.\" Journal of Aerospace Information Systems 17 (5): 229. https://doi.org/10.2514/1.i010766.","ieee":"J. L. Salmon, L. C. Willey, D. Casbeer, E. Garcia, and A. V. Moll, \"Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game,\" Journal of Aerospace Information Systems, vol. 17, no. 5, pp. 229, May 2020, doi: 10.2514/1.i010766.","bibtex":"@article{salmon2020single,\n  author    = {Salmon, John L. and Willey, Landon C. and Casbeer, David and Garcia, Eloy and Moll, Alexander Von},\n  title     = {Single Pursuer and Two Cooperative Evaders in the Border Defense Differential Game},\n  journal   = {Journal of Aerospace Information Systems},\n  volume    = {17},\n  number    = {5},\n  pages     = {229},\n  year      = {2020},\n  publisher = {American Institute of Aeronautics and Astronautics (AIAA)},\n  doi       = {10.2514/1.i010766}\n}"},"structural-design-space-exploration-using-principal-component-analysis":{"navTitle":"structural design space exploration using principal component analysis","slug":"structural-design-space-exploration-using-principal-component-analysis","catalogId":"structural-design-space-exploration-using-principal-component-analysis","catalogUrl":"/structural-design-space-exploration-using-principal-component-analysis","h1":"Structural Design Space Exploration Using Principal Component Analysis","teaser":"Abstract Design space exploration (DSE) is the process whereby a designer seeks to understand some results across a set of design variations.","abstract":"Abstract Design space exploration (DSE) is the process whereby a designer seeks to understand some results across a set of design variations. Structural DSE of turbomachinery compressor blades is often challenging because the large number of design variables make it difficult to learn the effect that each variable has upon the stress contours. Principal component analysis (PCA) of the stress contours is used as a way to understand how the stress contours change over the design space. Two methods are introduced to address the challenge of understanding how the stress changes over a large number of variables. First, a two-point correlation is applied to relate the design variables to the scores of each principal component. Second, a coupling of the stress and coordinate location of each node in PCA is developed which also indicates how the stress variations relate to geometric variations. These provide insight to how design variables influence the stress. It is shown how these methods use PCA as DSE tools to better explore the structural design space of compressor blades. Better DSE can improve compressor blades and the computational cost needed for their design.","publisherUrl":"https://doi.org/10.1115/1.4047428","apa":"Bunnell, S., Gorrell, S., Salmon, J., Thelin, C., & Ruoti, C. (2020). Structural Design Space Exploration Using Principal Component Analysis. Journal of Computing and Information Science in Engineering, 20(6), Article 061014. https://doi.org/10.1115/1.4047428","mla":"Bunnell, Spencer, et al. \"Structural Design Space Exploration Using Principal Component Analysis.\" Journal of Computing and Information Science in Engineering, vol. 20, no. 6, 2020, p. 061014, https://doi.org/10.1115/1.4047428.","chicago":"Bunnell, Spencer, Steven Gorrell, John Salmon, Christopher Thelin, and Christopher Ruoti. 2020. \"Structural Design Space Exploration Using Principal Component Analysis.\" Journal of Computing and Information Science in Engineering 20 (6): 061014. https://doi.org/10.1115/1.4047428.","ieee":"S. Bunnell, S. Gorrell, J. Salmon, C. Thelin, and C. Ruoti, \"Structural Design Space Exploration Using Principal Component Analysis,\" Journal of Computing and Information Science in Engineering, vol. 20, no. 6, Art. no. 061014, Dec. 2020, doi: 10.1115/1.4047428.","bibtex":"@article{bunnell2020structural,\n  author    = {Bunnell, Spencer and Gorrell, Steven and Salmon, John and Thelin, Christopher and Ruoti, Christopher},\n  title     = {Structural Design Space Exploration Using Principal Component Analysis},\n  journal   = {Journal of Computing and Information Science in Engineering},\n  volume    = {20},\n  number    = {6},\n  pages     = {061014},\n  year      = {2020},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4047428}\n}"},"analysis-and-evaluation-of-partitioning-methods-for-multi-user-cad":{"navTitle":"analysis and evaluation of partitioning methods for multi user cad","slug":"analysis-and-evaluation-of-partitioning-methods-for-multi-user-cad","catalogId":"analysis-and-evaluation-of-partitioning-methods-for-multi-user-cad","catalogUrl":"/analysis-and-evaluation-of-partitioning-methods-for-multi-user-cad","h1":"Analysis and Evaluation of Partitioning Methods for Multi-User CAD","teaser":"Evaluates partitioning methods that improve multi-user CAD collaboration and shared model workflows.","abstract":"Evaluates partitioning methods that improve multi-user CAD collaboration and shared model workflows.","publisherUrl":"https://doi.org/10.14733/cadconfp.2019.377-381","apa":"Ong, J., Richards, D., & Salmon, J. (2019). Analysis and Evaluation of Partitioning Methods for Multi-User CAD. Proceedings of CAD'19, 377. https://doi.org/10.14733/cadconfp.2019.377-381","mla":"Ong, Jemi, et al. \"Analysis and Evaluation of Partitioning Methods for Multi-User CAD.\" Proceedings of CAD'19, 2019, p. 377, https://doi.org/10.14733/cadconfp.2019.377-381.","chicago":"Ong, Jemi, Daniel Richards, and John Salmon
