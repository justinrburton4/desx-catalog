      try {
        return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveDrafts(map) {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(map));
      } catch (e) {}
      scheduleRepoSave();
    }

    function loadMeta() {
      try {
        return JSON.parse(localStorage.getItem(META_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveMeta(meta) {
      try {
        localStorage.setItem(META_KEY, JSON.stringify(meta));
      } catch (e) {}
    }

    function openIdb() {
      return new Promise(function (resolve, reject) {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () {
          req.result.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }

    function idbGet(key) {
      return openIdb().then(function (db) {
        return new Promise(function (resolve, reject) {
          const tx = db.transaction(IDB_STORE, "readonly");
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function idbSet(key, value) {
      return openIdb().then(function (db) {
        return new Promise(function (resolve, reject) {
          const tx = db.transaction(IDB_STORE, "readwrite");
          const req = tx.objectStore(IDB_STORE).put(value, key);
          req.onsuccess = function () { resolve(); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function buildRepoPayload() {
      return {
        version: 1,
        updatedAt: new Date().toISOString(),
        drafts: loadDrafts(),
        done: loadDone(),
      };
    }

    function updateDraftStatus(message, linked) {
      if (!els.draftStatus) return;
      els.draftStatus.classList.toggle("linked", !!linked);
      els.draftStatus.innerHTML = message;
    }

    function downloadRepoPayload(payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "research-landing-drafts.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function writeRepoPayload(payload) {
      if (!repoFileHandle) return false;
      try {
        const writable = await repoFileHandle.createWritable();
        await writable.write(JSON.stringify(payload, null, 2));
        await writable.close();
        saveMeta({ updatedAt: payload.updatedAt, linkedFile: true });
        updateDraftStatus(
          "Linked to <strong>" + repoFileHandle.name + "</strong>. Edits auto-save for Cursor.",
          true
        );
        return true;
      } catch (e) {
        updateDraftStatus("Could not write drafts file. Re-link it or use Export drafts.", false);
        return false;
      }
    }

    function scheduleRepoSave() {
      clearTimeout(repoSaveTimer);
      repoSaveTimer = setTimeout(function () {
        const payload = buildRepoPayload();
        writeRepoPayload(payload);
      }, 400);
    }

    async function exportDraftsToRepo() {
      const payload = buildRepoPayload();
      if (repoFileHandle) {
        await writeRepoPayload(payload);
        return;
      }
      downloadRepoPayload(payload);
      updateDraftStatus(
        'Downloaded <code>research-landing-drafts.json</code>. Save it to <code>catalog/</code> in your project.',
        false
      );
    }

    async function linkDraftsFile() {
      if (!window.showOpenFilePicker) {
        exportDraftsToRepo();
        return;
      }
      try {
        const handles = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        repoFileHandle = handles[0];
        await idbSet(FILE_HANDLE_KEY, repoFileHandle);
        const payload = buildRepoPayload();
        await writeRepoPayload(payload);
      } catch (e) {
        if (e && e.name !== "AbortError") {
          updateDraftStatus("Could not link drafts file. Use Export drafts instead.", false);
        }
      }
    }

    async function restoreLinkedFile() {
      if (!window.showOpenFilePicker) return;
      try {
        const handle = await idbGet(FILE_HANDLE_KEY);
        if (!handle) return;
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted") {
          repoFileHandle = handle;
          updateDraftStatus(
            "Linked to <strong>" + handle.name + "</strong>. Edits auto-save for Cursor.",
            true
          );
          return;
        }
        const req = await handle.requestPermission({ mode: "readwrite" });
        if (req === "granted") {
          repoFileHandle = handle;
          updateDraftStatus(
            "Linked to <strong>" + handle.name + "</strong>. Edits auto-save for Cursor.",
            true
          );
        }
      } catch (e) {}
    }

    function mergeRepoBootstrap() {
      const bootstrap = REPO_BOOTSTRAP || {};
      const bootstrapDrafts = bootstrap.drafts || {};
      const bootstrapDone = bootstrap.done || {};
      const bootstrapAt = bootstrap.updatedAt || "";
      const meta = loadMeta();
      const localAt = meta.updatedAt || "";

      const drafts = loadDrafts();
      const done = loadDone();
      let changed = false;

      if (!localAt && bootstrapAt) {
        Object.keys(bootstrapDrafts).forEach(function (id) {
          drafts[id] = bootstrapDrafts[id];
          changed = true;
        });
        Object.keys(bootstrapDone).forEach(function (id) {
          done[id] = bootstrapDone[id];
          changed = true;
        });
      } else if (bootstrapAt && bootstrapAt > localAt) {
        Object.keys(bootstrapDrafts).forEach(function (id) {
          drafts[id] = Object.assign(drafts[id] || {}, bootstrapDrafts[id]);
          changed = true;
        });
        Object.assign(done, bootstrapDone);
        changed = true;
      } else {
        Object.keys(bootstrapDrafts).forEach(function (id) {
          if (!drafts[id]) {
            drafts[id] = bootstrapDrafts[id];
            changed = true;
          }
        });
      }

      if (changed) {
        try {
          localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
          localStorage.setItem(DONE_KEY, JSON.stringify(done));
          if (bootstrapAt) saveMeta({ updatedAt: bootstrapAt });
        } catch (e) {}
      }
    }

    function slugToNavTitle(slug) {
      return String(slug || "").replace(/^\//, "").replace(/-/g, " ");
    }

    function navTitleToSlug(navTitle) {
      return String(navTitle || "")
        .toLowerCase()
        .trim()
        .replace(/['']/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function firstSentence(text) {
      const t = String(text || "").trim();
      if (!t) return "";
      const m = t.match(/^[\s\S]*?[.!?](?=\s|$)/);
      return m ? m[0].trim() : t;
    }

    function packById(id) {
      return PACKS.find(function (p) { return p.id === id; });
    }

    function defaultDraft(p) {
      const slug = String(p.slug || "").replace(/^\//, "");
      return {
        navTitle: slugToNavTitle(p.slug),
        slug: slug,
        catalogId: p.id,
        catalogUrl: p.slug,
        h1: p.title,
        teaser: firstSentence(p.abstract),
        abstract: p.abstract || "",
        publisherUrl: p.publisher_url || "",
        apa: p.apa || "",
        mla: p.mla || "",
        chicago: p.chicago_author_date || "",
        ieee: p.ieee || "",
        bibtex: p.bibtex || "",
      };
    }

    function loadDraftForPaper(p) {
      const saved = loadDrafts()[p.id];
      return saved ? Object.assign(defaultDraft(p), saved) : defaultDraft(p);
    }

    function persistDraft() {
      if (!currentId || !draft) return;
      const map = loadDrafts();
      map[currentId] = draft;
      saveDrafts(map);
    }

    function readDraftFromDom() {
      function val(id) {
        const el = document.getElementById(id);
        if (!el) return "";
        return el.value != null ? el.value : el.textContent || "";
      }
      return {
        navTitle: val("nav-title"),
        slug: val("url-slug"),
        catalogId: val("catalog-id"),
        catalogUrl: val("catalog-url"),
        h1: val("h1-title"),
        teaser: val("h2-teaser"),
        abstract: val("abstract"),
        publisherUrl: val("publisher-url"),
        apa: val("cite-0"),
        mla: val("cite-1"),
        chicago: val("cite-2"),
        ieee: val("cite-3"),
        bibtex: val("cite-4"),
      };
    }

    function citationStylesFromDraft(d) {
      return [
        ["APA", d.apa],
        ["MLA", d.mla],
        ["Chicago (Author-Date)", d.chicago],
        ["IEEE", d.ieee],
        ["BibTeX", d.bibtex],
      ];
    }

    function buildCitationBlock(d) {
      const lines = [];
      citationStylesFromDraft(d).forEach(function (pair) {
        lines.push(pair[0]);
        lines.push("");
        lines.push(pair[1] || "");
        lines.push("");
      });
      return lines.join("\n").trim();
    }

    function buildFullPageText(d) {
      const lines = [
        d.h1,
        "",
        d.teaser,
        "",
        d.abstract || "",
        "",
        "Read the full paper",
        d.publisherUrl || "",
        "",
        buildCitationBlock(d),
      ];
      return lines.join("\n").trim();
    }

    function syncSlugFromNavTitle() {
      const navEl = document.getElementById("nav-title");
      if (!navEl) return;
      const slug = navTitleToSlug(navEl.value);
      const slugEl = document.getElementById("url-slug");
      const idEl = document.getElementById("catalog-id");
      const urlEl = document.getElementById("catalog-url");
      if (slugEl) slugEl.value = slug;
      if (idEl) idEl.value = slug;
      if (urlEl) urlEl.value = slug ? "/" + slug : "";
      refreshCitationPreview();
    }

    function refreshCitationPreview() {
      const d = readDraftFromDom();
      const preview = document.getElementById("all-citations");
      if (preview) preview.value = buildCitationBlock(d);
    }

    function copyText(text, btn) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(function () {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "Copied";
        btn.classList.add("copied");
        setTimeout(function () {
          btn.textContent = old;
          btn.classList.remove("copied");
        }, 1200);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function fieldHtml(label, value, opts) {
      opts = opts || {};
      const id = opts.id || "";
      const mono = opts.mono ? " mono" : "";
      const auto = opts.autoSync ? " auto-sync" : "";
      const hint = opts.hint ? '<div class="hint">' + opts.hint + "</div>" : "";
      const rows = opts.rows || (opts.multiline ? 4 : 0);
      let control;
      if (opts.multiline) {
        control =
          '<textarea class="value' + mono + auto + '" id="' + id + '" rows="' + rows + '">' +
          escapeHtml(value || "") +
          "</textarea>";
      } else {
        control =
          '<input class="value' + mono + auto + '" type="text" id="' + id + '" value="' +
          escapeAttr(value || "") +
          '" />';
      }
      return (
        '<div class="field">' +
        '<div class="field-head">' +
        "<label for=\"" + id + "\">" + label + "</label>" +
        '<button type="button" class="copy-field-btn">Copy</button>' +
        "</div>" +
        control +
        hint +
        "</div>"
      );
    }

    function saveAndSwitch(nextId) {
      if (currentId && draft) {
        draft = readDraftFromDom();
        persistDraft();
      }
      currentId = nextId;
      const p = packById(currentId);
      draft = p ? loadDraftForPaper(p) : null;
      render();
    }

    function render() {
      const p = packById(currentId);
      if (!p || !draft) {
        els.main.innerHTML = "<p>No papers match your filter.</p>";
        return;
      }

      const done = loadDone();
      const isDone = !!done[p.id];
      const citeBlock = buildCitationBlock(draft);
      const notes = (p.notes || []).join(" ");

      els.main.innerHTML =
        '<div class="meta">' +
        '<span class="pill">#' + (PACKS.indexOf(p) + 1) + " of " + PACKS.length + "</span>" +
        '<span class="pill">' + escapeHtml(p.badge || "") + "</span>" +
        '<span class="pill">' + escapeHtml(String(p.year || "")) + "</span>" +
        (isDone ? '<span class="pill done">Page created</span>' : "") +
        "</div>" +
        '<section><h2>Squarespace page setup</h2>' +
        fieldHtml("Navigation title", draft.navTitle, {
          id: "nav-title",
          hint: "Editing this updates the URL slug and catalog id below automatically.",
        }) +
        fieldHtml("URL slug", draft.slug, {
          id: "url-slug",
          autoSync: true,
          hint: "Auto-filled from navigation title. You can still tweak manually if Squarespace differs.",
        }) +
        '<div class="checkline"><input type="checkbox" id="done-check"' + (isDone ? " checked" : "") + ' /><label for="done-check">Mark this paper as done</label></div>' +
        "</section>" +
        '<section><h2>Page content (template order)</h2>' +
        fieldHtml("H1 title", draft.h1, { id: "h1-title" }) +
        fieldHtml("H2 one-sentence teaser", draft.teaser, {
          id: "h2-teaser",
          multiline: true,
          rows: 2,
          hint: "First sentence of the abstract. Adjust in Squarespace if you want a sharper hook.",
        }) +
        fieldHtml("Abstract body", draft.abstract, { id: "abstract", multiline: true, rows: 6 }) +
        fieldHtml("Read the full paper (button link)", draft.publisherUrl, { id: "publisher-url" }) +
        "</section>" +
        '<section><h2>Cite this paper</h2>' +
        '<div class="actions"><button type="button" class="primary" id="copy-citations-btn">Copy entire citation section</button></div>' +
        fieldHtml("All citations (paste under the Cite this paper heading)", citeBlock, {
          mono: true,
          id: "all-citations",
          multiline: true,
          rows: 14,
          hint: "Heading omitted on purpose — your Squarespace template already has it.",
        }) +
        fieldHtml("APA", draft.apa, { id: "cite-0", multiline: true, rows: 3 }) +
        fieldHtml("MLA", draft.mla, { id: "cite-1", multiline: true, rows: 3 }) +
        fieldHtml("Chicago (Author-Date)", draft.chicago, { id: "cite-2", multiline: true, rows: 3 }) +
        fieldHtml("IEEE", draft.ieee, { id: "cite-3", multiline: true, rows: 3 }) +
        fieldHtml("BibTeX", draft.bibtex, { id: "cite-4", multiline: true, rows: 6, mono: true }) +
        "</section>" +
        '<section><h2>After publish</h2>' +
        fieldHtml("Catalog id", draft.catalogId, {
          id: "catalog-id",
          autoSync: true,
          hint: "Auto-filled from navigation title. Use this id when updating desx-catalog.json.",
        }) +
        fieldHtml("Update catalog url to", draft.catalogUrl, {
          id: "catalog-url",
          autoSync: true,
          hint: "Auto-filled from navigation title (with leading slash).",
        }) +
        (notes ? '<div class="hint">' + escapeHtml(notes) + "</div>" : "") +
        "</section>";

      document.getElementById("nav-title").addEventListener("input", function () {
        syncSlugFromNavTitle();
        draft = readDraftFromDom();
        persistDraft();
      });

      ["cite-0", "cite-1", "cite-2", "cite-3", "cite-4"].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("input", function () {
            refreshCitationPreview();
            draft = readDraftFromDom();
            persistDraft();
          });
        }
      });

      [
        "url-slug", "catalog-id", "catalog-url", "h1-title", "h2-teaser",
        "abstract", "publisher-url",
      ].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("input", function () {
            draft = readDraftFromDom();
            persistDraft();
          });
        }
      });

      document.getElementById("done-check").addEventListener("change", function (e) {
        const map = loadDone();
        if (e.target.checked) map[p.id] = true;
        else delete map[p.id];
        saveDone(map);
        render();
      });

      document.getElementById("copy-citations-btn").addEventListener("click", function (e) {
        copyText(buildCitationBlock(readDraftFromDom()), e.currentTarget);
      });

      els.main.querySelectorAll(".copy-field-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const field = btn.closest(".field");
          const control = field.querySelector("textarea, input");
          copyText(control ? control.value : "", btn);
        });
      });
    }

    function fillSelect() {
      const prev = currentId;
      els.select.innerHTML = filtered
        .map(function (p, i) {
          const d = loadDraftForPaper(p);
          const done = loadDone()[p.id] ? " ✓" : "";
          return '<option value="' + escapeHtml(p.id) + '">' + (i + 1) + ". " + escapeHtml(d.navTitle) + done + "</option>";
        })
        .join("");

      if (!filtered.length) {
        currentId = "";
        draft = null;
        render();
        return;
      }

      if (!filtered.some(function (p) { return p.id === prev; })) {
        saveAndSwitch(filtered[0].id);
        els.select.value = currentId;
        return;
      }
      els.select.value = currentId;
    }

    function applyFilter() {
      if (currentId && draft) {
        draft = readDraftFromDom();
        persistDraft();
      }
      const q = els.search.value.trim().toLowerCase();
      if (!q) {
        filtered = PACKS.slice();
      } else {
        filtered = PACKS.filter(function (p) {
          const d = loadDraftForPaper(p);
          return (
            p.title.toLowerCase().indexOf(q) !== -1 ||
            p.id.toLowerCase().indexOf(q) !== -1 ||
            d.navTitle.toLowerCase().indexOf(q) !== -1 ||
            d.slug.toLowerCase().indexOf(q) !== -1
          );
        });
      }
      fillSelect();
      if (currentId && !draft) {
        draft = loadDraftForPaper(packById(currentId));
        render();
      }
    }

    els.search.addEventListener("input", applyFilter);
    els.select.addEventListener("change", function () {
      saveAndSwitch(els.select.value);
    });
    els.prev.addEventListener("click", function () {
      const idx = filtered.findIndex(function (p) { return p.id === currentId; });
      if (idx > 0) {
        saveAndSwitch(filtered[idx - 1].id);
        els.select.value = currentId;
      }
    });
    els.next.addEventListener("click", function () {
      const idx = filtered.findIndex(function (p) { return p.id === currentId; });
      if (idx >= 0 && idx < filtered.length - 1) {
        saveAndSwitch(filtered[idx + 1].id);
        els.select.value = currentId;
      }
    });
    els.copyAll.addEventListener("click", function (e) {
      copyText(buildFullPageText(readDraftFromDom()), e.currentTarget);
    });
    els.linkDrafts.addEventListener("click", linkDraftsFile);
    els.exportDrafts.addEventListener("click", exportDraftsToRepo);

    mergeRepoBootstrap();
    restoreLinkedFile();
    draft = PACKS[0] ? loadDraftForPaper(PACKS[0]) : null;
    applyFilter();
    render();
  </script>
</body>
</html>
