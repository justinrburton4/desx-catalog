,\n  author    = {Coburn, Joshua Q. and Freeman, Ian and Salmon, John L.},\n  title     = {A Review of the Capabilities of Current Low-Cost Virtual Reality Technology and Its Potential to Enhance the Design Process},\n  journal   = {Journal of Computing and Information Science in Engineering},\n  volume    = {17},\n  number    = {3},\n  pages     = {031013},\n  year      = {2017},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4036921}\n}"},{"id":"a-simple-starting-point-for-designing-for-and-or-assessing-the-social-impact-of","slug":"/a-simple-starting-point-for-designing-for-and-or-assessing-the-social-impact-of","title":"A Simple Starting Point for Designing for and/or Assessing the Social Impact of Products","catalog_title":"A Simple Starting Point for Designing for and/or Assessing the Social Impact of Products","abstract":"In this paper we present a starting point for designing for and/or assessing the social impact of engineered products. The starting point is a set of tables comprising products, their general functional characteristics, and the accompanying social impacts. We have constructed these tables by first extracting a set of social impact categories from the literature, then 65 products were qualitatively reviewed to find their social impact. The resulting product impact tables can be used at either the beginning of the product development process to decide what social impact to design for and discover product functions that lead to it, or later to qualitatively assess the social impact of a product being designed and/or to assess the impact of an existing product.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2017-67586","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"A Simple Starting Point for Designing for and/or Assessing the Social Impact of Products","journal":"Volume 2B: 43rd Design Automation Conference","year":2017,"volume":"","issue":"","page":"V02B itle     = {A Simple Starting Point for Designing for and/or Assessing the Social Impact of Products},\n  journal   = {Volume 2B: 43rd Design Automation Conference},\n  pages     = {V02BT03A015},\n  year      = {2017},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2017-67586}\n}"},{"id":"a-systems-engineering-approach-to-harnessing-human-energy-in-public-places-a-fea","slug":"/a-systems-engineering-approach-to-harnessing-human-energy-in-public-places-a-fea","title":"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study","catalog_title":"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study","abstract":"This study analyzes the feasibility of placing modified exercise equipment in public places to enable human energy harnessing. By assessing the impacts as a system-level synthesis of economic, environmental, productivity, and health benefits, it is shown that introducing human-powered equipment (HPE) in public places would be feasible and beneficial both to society in general and to the specific stakeholders investing in this technology. This study develops a framework to evaluate applications of this technology using benefits to costs analyses. The benefits and challenges for successful implementation of HPE technology are also presented and evaluated in various case studies involving public places at airports and schools.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4035904","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study","journal":"Journal of Energy Resources Technology","year":2017,"volume":"139","issue":"4","page":"041201","doi":"10.1115/1.4035904","authors_resolved":[{"family":"Jafek","given":"Alex"},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Jafek, A. & Salmon, J. L. (2017). A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study. Journal of Energy Resources Technology, 139(4), Article 041201. https://doi.org/10.1115/1.4035904","mla":"Jafek, Alex, and John L. Salmon. \"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study.\" Journal of Energy Resources Technology, vol. 139, no. 4, 2017, p. 041201, https://doi.org/10.1115/1.4035904.","chicago_author_date":"Jafek, Alex and John L. Salmon. 2017. \"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study.\" Journal of Energy Resources Technology 139 (4): 041201. https://doi.org/10.1115/1.4035904.","chicago_bibliography":"Jafek, Alex and John L. Salmon. \"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study.\" Journal of Energy Resources Technology 139, no. 4 (2017): 041201. https://doi.org/10.1115/1.4035904.","chicago_footnote":"Alex Jafek and John L. Salmon, \"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study,\" Journal of Energy Resources Technology 139, no. 4 (2017): 041201, https://doi.org/10.1115/1.4035904.","ieee":"A. Jafek and J. L. Salmon, \"A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study,\" Journal of Energy Resources Technology, vol. 139, no. 4, Art. no. 041201, Jul. 2017, doi: 10.1115/1.4035904.","bibtex":"@article{jafek2017systems,\n  author    = {Jafek, Alex and Salmon, John L.},\n  title     = {A Systems Engineering Approach to Harnessing Human Energy in Public Places: A Feasibility Study},\n  journal   = {Journal of Energy Resources Technology},\n  volume    = {139},\n  number    = {4},\n  pages     = {041201},\n  year      = {2017},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4035904}\n}"},{"id":"analysis-of-integrating-a-production-design-generator-with-a-business-decision-s","slug":"/analysis-of-integrating-a-production-design-generator-with-a-business-decision-s","title":"Analysis of Integrating a Production Design Generator with a Business Decision Support System for System-Level Decision Making","catalog_title":"Analysis of Integrating a Production Design Generator with a Business Decision Support System for System-Level Decision Making","abstract":"Decision support systems (DSSs) are used to enhance decision making speed and effectiveness. However, without a view of the entire system, any decision may have unanticipated effects, such as sub-optimal outcomes. This paper explores the benefits of applying a DSS over the analysis of unprocessed data and the effectiveness of integrating a product design generator (PDG) with a business DSS where system-level effects can be analyzed. Using survey questions and recording decision makers’ actions, it was found that decision makers are significantly faster and came to better conclusions when using the DSS over unprocessed data. However, it was also seen that the difference between the two variants of the system DSS that were used for testing was insignificant. Overall, this research shows that having a system-level tool is better than the unprocessed data and that large differences in a DSS are required for improvement between them.","abstract_source":"crossref","publisher_url":"https://doi.org/10.3390/systems5010014","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Analysis of Integrating a Production Design Generator with a Business Decision Support System for System-Level Decision Making","journal":"Systems","year":2017,"volume":"5","issue":"1","page":"14","doi":"10.3390/systems5010014","authors_resolved":[{"family":"Seletos","given":"Troy"},{"family":"Salmon","given":"John"}],"notes":[],"apa":"Seletos, T. & Salmon, J. (2017). Analysis of Integrating a Production Design Generator with a Business Decision Support System for System-Level Decisi g with concepts from modular product design and multi-objective optimization to benefit people living in poverty},\n  journal   = {Development Engineering},\n  volume    = {2},\n  pages     = {29},\n  year      = {2017},\n  publisher = {Elsevier BV},\n  doi       = {10.1016/j.deveng.2016.12.002}\n}"},{"id":"exploration-and-evaluation-of-cad-modeling-in-virtual-reality","slug":"/exploration-and-evaluation-of-cad-modeling-in-virtual-reality","title":"Exploration and Evaluation of CAD Modeling in Virtual Reality","catalog_title":"Exploration and Evaluation of CAD Modeling in Virtual Reality","abstract":"Explores and evaluates CAD modeling workflows performed inside virtual reality environments.","abstract_source":"catalog","publisher_url":"https://doi.org/10.14733/cadconfp.2017.357-361","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Exploration and Evaluation of CAD Modeling in Virtual Reality","journal":"Proceedings of CAD'17","year":2017,"volume":"","issue":"","page":"357","doi":"10.14733/cadconfp.2017.357-361","authors_resolved":[{"family":"Freeman","given":"Seth"},{"family":"Wright","given":"Landon"},{"family":"Salmon","given":"John"}],"notes":[],"apa":"Freeman, S., Wright, L., & Salmon, J. (2017). Exploration and Evaluation of CAD Modeling in Virtual Reality. Proceedings of CAD'17, 357. https://doi.org/10.14733/cadconfp.2017.357-361","mla":"Freeman, Seth, et al. \"Exploration and Evaluation of CAD Modeling in Virtual Reality.\" Proceedings of CAD'17, 2017, p. 357, https://doi.org/10.14733/cadconfp.2017.357-361.","chicago_author_date":"Freeman, Seth, Landon Wright, and John Salmon. 2017. \"Exploration and Evaluation of CAD Modeling in Virtual Reality.\" Proceedings of CAD'17: 357. https://doi.org/10.14733/cadconfp.2017.357-361.","chicago_bibliography":"Freeman, Seth, Landon Wright, and John Salmon. \"Exploration and Evaluation of CAD Modeling in Virtual Reality.\" Proceedings of CAD'17 (2017): 357. https://doi.org/10.14733/cadconfp.2017.357-361.","chicago_footnote":"Seth Freeman, Landon Wright, and John Salmon, \"Exploration and Evaluation of CAD Modeling in Virtual Reality,\" Proceedings of CAD'17 (2017): 357, https://doi.org/10.14733/cadconfp.2017.357-361.","ieee":"S. Freeman, L. Wright, and J. Salmon, \"Exploration and Evaluation of CAD Modeling in Virtual Reality,\" Proceedings of CAD'17, pp. 357, Aug. 2017, doi: 10.14733/cadconfp.2017.357-361.","bibtex":"@article{freeman2017exploration,\n  author    = {Freeman, Seth and Wright, Landon and Salmon, John},\n  title     = {Exploration and Evaluation of CAD Modeling in Virtual Reality},\n  journal   = {Proceedings of CAD'17},\n  pages     = {357},\n  year      = {2017},\n  publisher = {CAD Solutions LLC},\n  doi       = {10.14733/cadconfp.2017.357-361}\n}"},{"id":"improving-virtual-design-team-performance-through-use-of-a-collaborative-sketchi","slug":"/improving-virtual-design-team-performance-through-use-of-a-collaborative-sketchi","title":"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application","catalog_title":"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application","abstract":"As virtual teamwork in engineering becomes more central to the daily design activities of organizations around the world, it is increasingly important for team members to be able to easily and effectively share their visual ideas with remote teammates. However, sharing visual representations of ideas among virtual teammates is generally difficult and commonly hampered by various factors, making the process time-consuming and non-intuitive. In laboratory experiments and a case study, involving students from six different universities across the U.S. working as teams to build unmanned aerial vehicles (UAVs), the authors quantify how a collaborative sketching application (CSA) provides a significant benefit to design engineering activities for virtual teams. From the experiments and the case study, it was observed that such a tool improved users' understanding of each other's ideas when working in a virtual setting, improved the perceived equality of teammate contribution, and decreased the level of frustration experienced when working remotely.","abstract_source":"crossref","publisher_url":"https://doi.org/10.4018/ijec.2017100101","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application","journal":"International Journal of e-Collaboration","year":2017,"volume":"13","issue":"4","page":"1","doi":"10.4018/ijec.2017100101","authors_resolved":[{"family":"Stone","given":"Brett"},{"family":"Salmon","given":"John"},{"family":"Hepworth","given":"Ammon"},{"family":"Gorrell","given":"Steven"},{"family":"Richey","given":"Michael"}],"notes":[],"apa":"Stone, B., Salmon, J., Hepworth, A., Gorrell, S., & Richey, M. (2017). Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application. International Journal of e-Collaboration, 13(4), 1. https://doi.org/10.4018/ijec.2017100101","mla":"Stone, Brett, et al. \"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application.\" International Journal of e-Collaboration, vol. 13, no. 4, 2017, p. 1, https://doi.org/10.4018/ijec.2017100101.","chicago_author_date":"Stone, Brett, John Salmon, Ammon Hepworth, Steven Gorrell, and Michael Richey. 2017. \"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application.\" International Journal of e-Collaboration 13 (4): 1. https://doi.org/10.4018/ijec.2017100101.","chicago_bibliography":"Stone, Brett, John Salmon, Ammon Hepworth, Steven Gorrell, and Michael Richey. \"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application.\" International Journal of e-Collaboration 13, no. 4 (2017): 1. https://doi.org/10.4018/ijec.2017100101.","chicago_footnote":"Brett Stone, John Salmon, Ammon Hepworth, Steven Gorrell, and Michael Richey, \"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application,\" International Journal of e-Collaboration 13, no. 4 (2017): 1, https://doi.org/10.4018/ijec.2017100101.","ieee":"B. Stone, J. Salmon, A. Hepworth, S. Gorrell, and M. Richey, \"Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application,\" International Journal of e-Collaboration, vol. 13, no. 4, pp. 1, Oct. 2017, doi: 10.4018/ijec.2017100101.","bibtex":"@article{stone2017improving,\n  author    = {Stone, Brett and Salmon, John and Hepworth, Ammon and Gorrell, Steven and Richey, Michael},\n  title     = {Improving Virtual Design Team Performance Through Use of a Collaborative Sketching Application},\n  journal   = {International Journal of e-Collaboration},\n  volume    = {13},\n  number    = {4},\n  pages     = {1},\n  year      = {2017},\n  publisher = {IGI Global Scientific Publishing},\n  doi       = {10.4018/ijec.2017100101}\n}"},{"id":"towards-a-universal-social-impact-metric-for-engineered-products-that-alleviate","slug":"/towards-a-universal-social-impact-metric-for-engineered-products-that-alleviate","title":"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","catalog_title":"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","abstract":"More than ever before, engineers are creating products for developing countries. One of the purposes of these products is to improve the consumer’s quality of life. Currently, there is no established method of measuring the social impact of these types of products. As a result, engineers have used their own metrics to assess their product’s impact, if at all. Some of the common metrics used include products sold and revenue, which measure the financial success of a product without recognizing the social successes or failures it might have. In this paper we introduce a potential metric, the Product Impact Metric (PIM), which quantifies the impact a product has on impoverished individuals — especially those living in developing countries. It measures social impact broadly in five dimensions: health, education, standard of living, employment quality, and security. The PIM is inspired by the Multidimensional Poverty Index (MPI) created by the United Nations Development Programme. The MPI measures how the depth of poverty within a nation changes year after year, and the PIM measures how an individual’s quality of life changes after being affected by an engineered product. The Product Impact Metric can be used to predict social impacts (using personas that represent real individuals) or measure social impacts (using specific data from products introduced into the market).","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2017-67584","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty","journal":"Volume 2B: 43rd Design Automation Conference","year":2017,"volume":"","issue":"","page":"V02BT03A014","doi":"10.1115/detc2017-67584","authors_resolved":[{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Bryden","given":"Kenneth M."},{"family":"MacCarty","given":"Nordica A."}],"notes":[],"apa":"Stevenson, P. D., Mattson, C. A., Bryden, K. M., & MacCarty, N. A. (2017). Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty. Volume 2B: 43rd Design Automation Conference, V02BT03A014. https://doi.org/10.1115/detc2017-67584","mla":"Stevenson, Phillip D., et al. \"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty.\" Volume 2B: 43rd Design Automation Conference, 2017, p. V02BT03A014, https://doi.org/10.1115/detc2017-67584.","chicago_author_date":"Stevenson, Phillip D., Christopher A. Mattson, Kenneth M. Bryden, and Nordica A. MacCarty. 2017. \"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty.\" Volume 2B: 43rd Design Automation Conference: V02BT03A014. https://doi.org/10.1115/detc2017-67584.","chicago_bibliography":"Stevenson, Phillip D., Christopher A. Mattson, Kenneth M. Bryden, and Nordica A. MacCarty. \"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty.\" Volume 2B: 43rd Design Automation Conference (2017): V02BT03A014. https://doi.org/10.1115/detc2017-67584.","chicago_footnote":"Phillip D. Stevenson, Christopher A. Mattson, Kenneth M. Bryden, and Nordica A. MacCarty, \"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty,\" Volume 2B: 43rd Design Automation Conference (2017): V02BT03A014, https://doi.org/10.1115/detc2017-67584.","ieee":"P. D. Stevenson, C. A. Mattson, K. M. Bryden, and N. A. MacCarty, \"Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty,\" Volume 2B: 43rd Design Automation Conference, pp. V02BT03A014, Aug. 2017, doi: 10.1115/detc2017-67584.","bibtex":"@article{stevenson2017towards,\n  author    = {Stevenson, Phillip D. and Mattson, Christopher A. and Bryden, Kenneth M. and MacCarty, Nordica A.},\n  title     = {Towards a Universal Social Impact Metric for Engineered Products That Alleviate Poverty},\n  journal   = {Volume 2B: 43rd Design Automation Conference},\n  pages     = {V02BT03A014},\n  year      = {2017},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2017-67584}\n}"},{"id":"village-drill-a-case-study-in-engineering-for-global-development-with-five-years","slug":"/village-drill-a-case-study-in-engineering-for-global-development-with-five-years","title":"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction","catalog_title":"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction","abstract":"This paper presents a case study in engineering for global development. It introduces the Village Drill, which is an engineered product that has—5 years after its introduction to the market—enabled hundreds of thousands of people across 15 countries and three continents to have access to clean water. The Village Drill creates a 15 cm (6 in) borehole as deep as 76 m (250 ft) to reach groundwater suitable for drinking. The case study presents facts for the actual development and sustaining and are unaltered for the purpose of publication. This approach provides the reader with a realistic view of the development time, testing conditions, fundraising, and the work needed to sustain the drill through 5 years of sales and distribution. The purpose of the case study is to provide sufficient and frank data about a real project so as to promote discussion, critique, and other evaluations that will lead to new developments that inspire and inform successful engineering for global development. As part of the case, the paper describes six fundamental items: the product, the customer, the impact, the manufacturing, the delivery, and the revenue model of the drill.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4036304","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction","journal":"Journal of Mechanical Design","year":2017,"volume":"139","issue":"6","page":"065001","doi":"10.1115/1.4036304","authors_resolved":[{"family":"Mattson","given":"Christopher A."},{"family":"Wood","given":"Amy E."},{"family":"Renouard","given":"John"}],"notes":[],"apa":"Mattson, C. A., Wood, A. E., & Renouard, J. (2017). Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction. Journal of Mechanical Design, 139(6), Article 065001. https://doi.org/10.1115/1.4036304","mla":"Mattson, Christopher A., et al. \"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction.\" Journal of Mechanical Design, vol. 139, no. 6, 2017, p. 065001, https://doi.org/10.1115/1.4036304.","chicago_author_date":"Mattson, Christopher A., Amy E. Wood, and John Renouard. 2017. \"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction.\" Journal of Mechanical Design 139 (6): 065001. https://doi.org/10.1115/1.4036304.","chicago_bibliography":"Mattson, Christopher A., Amy E. Wood, and John Renouard. \"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction.\" Journal of Mechanical Design 139, no. 6 (2017): 065001. https://doi.org/10.1115/1.4036304.","chicago_footnote":"Christopher A. Mattson, Amy E. Wood, and John Renouard, \"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction,\" Journal of Mechanical Design 139, no. 6 (2017): 065001, https://doi.org/10.1115/1.4036304.","ieee":"C. A. Mattson, A. E. Wood, and J. Renouard, \"Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction,\" Journal of Mechanical Design, vol. 139, no. 6, Art. no. 065001, Jun. 2017, doi: 10.1115/1.4036304.","bibtex":"@article{mattson2017village,\n  author    = {Mattson, Christopher A. and Wood, Amy E. and Renouard, John},\n  title     = {Village Drill: A Case Study in Engineering for Global Development With Five Years of Data Post Market-Introduction},\n  journal   = {Journal of Mechanical Design},\n  volume    = {139},\n  number    = {6},\n  pages     = {065001},\n  year      = {2017},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4036304}\n}"},{"id":"design-for-the-developing-world-common-pitfalls-and-how-to-avoid-them","slug":"/design-for-the-developing-world-common-pitfalls-and-how-to-avoid-them","title":"Design for the Developing World: Common Pitfalls and How to Avoid Them","catalog_title":"Design for the Developing World: Common Pitfalls and How to Avoid Them","abstract":"Engineers face many challenges when designing for the developing world, which are not typically encountered in other design circumstances, such as a lack of understanding of language, culture, and context. These challenges often prevent engineers from having a sustained impact as they design for resource-poor individuals. In this paper, reports from 41 engineering projects in the developing world were analyzed, and common pitfalls were identified. The data came from Failure Reports from Engineers Without Borders (EWB) Canada and from the authors' own field reports. After the pitfalls are described, the authors present a visual tool called the Design for the Developing World Canvas to help design teams that are developing manufactured products to avoid these common pitfalls. This canvas can be used throughout the product development process as part of regular design reviews to help the team evaluate their progress in advancing the design while avoiding the pitfalls that engineers commonly face.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4032195","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Design for the Developing World: Common Pitfalls and How to Avoid Them","journal":"Journal of Mechanical Design","year":2016,"volume":"138","issue":"3","page":"031101","doi":"10.1115/1.4032195","authors_resolved":[{"family":"Wood","given":"Amy E."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Wood, A. E. & Mattson, C. A. (2016). Design for the Developing World: Common Pitfalls and How to Avoid Them. Journal of Mechanical Design, 138(3), Article 031101. https://doi.org/10.1115/1.4032195","mla":"Wood, Amy E., and Christopher A. Mattson. \"Design for the Developing World: Common Pitfalls and How to Avoid Them.\" Journal of Mechanical Design, vol. 138, no. 3, 2016, p. 031101, https://doi.org/10.1115/1.4032195.","chicago_author_date":"Wood, Amy E. and Christopher A. Mattson. 2016. \"Design for the Developing World: Common Pitfalls and How to Avoid Them.\" Journal of Mechanical Design 138 (3): 031101. https://doi.org/10.1115/1.4032195.","chicago_bibliography":"Wood, Amy E. and Christopher A. Mattson. \"Design for the Developing World: Common Pitfalls and How to Avoid Them.\" Journal of Mechanical Design 138, no. 3 (2016): 031101. https://doi.org/10.1115/1.4032195.","chicago_footnote":"Amy E. Wood and Christopher A. Mattson, \"Design for the Developing World: Common Pitfalls and How to Avoid Them,\" Journal of Mechanical Design 138, no. 3 (2016): 031101, https://doi.org/10.1115/1.4032195.","ieee":"A. E. Wood and C. A. Mattson, \"Design for the Developing World: Common Pitfalls and How to Avoid Them,\" Journal of Mechanical Design, vol. 138, no. 3, Art. no. 031101, Mar. 2016, doi: 10.1115/1.4032195.","bibtex":"@article{wood2016design,\n  author    = {Wood, Amy E. and Mattson, Christopher A.},\n  title     = {Design for the Developing World: Common Pitfalls and How to Avoid Them},\n  journal   = {Journal of Mechanical Design},\n  volume    = {138},\n  number    = {3},\n  pages     = {031101},\n  year      = {2016},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4032195}\n}"},{"id":"evaluation-of-system-evolvability-based-on-usable-excess","slug":"/evaluation-of-system-evolvability-based-on-usable-excess","title":"Evaluation of System Evolvability Based on Usable Excess","catalog_title":"Evaluation of System Evolvability Based on Usable Excess","abstract":"Complex, large-scale engineered systems are an integral part of modern society. The cost of these systems is often high, while their ability to react to emergent requirements can be low. This paper proposes evolvability, based on usable excess, as a possible metric to promote system longevity. An equation for the usability of excess, previously defined only in terms of quantity, is improved to include the attributes of type, location, and form as well as quantity. A methodology for evaluating a system's evolvability is also presented. Using an automated assembly line as an example, we show that system evolvability can be modeled as a function of usable excess.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4033989","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Evaluation of System Evolvability Based on Usable Excess","journal":"Journal of Mechanical Design","year":2016,"volume":"138","issue":"9","page":"091101","doi":"10.1115/1.4033989","authors_resolved":[{"family":"Allen","given":"Jeffrey D."},{"family":"Mattson","given":"Christopher A."},{"family":"Ferguson","given":"Scott M."}],"notes":[],"apa":"Allen, J. D., Mattson, C. A., & Ferguson, S. M. (2016). Evaluation of System Evolvability Based on Usable Excess. Journal of Mechanical Design, 138(9), Article 091101. https://doi.org/10.1115/1.4033989","mla":"Allen, Jeffrey D., et al. \"Evaluation of System Evolvability Based on Usable Excess.\" Journal of Mechanical Design, vol. 138, no. 9, 2016, p. 091101, https://doi.org/10.1115/1.4033989.","chicago_author_date":"Allen, Jeffrey D., Christopher A. Mattson, and Scott M. Ferguson. 2016. \"Evaluation of System Evolvability Based on Usable Excess.\" Journal of Mechanical Design 138 (9): 091101. https://doi.org/10.1115/1.4033989.","chicago_bibliography":"Allen, Jeffrey D., Christopher A. Mattson, and Scott M. Ferguson. \"Evaluation of System Evolvability Based on Usable Excess.\" Journal of Mechanical Design 138, no. 9 (2016): 091101. https://doi.org/10.1115/1.4033989.","chicago_footnote":"Jeffrey D. Allen, Christopher A. Mattson, and Scott M. Ferguson, \"Evaluation of System Evolvability Based on Usable Excess,\" Journal of Mechanical Design 138, no. 9 (2016): 091101, https://doi.org/10.1115/1.4033989.","ieee":"J. D. Allen, C. A. Mattson, and S. M. Ferguson, \"Evaluation of System Evolvability Based on Usable Excess,\" Journal of Mechanical Design, vol. 138, no. 9, Art. no. 091101, Sep. 2016, doi: 10.1115/1.4033989.","bibtex":"@article{allen2016evaluation,\n  author    = {Allen, Jeffrey D. and Mattson, Christopher A. and Ferguson, Scott M.},\n  title     = {Evaluation of System Evolvability Based on Usable Excess},\n  journal   = {Journal of Mechanical Design},\n  volume    = {138},\n  number    = {9},\n  pages     = {091101},\n  year      = {2016},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4033989}\n}"},{"id":"excess-identification-and-mapping-in-engineered-systems","slug":"/excess-identification-and-mapping-in-engineered-systems","title":"Excess Identification and Mapping in Engineered Systems","catalog_title":"Excess Identification and Mapping in Engineered Systems","abstract":"A system must continue to meet stakeholder needs throughout its service life to maintain value. Excess that is embedded into components during the design phase can enable in-service system evolution when new or changed requirements are introduced. However, while the concept of excess has been established in the literature, it is not clear how to identify and quantify the set of excesses in a particular design. This paper uses component properties and functional flow information to map and quantify the excess that exists within a system. Understanding the functional flow relationships between components allows for the bottlenecks at component interfaces to be identified. Those flows that do not limit the potential evolvability of a system can be removed from consideration, allowing for critical interface parameters to be highlighted and their capabilities quantified. The method is demonstrated on a consumer heat gun, where quantifying the excess within components allows for a reduced map to be created with irrelevant flows removed. Finally, changes to the system are explored to demonstrate how knowledge of component excess can be used to initially validate a proposed evolution.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4033884","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Excess Identification and Mapping in Engineered Systems","journal":"Journal of Mechanical Design","year":2016,"volume":"138","issue":"8","page":"081103","doi":"10.1115/1.4033884","authors_resolved":[{"family":"Cansler","given":"Ethan Z."},{"family":"White","given":"Samantha B."},{"family":"Ferguson","given":"Scott M."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Cansler, E. Z., White, S. B., Ferguson, S. M., & Mattson, C. A. (2016). Excess Identification and Mapping in Engineered Systems. Journal of Mechanical Design, 138(8), Article 081103. https://doi.org/10.1115/1.4033884","mla":"Cansler, Ethan Z., et al. \"Excess Identification and Mapping in Engineered Systems.\" Journal of Mechanical Design, vol. 138, no. 8, 2016, p. 081103, https://doi.org/10.1115/1.4033884.","chicago_author_date":"Cansler, Ethan Z., Samantha B. White, Scott M. Ferguson, and Christopher A. Mattson. 2016. \"Excess Identification and Mapping in Engineered Systems.\" Journal of Mechanical Design 138 (8): 081103. https://doi.org/10.1115/1.4033884.","chicago_bibliography":"Cansler, Ethan Z., Samantha B. White, Scott M. Ferguson, and Christopher A. Mattson. \"Excess Identification and Mapping in Engineered Systems.\" Journal of Mechanical Design 138, no. 8 (2016): 081103. https://doi.org/10.1115/1.4033884.","chicago_footnote":"Ethan Z. Cansler, Samantha B. White, Scott M. Ferguson, and Christopher A. Mattson, \"Excess Identification and Mapping in Engineered Systems,\" Journal of Mechanical Design 138, no. 8 (2016): 081103, https://doi.org/10.1115/1.4033884.","ieee":"E. Z. Cansler, S. B. White, S. M. Ferguson, and C. A. Mattson, \"Excess Identification and Mapping in Engineered Systems,\" Journal of Mechanical Design, vol. 138, no. 8, Art. no. 081103, Aug. 2016, doi: 10.1115/1.4033884.","bibtex":"@article{cansler2016excess,\n  author    = {Cansler, Ethan Z. and White, Samantha B. and Ferguson, Scott M. and Mattson, Christopher A.},\n  title     = {Excess Identification and Mapping in Engineered Systems},\n  journal   = {Journal of Mechanical Design},\n  volume    = {138},\n  number    = {8},\n  pages     = {081103},\n  year      = {2016},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4033884}\n}"},{"id":"methods-for-determining-the-optimal-number-of-simultaneous-contributors-for-mult","slug":"/methods-for-determining-the-optimal-number-of-simultaneous-contributors-for-mult","title":"Methods for Determining the Optimal Number of Simultaneous Contributors for Multi-user CAD Parts","catalog_title":"Methods for Determining the Optimal Number of Simultaneous Contributors for Multi-user CAD Parts","abstract":"Determines the optimal number of simultaneous contributors for multi-user CAD parts.","abstract_source":"catalog","publisher_url":"https://doi.org/10.14733/cadconfp.2016.189-193","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Methods for Determining the Optimal Number of Simultaneous Contributors for Multi-user CAD Parts","journal":"Proceedings of CAD'16","year":2016,"volume":"","issue":"","page":"189","doi":"10.14733/cadconfp.2016.189-193","authors_resolved":[{"family":"Stone","given":"Brett"},{"family":"Salmon","given":"John"},{"family":"Hepworth","given":"Ammon"},{"family":"Red","given":"Edward"},{"family":"Killian","given":"Matthew"}],"notes":[],"apa":"Stone, B., Salmon, J., Hepworth, A., Red, E., & Killian, M. (2016). Methods for Determining the Optimal Number of Simultaneous Contributors for Multi-user CAD Parts. Proceedings of CAD'16, 189. https://doi.org/10.1473 ty","catalog_title":"Optimization of excess system capability for increased evolvability","abstract":"Optimizes excess system capability to increase evolvability under changing future requirements.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1007/s00158-015-1378-x","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Optimization of excess system capability for increased evolvability","journal":"Structural and Multidisciplinary Optimization","year":2016,"volume":"53","issue":"6","page":"1277","doi":"10.1007/s00158-015-1378-x","authors_resolved":[{"family":"Watson","given":"J. D."},{"family":"Allen","given":"J. D."},{"family":"Mattson","given":"C. A."},{"family":"Ferguson","given":"S. M."}],"notes":[],"apa":"Watson, J. D., Allen, J. D., Mattson, C. A., & Ferguson, S. M. (2016). Optimization of excess system capability for increased evolvability. Structural and Multidisciplinary Optimization, 53(6), 1277. https://doi.org/10.1007/s00158-015-1378-x","mla":"Watson, J. D., et al. \"Optimization of excess system capability for increased evolvability.\" Structural and Multidisciplinary Optimization, vol. 53, no. 6, 2016, p. 1277, https://doi.org/10.1007/s00158-015-1378-x.","chicago_author_date":"Watson, J. D., J. D. Allen, Christopher A. Mattson, and S. M. Ferguson. 2016. \"Optimization of excess system capability for increased evolvability.\" Structural and Multidisciplinary Optimization 53 (6): 1277. https://doi.org/10.1007/s00158-015-1378-x.","chicago_bibliography":"Watson, J. D., J. D. Allen, Christopher A. Mattson, and S. M. Ferguson. \"Optimization of excess system capability for increased evolvability.\" Structural and Multidisciplinary Optimization 53, no. 6 (2016): 1277. https://doi.org/10.1007/s00158-015-1378-x.","chicago_footnote":"J. D. Watson, J. D. Allen, Christopher A. Mattson, and S. M. Ferguson, \"Optimization of excess system capability for increased evolvability,\" Structural and Multidisciplinary Optimization 53, no. 6 (2016): 1277, https://doi.org/10.1007/s00158-015-1378-x.","ieee":"J. D. Watson, J. D. Allen, C. A. Mattson, and S. M. Ferguson, \"Optimization of excess system capability for increased evolvability,\" Structural and Multidisciplinary Optimization, vol. 53, no. 6, pp. 1277, Jun. 2016, doi: 10.1007/s00158-015-1378-x.","bibtex":"@article{watson2016optimization,\n  author    = {Watson, J. D. and Allen, J. D. and Mattson, Christopher A. and Ferguson, S. M.},\n  title     = {Optimization of excess system capability for increased evolvability},\n  journal   = {Structural and Multidisciplinary Optimization},\n  volume    = {53},\n  number    = {6},\n  pages     = {1277},\n  year      = {2016},\n  publisher = {Springer Science and Business Media LLC},\n  doi       = {10.1007/s00158-015-1378-x}\n}"},{"id":"hybrid-bishop-hill-model-combined-finite-element-analysis-for-elastic-yield-limi","slug":"/hybrid-bishop-hill-model-combined-finite-element-analysis-for-elastic-yield-limi","title":"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design","catalog_title":"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design","abstract":"Purpose – Microstructure-sensitive design (MSD), for optimal performance of engineering components that are sensitive to material anisotropy, has largely been confined to the realm of theory. The purpose of this paper is to insert the MSD framework into a finite element environment in order to arrive at a practical tool for improved selection and design of materials for critical engineering situations. Design/methodology/approach – This study applies the recently developed Hybrid Bishop-Hill (HBH) model to map the yield surface of anisotropic oxygen free electronic copper. Combining this information with the detailed local stresses determined via finite element analysis (FEA), a “configurational yield stress” is determined for the entire component. By varying the material choice/processing conditions and selecting the directionality of anisotropy, an optimal configuration is found. Findings – The paper provides a new FEA-based framework for MSD for yield-limited situations. The approach identified optimal directionality and processing configurations for three engineering situations that are particularly sensitive to material anisotropy. Research limitations/implications – The microstructure design space for this study is limited to a selection of eight copper materials produced by a range of processing methods, but is generalizable to many materials that exhibit anisotropic behavior. Originality/value – The introduction of MSD methodology into a finite element environment is a first step toward a comprehensive designer toolkit for exploiting the anisotropy of general materials (such as metals) in a way that is routinely undertaken in the world of fiber-based composite materials. While the gains are not as sizeable (due to the less-extreme anisotropy), in many applications they may be extremely important.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1108/ec-06-2014-0130","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design","journal":"Engineering Computations","year":2015,"volume":"32","issue":"6","page":"1814","doi":"10.1108/ec-06-2014-0130","authors_resolved":[{"family":"Takahashi","given":"Ribeka"},{"family":"Fullwood","given":"David T."},{"family":"Rampton","given":"Travis M."},{"family":"Skousen","given":"Darrell J."},{"family":"Adams","given":"Brent L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Takahashi, R., Fullwood, D. T., Rampton, T. M., Skousen, D. J., Adams, B. L., & Mattson, C. A. (2015). Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design. Engineering Computations, 32(6), 1814. https://doi.org/10.1108/ec-06-2014-0130","mla":"Takahashi, Ribeka, et al. \"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design.\" Engineering Computations, vol. 32, no. 6, 2015, p. 1814, https://doi.org/10.1108/ec-06-2014-0130.","chicago_author_date":"Takahashi, Ribeka, David T. Fullwood, Travis M. Rampton, Darrell J. Skousen, Brent L. Adams, and Christopher A. Mattson. 2015. \"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design.\" Engineering Computations 32 (6): 1814. https://doi.org/10.1108/ec-06-2014-0130.","chicago_bibliography":"Takahashi, Ribeka, David T. Fullwood, Travis M. Rampton, Darrell J. Skousen, Brent L. Adams, and Christopher A. Mattson. \"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design.\" Engineering Computations 32, no. 6 (2015): 1814. https://doi.org/10.1108/ec-06-2014-0130.","chicago_footnote":"Ribeka Takahashi, David T. Fullwood, Travis M. Rampton, Darrell J. Skousen, Brent L. Adams, and Christopher A. Mattson, \"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design,\" Engineering Computations 32, no. 6 (2015): 1814, https://doi.org/10.1108/ec-06-2014-0130.","ieee":"R. Takahashi, D. T. Fullwood, T. M. Rampton, D. J. Skousen, B. L. Adams, and C. A. Mattson, \"Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design,\" Engineering Computations, vol. 32, no. 6, pp. 1814, Aug. 2015, doi: 10.1108/ec-06-2014-0130.","bibtex":"@article{takahashi2015hybrid,\n  author    = {Takahashi, Ribeka and Fullwood, David T. and Rampton, Travis M. and Skousen, Darrell J. and Adams, Brent L. and Mattson, Christopher A.},\n  title     = {Hybrid Bishop-Hill model combined finite element analysis for elastic-yield limited design},\n  journal   = {Engineering Computations},\n  volume    = {32},\n  number    = {6},\n  pages     = {1814},\n  year      = {2015},\n  publisher = {Emerald},\n  doi       = {10.1108/ec-06-2014-0130}\n}"},{"id":"modular-product-optimisation-to-alleviate-poverty-an-irrigation-pump-case-study","slug":"/modular-product-optimisation-to-alleviate-poverty-an-irrigation-pump-case-study","title":"Modular product optimisation to alleviate poverty: an irrigation pump case study","catalog_title":"Modular product optimisation to alleviate poverty: an irrigation pump case study","abstract":"Optimizes a modular irrigation pump design to improve affordability and usefulness for poverty alleviation.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1504/ijpd.2015.067277","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Modular product optimisation to alleviate poverty: an irrigation pump case study","journal":"International Journal of Product Development","year":2015,"volume":"20","issue":"1","page":"49","doi":"10.1504/ijpd.2015.067277","authors_resolved":[{"family":"Lewis","given":"Patrick K."},{"family":"Mattson","given":"Christopher A."},{"family":"Wood","given":"Charles D."}],"notes":[],"apa":"Lewis, P. K., Mattson, C. A., & Wood, C. D. (2015). Modular product optimisation to alleviate poverty: an irrigation pump case study. International Journal of Product Development, 20(1), 49. https://doi.org/10.1504/ijpd.2015.067277","mla":"Lewis, Patrick K., et al. \"Modular product optimisation to alleviate poverty: an irrigation pump case study.\" International Journal of Product Development, vol. 20, no. 1, 2015, p. 49, https://doi.org/10.1504/ijpd.2015.067277.","chicago_author_date":"Lewis, Patrick K., Christopher A. Mattson, and Charles D. Wood. 2015. \"Modular product optimisation to alleviate poverty: an irrigation pump case study.\" International Journal of Product Development 20 (1): 49. https://doi.org/10.1504/ijpd.2015.067277.","chicago_bibliography":"Lewis, Patrick K., Christopher A. Mattson, and Charles D. Wood. \"Modular product optimisation to alleviate poverty: an irrigation pump case study.\" International Journal of Product Development 20, no. 1 (2015): 49. https://doi.org/10.1504/ijpd.2015.067277.","chicago_footnote":"Patrick K. Lewis, Christopher A. Mattson, and Charles D. Wood, \"Modular product optimisation to alleviate poverty: an irrigation pump case study,\" International Journal of Product Development 20, no. 1 (2015): 49, https://doi.org/10.1504/ijpd.2015.067277.","ieee":"P. K. Lewis, C. A. Mattson, and C. D. Wood, \"Modular product optimisation to alleviate poverty: an irrigation pump case study,\" International Journal of Product Development, vol. 20, no. 1, pp. 49, 2015, doi: 10.1504/ijpd.2015.067277.","bibtex":"@article{lewis2015modular,\n  author    = {Lewis, Patrick K. and Mattson, Christopher A. and Wood, Charles D.},\n  title     = {Modular product optimisation to alleviate poverty: an irrigation pump case study},\n  journal   = {International Journal of Product Development},\n  volume    = {20},\n  number    = {1},\n  pages     = {49},\n  year      = {2015},\n  publisher = {Inderscience Publishers},\n  doi       = {10.1504/ijpd.2015.067277}\n}"},{"id":"a-model-for-quantifying-system-evolvability-based-on-excess-and-capacity","slug":"/a-model-for-quantifying-system-evolvability-based-on-excess-and-capacity","title":"A Model for Quantifying System Evolvability Based on Excess and Capacity","catalog_title":"A Model for Quantifying System Evolvability Based on Excess and Capacity","abstract":"An important factor in system longevity is service-phase evolvability, which is defined as the ability of a system to physically transform from one configuration to a more desirable configuration while in service. These transformations may or may not be known during the design process, and may or may not be reversible. In a different study, we examined 210 engineered systems and found that system excess and modularity allow a system to evolve while in service. Building on this observation, the present paper introduces mathematical relationships that map a system's excess to that system's ability to evolve. As introduced in this paper, this relationship is derived from elastic potential-energy theories. The use of the evolvability measure, and other related measures presented herein, are illustrated with simple examples and applied to the design of U.S. Navy nuclear aircraft carriers. Using these relationships, we show that the Navy's new Ford-class aircraft carrier is measurably more evolvable than the Nimitz-class carriers. While the ability for systems to evolve is based on excess and modularity, this paper is focused only on excess. The mapping between modularity and evolvability is the focus of another work by the authors.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4026648","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"A Model for Quantifying System Evolvability Based on Excess and Capacity","journal":"Journal of Mechanical Design","year":2014,"volume":"136","issue":"5","page":"051002","doi":"10.1115/1.4026648","authors_resolved":[{"family":"Tackett","given":"Morgan W. P."},{"family":"Mattson","given":"Christopher A."},{"family":"Ferguson","given":"Scott M."}],"notes":[],"apa":"Tackett, M. W. P., Mattson, C. A., & Ferguson, S. M. (2014). A Model for Quantifying System Evolvability Based on Excess and Capacity. Journal of Mechanical Design, 136(5), Article 051002. https://doi.org/10.1115/1.4026648","mla":"Tackett, Morgan W. P., et al. \"A Model for Quantifying System Evolvability Based on Excess and Capacity.\" Journal of Mechanical Design, vol. 136, no. 5, 2014, p. 051002, https://doi.org/10.1115/1.4026648.","chicago_author_date":"Tackett, Morgan W. P., Christopher A. Mattson, and Scott M. Ferguson. 2014. \"A Model for Quantifying System Evolvability Based on Excess and Capacity.\" Journal of Mechanical Design 136 (5): 051002. https://doi.org/10.1115/1.4026648.","chicago_bibliography":"Tackett, Morgan W. P., Christopher A. Mat ution-of-paret","title":"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers","catalog_title":"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers","abstract":"Introduces L-dominance for adaptive resolution of Pareto frontiers in multiobjective design.","abstract_source":"catalog","publisher_url":"https://doi.org/10.2514/6.2014-2179","badge":"conference","categories":["Other"],"hidden":false,"resolved_title":"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers","journal":"15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference","year":2014,"volume":"","issue":"","page":"","doi":"10.2514/6.2014-2179","authors_resolved":[{"family":"Hancock","given":"Braden J."},{"family":"Nysetvold","given":"Timothy"},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Hancock, B. J., Nysetvold, T., & Mattson, C. A. (2014). L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers. 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference. https://doi.org/10.2514/6.2014-2179","mla":"Hancock, Braden J., et al. \"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers.\" 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference, 2014, https://doi.org/10.2514/6.2014-2179.","chicago_author_date":"Hancock, Braden J., Timothy Nysetvold, and Christopher A. Mattson. 2014. \"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers.\" 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference. https://doi.org/10.2514/6.2014-2179.","chicago_bibliography":"Hancock, Braden J., Timothy Nysetvold, and Christopher A. Mattson. \"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers.\" 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference (2014). https://doi.org/10.2514/6.2014-2179.","chicago_footnote":"Braden J. Hancock, Timothy Nysetvold, and Christopher A. Mattson, \"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers,\" 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference (2014), https://doi.org/10.2514/6.2014-2179.","ieee":"B. J. Hancock, T. Nysetvold, and C. A. Mattson, \"L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers,\" 15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference, Jun. 2014, doi: 10.2514/6.2014-2179.","bibtex":"@article{hancock2014l,\n  author    = {Hancock, Braden J. and Nysetvold, Timothy and Mattson, Christopher A.},\n  title     = {L-Dominance: An Approximate-Domination Mechanism for Adaptive Resolution of Pareto Frontiers},\n  journal   = {15th AIAA/ISSMO Multidisciplinary Analysis and Optimization Conference},\n  year      = {2014},\n  publisher = {American Institute of Aeronautics and Astronautics},\n  doi       = {10.2514/6.2014-2179}\n}"},{"id":"nine-principles-for-design-for-the-developing-world-as-derived-from-the-engineer","slug":"/nine-principles-for-design-for-the-developing-world-as-derived-from-the-engineer","title":"Nine Principles for Design for the Developing World as Derived From the Engineering Literature","catalog_title":"Nine Principles for Design for the Developing World as Derived From the Engineering Literature","abstract":"This paper reviews the findings of several engineering researchers and practitioners on the topic of design for the developing world. We arrange these findings into nine guiding principles aimed at helping those who are searching for effective approaches for design for the developing world. The findings reviewed come from the mechanical engineering discipline, as well as from other engineering and nonengineering disciplines. For each principle, we provide references to various studies as a means of supporting the principle. We also provide a detailed example of each principle. Based on our own experience and based on the many papers reviewed, we provide a succinct list of suggestions for using each principle. Finally, we relate these nine principles to traditional design principles. Ultimately, we believe that the principles introduced here help overcome the challenges of design for the developing world, which are often dominated by designer unfamiliarity with poverty and foreign culture and the constraint of extreme affordability.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4027984","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Nine Principles for Design for the Developing World as Derived From the Engineering Literature","journal":"Journal of Mechanical Design","year":2014,"volume":"136","issue":"12","page":"121403","doi":"10.1115/1.4027984","authors_resolved":[{"family":"Mattson","given":"Christopher A."},{"family":"Wood","given":"Amy E."}],"notes":[],"apa":"Mattson, C. A. & Wood, A. E. (2014). Nine Principles for Design for the Developing World as Derived From the Engineering Literature. Journal of Mechanical Design, 136(12), Article 121403. https://doi.org/10.1115/1.4027984","mla":"Mattson, Christopher A., and Amy E. Wood. \"Nine Principles for Design for the Developing World as Derived From the Engineering Literature.\" Journal of Mechanical Design, vol. 136, no. 12, 2014, p. 121403, https://doi.org/10.1115/1.4027984.","chicago_author_date":"Mattson, Christopher A. and Amy E. Wood. 2014. \"Nine Principles for Design for the Developing World as Derived From the Engineering Literature.\" Journal of Mechanical Design 136 (12): 121403. https://doi.org/10.1115/1.4027984.","chicago_bibliography":"Mattson, Christopher A. and Amy E. Wood. \"Nine Principles for Design for the Developing World as Derived From the Engineering Literature.\" Journal of Mechanical Design 136, no. 12 (2014): 121403. https://doi.org/10.1115/1.4027984.","chicago_footnote":"Christopher A. Mattson and Amy E. Wood, \"Nine Principles for Design for the Developing World as Derived From the Engineering Literature,\" Journal of Mechanical Design 136, no. 12 (2014): 121403, https://doi.org/10.1115/1.4027984.","ieee":"C. A. Mattson and A. E. Wood, \"Nine Principles for Design for the Developing World as Derived From the Engineering Literature,\" Journal of Mechanical Design, vol. 136, no. 12, Art. no. 121403, Dec. 2014, doi: 10.1115/1.4027984.","bibtex":"@article{mattson2014nine,\n  author    = {Mattson, Christopher A. and Wood, Amy E.},\n  title     = {Nine Principles for Design for the Developing World as Derived From the Engineering Literature},\n  journal   = {Journal of Mechanical Design},\n  volume    = {136},\n  number    = {12},\n  pages     = {121403},\n  year      = {2014},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4027984}\n}"},{"id":"using-topology-optimization-to-numerically-improve-barriers-to-reverse-engineeri","slug":"/using-topology-optimization-to-numerically-improve-barriers-to-reverse-engineeri","title":"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering","catalog_title":"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering","abstract":"Here explored is a method by which designers can use the tool of topology optimization to numerically improve barriers to reverse engineering. Recently developed metrics, which characterize the time (T) to reverse engineer a product, enable this optimization. A key parameter used in the calculation of T is information content (K). The method presented in this paper pursues traditional topology optimization objectives while simultaneously maximizing K, and thus T, in the resulting topology. New aspects of this paper include algorithms to (1) evaluate K for any topology, (2) increase K for a topology by manipulating macroscale geometry and microscale crystallographic information for each element, and (3) simultaneously maximize K and minimize structural compliance (a traditional topology optimization objective). These algorithms lead designers to desirable topologies with increased barriers to reverse engineering. The authors conclude that barriers to reverse engineering can indeed be increased without sacrificing the desirable structural characteristic of compliance. This has been shown through the example of a novel electrical contact for a consumer electronics product.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4025962","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering","journal":"Journal of Mechanical Design","year":2014,"volume":"136","issue":"2","page":"021007","doi":"10.1115/1.4025962","authors_resolved":[{"family":"LeBaron","given":"Devin D."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"LeBaron, D. D. & Mattson, C. A. (2014). Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering. Journal of Mechanical Design, 136(2), Article 021007. https://doi.org/10.1115/1.4025962","mla":"LeBaron, Devin D., and Christopher A. Mattson. \"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering.\" Journal of Mechanical Design, vol. 136, no. 2, 2014, p. 021007, https://doi.org/10.1115/1.4025962.","chicago_author_date":"LeBaron, Devin D. and Christopher A. Mattson. 2014. \"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering.\" Journal of Mechanical Design 136 (2): 021007. https://doi.org/10.1115/1.4025962.","chicago_bibliography":"LeBaron, Devin D. and Christopher A. Mattson. \"Using Topology Optimization to Numerically Improve Barriers to Reverse Engineering.\" Journal of Mechanical Design 136, no. 2 (2014): 021007. https://doi.org/10.1115/1.4025962.","chicago_footnote":"Devin D. LeBaron and Christopher A. Mattson g-the-effects-of-learning-when-reverse-engineering-multiple-samples","slug":"/characterizing-the-effects-of-learning-when-reverse-engineering-multiple-samples","title":"Characterizing the Effects of Learning When Reverse Engineering Multiple Samples of the Same Product","catalog_title":"Characterizing the Effects of Learning When Reverse Engineering Multiple Samples of the Same Product","abstract":"Reverse engineering is the process of extracting information about a product from the product itself. An estimate of the barrier and time to extract information from any product is useful for the original designer and those reverse engineering, as both are affected by reverse engineering activities. The authors have previously presented a set of metrics and parameters to estimate the barrier and time to reverse engineer a product once. This work has laid the foundation for the developments of the current paper, which address the issue of characterizing the reverse engineering time and barrier when multiple samples of the same product are reverse engineered. Frequently in practice, several samples of the same product are reverse engineered to increase accuracy, extract tolerances, or to gather additional information from the product. In this paper, we introduce metrics that (i) characterize learning in the reverse engineering process as additional product samples are evaluated and (ii) estimate the total time to reverse engineer multiple samples of the same product. Additionally, an example of reverse engineering parts from a control valve is introduced to illustrate how to use the newly developed metrics and to serve as empirical validation.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4007918","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"Characterizing the Effects of Learning When Reverse Engineering Multiple Samples of the Same Product","journal":"Journal of Mechanical Design","year":2013,"volume":"135","issue":"1 ially Driven Flapping Wing Mechanism for Force Analysis and Trajectory Optimization","abstract":"Flapping flight has the potential to revolutionize micro air vehicles (MAVs) due to increased aerodynamic performance, improved maneuverability, and hover capabilities. This paper presents the design of a robotic flapping wing mechanism for use in general studies involving flapping flight and laboratory-based experimental optimization of flapping trajectories. The design allows for dynamic adjustment of flapping trajectories in air or liquids with three rotational degrees of freedom on each wing. The design, instrumentation, and control of the mechanism are discussed, and experimental characterization of the mechanism's performance is presented. Preliminary trajectory optimization using a Box-Behnken design approach is used and shows successful parameter optimization. The limitations of the current mechanism are addressed. A survey of flapping mechanisms is presented.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1260/1756-8293.4.1.31","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"A Differentially Driven Flapping Wing Mechanism for Force Analysis and Trajectory Optimization","journal":"International Journal of Micro Air Vehicles","year":2012,"volume":"4","issue":"1","page":"31","doi":"10.1260/1756-8293.4.1.31","authors_resolved":[{"family":"George","given":"Ryan B."},{"family":"Colton","given":"Mark B."},{"family":"Mattson","given":"Christopher A."},{"family":"Thomson","given":"Scott L."}],"notes":[],"apa":"George, R. B., Colton, M. B., Mattson, C. A., & Thomson, S. L. (2012). A Differentially Driven Flapping Wing Mechanism for Force Analysis and Trajectory Optimization. International Journal of Micro Air Vehicles, 4(1), 31. https://doi.org/10.1260/1756-8293.4.1.31","mla":"George, Ryan B., et al. \"A Differentially Driven Flapping Wing Mechanism for Force Analysis and Trajectory Optimization.\" International Journal of Micr
