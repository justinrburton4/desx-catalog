early-stage product development.\" International Journal of Product Development, vol. 28, no. 1/2, 2024, p. 104, https://doi.org/10.1504/ijpd.2024.137784.","chicago_author_date":"Owens, Trent, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. 2024. \"A formal consideration of user tactics during product evaluation in early-stage product development.\" International Journal of Product Development 28 (1/2): 104. https://doi.org/10.1504/ijpd.2024.137784.","chicago_bibliography":"Owens, Trent, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. \"A formal consideration of user tactics during product evaluation in early-stage product development.\" International Journal of Product Development 28, no. 1/2 (2024): 104. https://doi.org/10.1504/ijpd.2024.137784.","chicago_footnote":"Trent Owens, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson, \"A formal consideration of user tactics during product evaluation in early-stage product development,\" International Journal of Product Development 28, no. 1/2 (2024): 104, https://doi.org/10.1504/ijpd.2024.137784.","ieee":"T. Owens, C. A. Mattson, C. D. Sorensen, and M. L. Anderson, \"A formal consideration of user tactics during product evaluation in early-stage product development,\" International Journal of Product Development, vol. 28, no. 1/2, pp. 104, 2024, doi: 10.1504/ijpd.2024.137784.","bibtex":"@article{owens2024formal,\n  author    = {Owens, Trent and Mattson, Christopher A. and Sorensen, Carl D. and Anderson, Michael L.},\n  title     = {A formal consideration of user tactics during product evaluation in early-stage product development},\n  journal   = {International Journal of Product Development},\n  volume    = {28},\n  number    = {1/2},\n  pages     = {104},\n  year      = {2024},\n  publisher = {Inderscience Publishers},\n  doi       = {10.1504/ijpd.2024.137784}\n}"},{"id":"an-approach-for-predicting-social-environmental-and-economic-product-impacts-and","slug":"/predicting-social-environmental-and-economic-product-impacts","title":"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design","catalog_title":"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design","abstract":"Abstract There is a growing demand for sustainable products and systems. Sustainability encompasses environmental, social, and economic aspects, often referred to as the three pillars of sustainability. To make more sustainable design decisions, engineers need tools to predict the environmental, social, and economic impacts of products and characterize potential sustainability tradeoffs. To predict the total impact of a product, the quantity of functional units of the product in society and the impact of each product needs to be estimated. This article uses agent-based modeling (ABM), combined with tools such as life cycle assessment (LCA), to predict impacts across all three pillars of sustainability. By using the product impact results, the multidimensional sustainability tradespace can be characterized. The approach described in this article is based on three main components for the predictive modeling of product impacts and the characterization of the sustainability trade space: (i) ABM of product adoption, (ii) the assessment of product impacts, and (iii) an approach for the characterization of product sustainability tradeoffs at the population level. The tradespace characterization uses a Pareto-based method presented visually to find the nondominated solutions in the product impact space. To illustrate and describe how to use the method, a case study is presented that predicts the impact of residential solar panels in a region of the United States under various scenarios. The findings of the case study can help policy makers understand suitable implementation strategies for residential solar panels while considering the impact tradeoffs involved.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4064041","badge":"journal","categories":["Other"],"hidden":false,"resolved_title":"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design","journal":"Journal of Mechanical Design","year":2024,"volume":"146","issue":"2","page":"020904","doi":"10.1115/1.4064041","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Dickerson","given":"Tevin J."},{"family":"Salmon","given":"John L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Mabey, C. S., Dickerson, T. J., Salmon, J. L., & Mattson, C. A. (2024). An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design. Journal of Mechanical Design, 146(2), Article 020904. https://doi.org/10.1115/1.4064041","mla":"Mabey, Christopher S., et al. \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design.\" Journal of Mechanical Design, vol. 146, no. 2, 2024, p. 020904, https://doi.org/10.1115/1.4064041.","chicago_author_date":"Mabey, Christopher S., Tevin J. Dickerson, John L. Salmon, and Christopher A. Mattson. 2024. \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design.\" Journal of Mechanical Design 146 (2): 020904. https://doi.org/10.1115/1.4064041.","chicago_bibliography":"Mabey, Christopher S., Tevin J. Dickerson, John L. Salmon, and Christopher A. Mattson. \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design.\" Journal of Mechanical Design 146, no. 2 (2024): 020904. https://doi.org/10.1115/1.4064041.","chicago_footnote":"Christopher S. Mabey, Tevin J. Dickerson, John L. Salmon, and Christopher A. Mattson, \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design,\" Journal of Mechanical Design 146, no. 2 (2024): 020904, https://doi.org/10.1115/1.4064041.","ieee":"C. S. Mabey, T. J. Dickerson, J. L. Salmon, and C. A. Mattson, \"An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design,\" Journal of Mechanical Design, vol. 146, no. 2, Art. no. 020904, Feb. 2024, doi: 10.1115/1.4064041.","bibtex":"@article{mabey2024approach,\n  author    = {Mabey, Christopher S. and Dickerson, Tevin J. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {An Approach for Predicting Social, Environmental, and Economic Product Impacts and Characterizing the Associated Sustainability Tradespace in Engineering Design},\n  journal   = {Journal of Mechanical Design},\n  volume    = {146},\n  number    = {2},\n  pages     = {020904},\n  year      = {2024},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4064041}\n}"},{"id":"optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders","slug":"/optimizing-engineered-products-for-their-social-impacts-on-multiple-stakeholders","title":"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders","catalog_title":"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders","abstract":"Abstract Engineered products are often optimized based on engineering requirements, user requirements, cost, and performance. This strategy is well suited for most applications, but products designed specifically to improve the lives of users and communities would benefit from an approach that helps engineers optimize a product based also on its social impacts. This paper introduces several optimization problem formulations adapted from multi-stakeholder strategies in the economics and business management literature. Each optimization problem formulation optimizes a product’s social impact according to the ideology and principles inherent to the adapted multi-stakeholder strategy. A case study is presented for a cassava peeling machine that is being developed for farmers in the Brazilian Amazon. Finally, the resulting peeler design configurations and social impacts are discussed to illustrate the advantages and disadvantages of each strategy.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4064694","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders","journal":"Journal of Mechanical Design","year":2024,"volume":"146","issue":"9","page":"091702","doi":"10.1115/1.4064694","authors_resolved":[{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."},{"family":"Hatch","given":"Nile W."}],"notes":[],"apa":"Stevenson, P. D., Mattson, C. A., Salmon, J. L., & Hatch, N. W. (2024). Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders. Journal of Mechanical Design, 146(9), Article 091702. https://doi.org/10.1115/1.4064694","mla":"Stevenson, Phillip D., et al. \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders.\" Journal of Mechanical Design, vol. 146, no. 9, 2024, p. 091702, https://doi.org/10.1115/1.4064694.","chicago_author_date":"Stevenson, Phillip D., Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. 2024. \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders.\" Journal of Mechanical Design 146 (9): 091702. https://doi.org/10.1115/1.4064694.","chicago_bibliography":"Stevenson, Phillip D., Christopher A. Mattson, John L. Salmon, and Nile W. Hatch. \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders.\" Journal of Mechanical Design 146, no. 9 (2024): 091702. https://doi.org/10.1115/1.4064694.","chicago_footnote":"Phillip D. Stevenson, Christopher A. Mattson, John L. Salmon, and Nile W. Hatch, \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders,\" Journal of Mechanical Design 146, no. 9 (2024): 091702, https://doi.org/10.1115/1.4064694.","ieee":"P. D. Stevenson, C. A. Mattson, J. L. Salmon, and N. W. Hatch, \"Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders,\" Journal of Mechanical Design, vol. 146, no. 9, Art. no. 091702, Sep. 2024, doi: 10.1115/1.4064694.","bibtex":"@article{stevenson2024optimizing,\n  author    = {Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L. and Hatch, Nile W.},\n  title     = {Optimizing Engineered Products for Their Social Impacts on Multiple Stakeholders},\n  journal   = {Journal of Mechanical Design},\n  volume    = {146},\n  number    = {9},\n  pages     = {091702},\n  year      = {2024},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4064694}\n}"},{"id":"product-architecture-strategies-and-effects-matrices-for-early-evaluation-and-se","slug":"/product-architecture-strategies-and-effects-matrices","title":"Product architecture strategies and effects matrices for early evaluation and selection of product architectures","catalog_title":"Product architecture strategies and effects matrices for early evaluation and selection of product architectures","abstract":"Abstract Product architecture decisions are made early in the product development process and have far-reaching effects. Unless anticipated through experience or intuition, many of these effects may not be apparent until much later in the development process, making changes to the architecture costly in time, effort and resources. Many researchers through the years have studied various elements of product architecture and their effects. By using a repeatable process for aggregating statements on the effects of architecture strategies from a selection of the literature on the topic and storing them in a systematic database, this information can then be recalled and presented in the form of a Product Architecture Strategy and Effect (PASE) matrix. PASE matrices allow for the identification, comparison, evaluation, and then selection of the most desirable product architecture strategies before expending resources along a specific development path. This paper introduces the PASE Database and matrix and describes their construction and use in guiding design decisions. This paper also provides metrics for understanding the robustness of this database.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/dsj.2024.18","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Product architecture strategies and effects matrices for early evaluation and selection of product architectures","journal":"Design Science","year":2024,"volume":"10","issue":"","page":"e41","doi":"10.1017/dsj.2024.18","authors_resolved":[{"family":"Rice","given":"Scott E."},{"family":"Sannar","given":"Benjamin C."},{"family":"McKinnon","given":"Samuel A."},{"family":"Humphrey","given":"Tyson M."},{"family":"Mattson","given":"Christopher A."},{"family":"Sorensen","given":"Carl D."},{"family":"Anderson","given":"Michael L."}],"notes":[],"apa":"Rice, S. E., Sannar, B. C., McKinnon, S. A., Humphrey, T. M., Mattson, C. A., Sorensen, C. D., & Anderson, M. L. (2024). Product architecture strategies and effects matrices for early evaluation and selection of product architectures. Design Science, 10, e41. https://doi.org/10.1017/dsj.2024.18","mla":"Rice, Scott E., et al. \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures.\" Design Science, vol. 10, 2024, p. e41, https://doi.org/10.1017/dsj.2024.18.","chicago_author_date":"Rice, Scott E., Benjamin C. Sannar, Samuel A. McKinnon, Tyson M. Humphrey, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. 2024. \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures.\" Design Science 10: e41. https://doi.org/10.1017/dsj.2024.18.","chicago_bibliography":"Rice, Scott E., Benjamin C. Sannar, Samuel A. McKinnon, Tyson M. Humphrey, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson. \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures.\" Design Science 10 (2024): e41. https://doi.org/10.1017/dsj.2024.18.","chicago_footnote":"Scott E. Rice, Benjamin C. Sannar, Samuel A. McKinnon, Tyson M. Humphrey, Christopher A. Mattson, Carl D. Sorensen, and Michael L. Anderson, \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures,\" Design Science 10 (2024): e41, https://doi.org/10.1017/dsj.2024.18.","ieee":"S. E. Rice, B. C. Sannar, S. A. McKinnon, T. M. Humphrey, C. A. Mattson, C. D. Sorensen, and M. L. Anderson, \"Product architecture strategies and effects matrices for early evaluation and selection of product architectures,\" Design Science, vol. 10, pp. e41, Dec. 2024, doi: 10.1017/dsj.2024.18.","bibtex":"@article{rice2024product,\n  author    = {Rice, Scott E. and Sannar, Benjamin C. and McKinnon, Samuel A. and Humphrey, Tyson M. and Mattson, Christopher A. and Sorensen, Carl D. and Anderson, Michael L.},\n  title     = {Product architecture strategies and effects matrices for early evaluation and selection of product architectures},\n  journal   = {Design Science},\n  volume    = {10},\n  pages     = {e41},\n  year      = {2024},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2024.18}\n}"},{"id":"advancing-sustainable-development-emerging-factors-and-futures-for-the-engineeri","slug":"/advancing-sustainable-development-emerging-factors","title":"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field","catalog_title":"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field","abstract":"This study set out to identify emerging trends in advancing engineering for sustainable development, supporting the engineering workforce to address wicked problems, and strengthening pathways between engineering education, industry, and policy. The following question guided this work: What are the emerging factors impacting the future of global sustainability efforts within engineering, and how can these be amplified to increase the impact of engineering for sustainable development? Using an adapted Delphi method with surveys, focus groups, and member-checking interviews, we hosted the American Society of Mechanical Engineers (ASME) 2022 Engineering Global Development (EGD) Stakeholder Summit. The summit convened industry leaders, innovators, and academics to explore emerging factors impacting the future of global sustainability efforts in engineering. This manuscript synthesizes emerging trends and proposes recommendations for engineering, particularly in the specific focus area of engineering for sustainable development (e.g., ‘humanitarian engineering’, ‘global engineering’). Critical recommendations include the adoption of emerging cultural mindsets, which include: (1) take an interdisciplinary and multi-stakeholder approach, (2) consider dynamic and interconnected systems, (3) increase humility and intercultural competence, (4) prioritize diversity and inclusion, (5) increase localization and center community perspectives, (6) challenge the perception that engineering is neutral, and (7) broaden the goals of engineering. Ultimately, this study highlights pathways forward for the broader engineering community to more effectively contribute to advancing the United Nations Sustainable Development Goals.","abstract_source":"crossref","publisher_url":"https://doi.org/10.3390/su15107869","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field","journal":"Sustainability","year":2023,"volume":"15","issue":"10","page":"7869","doi":"10.3390/su15107869","authors_resolved":[{"family":"Burleson","given":"Grace"},{"family":"Lajoie","given":"Jason"},{"family":"Mabey","given":"Christopher"},{"family":"Sours","given":"Patrick"},{"family":"Ventrella","given":"Jennifer"},{"family":"Peiffer","given":"Erin"},{"family":"Stine","given":"Emma"},{"family":"Stettler Kleine","given":"Marie"},{"family":"MacDonald","given":"Laura"},{"family":"Austin-Breneman","given":"Jesse"},{"family":"Javernick-Will","given":"Amy"},{"family":"Winter","given":"Amos"},{"family":"Lucena","given":"Juan"},{"family":"Knight","given":"David"},{"family":"Daniel","given":"Scott"},{"family":"Thomas","given":"Evan"},{"family":"Mattson","given":"Christopher"},{"family":"Aranda","given":"Iana"}],"notes":[],"apa":"Burleson, G., Lajoie, J., Mabey, C., Sours, P., Ventrella, J., Peiffer, E., Stine, E., Stettler Kleine, M., MacDonald, L., Austin-Breneman, J., Javernick-Will, A., Winter, A., Lucena, J., Knight, D., Daniel, S., Thomas, E., Mattson, C., & Aranda, I. (2023). Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field. Sustainability, 15(10), 7869. https://doi.org/10.3390/su15107869","mla":"Burleson, Grace, et al. \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field.\" Sustainability, vol. 15, no. 10, 2023, p. 7869, https://doi.org/10.3390/su15107869.","chicago_author_date":"Burleson, Grace, Jason Lajoie, Christopher Mabey, Patrick Sours, Jennifer Ventrella, Erin Peiffer, Emma Stine, Marie Stettler Kleine, Laura MacDonald, Jesse Austin-Breneman, Amy Javernick-Will, Amos Winter, Juan Lucena, David Knight, Scott Daniel, Evan Thomas, Christopher Mattson, and Iana Aranda. 2023. \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field.\" Sustainability 15 (10): 7869. https://doi.org/10.3390/su15107869.","chicago_bibliography":"Burleson, Grace, Jason Lajoie, Christopher Mabey, Patrick Sours, Jennifer Ventrella, Erin Peiffer, Emma Stine, Marie Stettler Kleine, Laura MacDonald, Jesse Austin-Breneman, Amy Javernick-Will, Amos Winter, Juan Lucena, David Knight, Scott Daniel, Evan Thomas, Christopher Mattson, and Iana Aranda. \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field.\" Sustainability 15, no. 10 (2023): 7869. https://doi.org/10.3390/su15107869.","chicago_footnote":"Grace Burleson, Jason Lajoie, Christopher Mabey, Patrick Sours, Jennifer Ventrella, Erin Peiffer, Emma Stine, Marie Stettler Kleine, Laura MacDonald, Jesse Austin-Breneman, Amy Javernick-Will, Amos Winter, Juan Lucena, David Knight, Scott Daniel, Evan Thomas, Christopher Mattson, and Iana Aranda, \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field,\" Sustainability 15, no. 10 (2023): 7869, https://doi.org/10.3390/su15107869.","ieee":"G. Burleson, J. Lajoie, C. Mabey, P. Sours, J. Ventrella, E. Peiffer, E. Stine, M. Stettler Kleine, L. MacDonald, J. Austin-Breneman, A. Javernick-Will, A. Winter, J. Lucena, D. Knight, S. Daniel, E. Thomas, C. Mattson, and I. Aranda, \"Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field,\" Sustainability, vol. 15, no. 10, pp. 7869, May 2023, doi: 10.3390/su15107869.","bibtex":"@article{burleson2023advancing,\n  author    = {Burleson, Grace and Lajoie, Jason and Mabey, Christopher and Sours, Patrick and Ventrella, Jennifer and Peiffer, Erin and Stine, Emma and Stettler Kleine, Marie and MacDonald, Laura and Austin-Breneman, Jesse and Javernick-Will, Amy and Winter, Amos and Lucena, Juan and Knight, David and Daniel, Scott and Thomas, Evan and Mattson, Christopher and Aranda, Iana},\n  title     = {Advancing Sustainable Development: Emerging Factors and Futures for the Engineering Field},\n  journal   = {Sustainability},\n  volume    = {15},\n  number    = {10},\n  pages     = {7869},\n  year      = {2023},\n  publisher = {MDPI AG},\n  doi       = {10.3390/su15107869}\n}"},{"id":"agent-based-product-social-impact-modeling-a-systematic-literature-review-and-mo","slug":"/agent-based-product-social-impact-modeling","title":"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process","catalog_title":"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process","abstract":"Abstract A key part of an engineer’s purpose is to create products and services that benefit society, or, in other words, to create products with a positive social impact. While engineers have many predictive models to aid in making design decisions about the functional performance or safety of a product, very few models exist for estimating or planning for the wide range of social impacts an engineered product can have. To model social impact, a model must contain representations of both the product and society. Agent-based modeling is a tool that can model society and incorporate social impact factors. In this paper, we investigate factors that have historically limited the usefulness of product adoption agent-based models and predictive social impact models through a systematic literature review. Common themes of limiting factors are identified, steps are presented to improve the usefulness of agent-based product adoption models and predictive social impact models, and a general process for the creation of agent-based social impact models is presented. Improving the usefulness of these predictive models can aid engineers in making better design decisions. Predictive social impact models can help identify areas in the design space to improve the social impact of products. When coupled with existing design methods, agent-based predictive social impact models can help increase the probability that a product achieves positive social impact.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4063004","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process","journal":"Journal of Mechanical Design","year":2023,"volume":"145","issue":"11","page":"110801","doi":"10.1115/1.4063004","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Salmon","given":"John L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Mabey, C. S., Salmon, J. L., & Mattson, C. A. (2023). Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process. Journal of Mechanical Design, 145(11), Article 110801. https://doi.org/10.1115/1.4063004","mla":"Mabey, Christopher S., et al. \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process.\" Journal of Mechanical Design, vol. 145, no. 11, 2023, p. 110801, https://doi.org/10.1115/1.4063004.","chicago_author_date":"Mabey, Christopher S., John L. Salmon, and Christopher A. Mattson. 2023. \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process.\" Journal of Mechanical Design 145 (11): 110801. https://doi.org/10.1115/1.4063004.","chicago_bibliography":"Mabey, Christopher S., John L. Salmon, and Christopher A. Mattson. \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process.\" Journal of Mechanical Design 145, no. 11 (2023): 110801. https://doi.org/10.1115/1.4063004.","chicago_footnote":"Christopher S. Mabey, John L. Salmon, and Christopher A. Mattson, \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process,\" Journal of Mechanical Design 145, no. 11 (2023): 110801, https://doi.org/10.1115/1.4063004.","ieee":"C. S. Mabey, J. L. Salmon, and C. A. Mattson, \"Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process,\" Journal of Mechanical Design, vol. 145, no. 11, Art. no. 110801, Nov. 2023, doi: 10.1115/1.4063004.","bibtex":"@article{mabey2023agent,\n  author    = {Mabey, Christopher S. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {Agent-Based Product-Social-Impact-Modeling: A Systematic Literature Review and Modeling Process},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {11},\n  pages     = {110801},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4063004}\n}"},{"id":"an-approach-for-including-social-impact-measures-in-systems-design-exploration","slug":"/social-impact-measures-in-systems-design-exploration","title":"An approach for including social impact measures in systems design exploration","catalog_title":"An approach for including social impact measures in systems design exploration","abstract":"Abstract Engineered products have economic, environmental, and social impacts, which comprise the major dimensions of sustainability. This paper seeks to explore interactions between design parameters when social impacts are incorporated into the concept development phase of the systems design process. Social impact evaluation is increasing in importance similar to what has happened in recent years with environmental impact consideration in the design of engineered products. Concurrently, research into new airship design has increased. Airships have yet to be reintroduced at a large scale or for a range of applications in society. Although airships have the potential for positive environmental and economic impacts, the social impacts are still rarely considered. This paper presents a case study of the hypothetical introduction of airships in the Amazon region of Brazil to help local farmers transport their produce to market. It explores the design space in terms of both engineering parameters and social impacts using a discrete-event simulation to model the system. The social impacts are found to be dependent not only on the social factors and airship design parameters but also on the farmer-airship system, suggesting that socio-technical systems design will benefit from integrated social impact metric analysis.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/dsj.2023.13","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"An approach for including social impact measures in systems design exploration","journal":"Design Science","year":2023,"volume":"9","issue":"","page":"e16","doi":"10.1017/dsj.2023.13","authors_resolved":[{"family":"Richards","given":"Daniel C."},{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Richards, D. C., Stevenson, P. D., Mattson, C. A., & Salmon, J. L. (2023). An approach for including social impact measures in systems design exploration. Design Science, 9, e16. https://doi.org/10.1017/dsj.2023.13","mla":"Richards, Daniel C., et al. \"An approach for including social impact measures in systems design exploration.\" Design Science, vol. 9, 2023, p. e16, https://doi.org/10.1017/dsj.2023.13.","chicago_author_date":"Richards, Daniel C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. 2023. \"An approach for including social impact measures in systems design exploration.\" Design Science 9: e16. https://doi.org/10.1017/dsj.2023.13.","chicago_bibliography":"Richards, Daniel C., Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon. \"An approach for including social impact measures in systems design exploration.\" Design Science 9 (2023): e16. https://doi.org/10.1017/dsj.2023.13.","chicago_footnote":"Daniel C. Richards, Phillip D. Stevenson, Christopher A. Mattson, and John L. Salmon, \"An approach for including social impact measures in systems design exploration,\" Design Science 9 (2023): e16, https://doi.org/10.1017/dsj.2023.13.","ieee":"D. C. Richards, P. D. Stevenson, C. A. Mattson, and J. L. Salmon, \"An approach for including social impact measures in systems design exploration,\" Design Science, vol. 9, pp. e16, Jul. 2023, doi: 10.1017/dsj.2023.13.","bibtex":"@article{richards2023approach,\n  author    = {Richards, Daniel C. and Stevenson, Phillip D. and Mattson, Christopher A. and Salmon, John L.},\n  title     = {An approach for including social impact measures in systems design exploration},\n  journal   = {Design Science},\n  volume    = {9},\n  pages     = {e16},\n  year      = {2023},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsj.2023.13}\n}"},{"id":"creating-predictive-social-impact-models-of-engineered-products-using-synthetic","slug":"/predictive-social-impact-models-using-synthetic-population","title":"Creating predictive social impact models of engineered products using synthetic populations","catalog_title":"Creating predictive social impact models of engineered products using synthetic populations","abstract":"Creates predictive social impact models of engineered products using synthetic population data.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1007/s00163-023-00424-4","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Creating predictive social impact models of engineered products using synthetic populations","journal":"Research in Engineering Design","year":2023,"volume":"34","issue":"4","page":"461","doi":"10.1007/s00163-023-00424-4","authors_resolved":[{"family":"Stevenson","given":"Phillip D."},{"family":"Mattson","given":"Christopher A."},{"family":"Dahlin","given":"Eric C."},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Stevenson, P. D., Mattson, C. A., Dahlin, E. C., & Salmon, J. L. (2023). Creating predictive social impact models of engineered products using synthetic populations. Research in Engineering Design, 34(4), 461. https://doi.org/10.1007/s00163-023-00424-4","mla":"Stevenson, Phillip D., et al. \"Creating predictive social impact models of engineered products using synthetic populations.\" Research in Engineering Design, vol. 34, no. 4, 2023, p. 461, https://doi.org/10.1007/s00163-023-00424-4.","chicago_author_date":"Stevenson, Phillip D., Christopher A. Mattson, Eric C. Dahlin, and John L. Salmon. 2023. \"Creating predictive social impact models of engineered products using synthetic populations.\" Research in Engineering Design 34 (4): 461. https://doi.org/10.1007/s00163-023-00424-4.","chicago_bibliography":"Stevenson, Phillip D., Christopher A. Mattson, Eric C. Dahlin, and John L. Salmon. \"Creating predictive social impact models of engineered products using synthetic populations.\" Research in Engineering Design 34, no. 4 (2023): 461. https://doi.org/10.1007/s00163-023-00424-4.","chicago_footnote":"Phillip D. Stevenson, Christopher A. Mattson, Eric C. Dahlin, and John L. Salmon, \"Creating predictive social impact models of engineered products using synthetic populations,\" Research in Engineering Design 34, no. 4 (2023): 461, https://doi.org/10.1007/s00163-023-00424-4.","ieee":"P. D. Stevenson, C. A. Mattson, E. C. Dahlin, and J. L. Salmon, \"Creating predictive social impact models of engineered products using synthetic populations,\" Research in Engineering Design, vol. 34, no. 4, pp. 461, Oct. 2023, doi: 10.1007/s00163-023-00424-4.","bibtex":"@article{stevenson2023creating,\n  author    = {Stevenson, Phillip D. and Mattson, Christopher A. and Dahlin, Eric C. and Salmon, John L.},\n  title     = {Creating predictive social impact models of engineered products using synthetic populations},\n  journal   = {Research in Engineering Design},\n  volume    = {34},\n  number    = {4},\n  pages     = {461},\n  year      = {2023},\n  publisher = {Springer Science and Business Media LLC},\n  doi       = {10.1007/s00163-023-00424-4}\n}"},{"id":"enabling-insights-by-long-term-evaluation-of-social-impact-indicators-of-enginee","slug":"/long-term-evaluation-of-social-impact-indicators","title":"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning","catalog_title":"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning","abstract":"Abstract Remotely measuring social impact indicators of products in developing countries can enable researchers and practitioners to make informed decisions relative to the design of products, improvement of products, or social interventions that can help improve the lives of individuals. Collecting data for determining social impact indicators for long-term periods through manual methods can be cost prohibitive and preclude collection of data that could provide valuable insights. Using in situ sensors remotely deployed and paired with deep learning can enable practitioners to collect long-term data that provide insights that can be as beneficial as data collected through manual observation but with the cost and continuity made possible by sensor devices. Postulates related to successfully developing and deploying this approach have been identified and their usefulness demonstrated through an example application related to a water hand pump in Uganda in which sensor data were collected over a five-month span. Following these postulates can help researchers and practitioners avoid potential issues that could be encountered without them.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4062944","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning","journal":"Journal of Mechanical Design","year":2023,"volume":"145","issue":"11","page":"111401","doi":"10.1115/1.4062944","authors_resolved":[{"family":"Stringham","given":"Bryan J."},{"family":"Mattson","given":"Christopher A."},{"family":"Jenkins","given":"Porter"},{"family":"Dahlin","given":"Eric"},{"family":"Okware","given":"Immaculate Irot"}],"notes":[],"apa":"Stringham, B. J., Mattson, C. A., Jenkins, P., Dahlin, E., & Okware, I. I. (2023). Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning. Journal of Mechanical Design, 145(11), Article 111401. https://doi.org/10.1115/1.4062944","mla":"Stringham, Bryan J., et al. \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning.\" Journal of Mechanical Design, vol. 145, no. 11, 2023, p. 111401, https://doi.org/10.1115/1.4062944.","chicago_author_date":"Stringham, Bryan J., Christopher A. Mattson, Porter Jenkins, Eric Dahlin, and Immaculate Irot Okware. 2023. \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning.\" Journal of Mechanical Design 145 (11): 111401. https://doi.org/10.1115/1.4062944.","chicago_bibliography":"Stringham, Bryan J., Christopher A. Mattson, Porter Jenkins, Eric Dahlin, and Immaculate Irot Okware. \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning.\" Journal of Mechanical Design 145, no. 11 (2023): 111401. https://doi.org/10.1115/1.4062944.","chicago_footnote":"Bryan J. Stringham, Christopher A. Mattson, Porter Jenkins, Eric Dahlin, and Immaculate Irot Okware, \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning,\" Journal of Mechanical Design 145, no. 11 (2023): 111401, https://doi.org/10.1115/1.4062944.","ieee":"B. J. Stringham, C. A. Mattson, P. Jenkins, E. Dahlin, and I. I. Okware, \"Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning,\" Journal of Mechanical Design, vol. 145, no. 11, Art. no. 111401, Nov. 2023, doi: 10.1115/1.4062944.","bibtex":"@article{stringham2023enabling,\n  author    = {Stringham, Bryan J. and Mattson, Christopher A. and Jenkins, Porter and Dahlin, Eric and Okware, Immaculate Irot},\n  title     = {Enabling Insights by Long-Term Evaluation of Social Impact Indicators of Engineered Products for Global Development Using In Situ Sensors and Deep Learning},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {11},\n  pages     = {111401},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4062944}\n}"},{"id":"simulating-the-adoption-and-social-impact-of-improved-cookstoves-in-uganda-using","slug":"/simulating-the-adoption-and-social-impact-of-improved-cookstoves","title":"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks","catalog_title":"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks","abstract":"Abstract This paper presents a methodology for predicting a product’s adoption and social impact using agent-based modeling (ABM) and neural networks to aid in decision-making related to the design and implementation of the product in a sociotechnical system. The collection of primary data on the social impact of a product is also outlined. Although this paper illustrates the method for improved cookstoves in Uganda, the general method can be applied to a wide range of contexts. A field study was carried out in Uganda, consisting of two phases of data collection. The data from the field work were used to train a neural network to predict if an individual would adopt an improved cookstove. Data collected from surveys and the trained adoption model were used to create an ABM to estimate adoption rates and social impacts experienced by households that had adopted technology and to assess social impact indicators. The contributions of this article are a method for collecting primary social impact data on a product and how to integrate those data into a predictive agent-based social impact model. This methodology also enables the examination of leverage points in the sociotechnical system to improve the social impact of a product as it is implemented in society.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4063237","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks","journal":"Journal of Mechanical Design","year":2023,"volume":"145","issue":"12","page":"121701","doi":"10.1115/1.4063237","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Peiffer","given":"Erin E."},{"family":"MacCarty","given":"Nordica"},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Mabey, C. S., Peiffer, E. E., MacCarty, N., & Mattson, C. A. (2023). Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks. Journal of Mechanical Design, 145(12), Article 121701. https://doi.org/10.1115/1.4063237","mla":"Mabey, Christopher S., et al. \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks.\" Journal of Mechanical Design, vol. 145, no. 12, 2023, p. 121701, https://doi.org/10.1115/1.4063237.","chicago_author_date":"Mabey, Christopher S., Erin E. Peiffer, Nordica MacCarty, and Christopher A. Mattson. 2023. \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks.\" Journal of Mechanical Design 145 (12): 121701. https://doi.org/10.1115/1.4063237.","chicago_bibliography":"Mabey, Christopher S., Erin E. Peiffer, Nordica MacCarty, and Christopher A. Mattson. \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks.\" Journal of Mechanical Design 145, no. 12 (2023): 121701. https://doi.org/10.1115/1.4063237.","chicago_footnote":"Christopher S. Mabey, Erin E. Peiffer, Nordica MacCarty, and Christopher A. Mattson, \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks,\" Journal of Mechanical Design 145, no. 12 (2023): 121701, https://doi.org/10.1115/1.4063237.","ieee":"C. S. Mabey, E. E. Peiffer, N. MacCarty, and C. A. Mattson, \"Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks,\" Journal of Mechanical Design, vol. 145, no. 12, Art. no. 121701, Dec. 2023, doi: 10.1115/1.4063237.","bibtex":"@article{mabey2023simulating,\n  author    = {Mabey, Christopher S. and Peiffer, Erin E. and MacCarty, Nordica and Mattson, Christopher A.},\n  title     = {Simulating the Adoption and Social Impact of Improved Cookstoves in Uganda Using Agent-Based Modeling and Neural Networks},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {12},\n  pages     = {121701},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4063237}\n}"},{"id":"trade-off-characterization-between-social-and-environmental-impacts-using-agent","slug":"/trade-off-characterization-between-social-and-environmental-impacts","title":"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment","catalog_title":"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment","abstract":"Abstract Meeting the United Nations (UN) sustainable development goals efficiently requires designers and engineers to solve multi-objective optimization problems involving trade-offs between social, environmental, and economical impacts. This paper presents an approach for designers and engineers to quantify the social and environmental impacts of a product at a population level and then perform a trade-off analysis between those impacts. In this approach, designers and engineers define the attributes of the product as well as the materials and processes used in the product’s life cycle. Agent-based modeling (ABM) tools that have been developed to model the social impacts of products are combined with life cycle assessment (LCA) tools that have been developed to evaluate the pressures that different processes create on the environment. Designers and engineers then evaluate the trade-offs between impacts by finding non-dominated solutions that minimize environmental impacts while maximizing positive and/or minimizing negative social impacts. Product adoption models generated by ABM allow designers and engineers to approximate population level environmental impacts and avoid Simpson’s paradox, where a reversal in choices is preferred when looking at the population level impacts versus the individual product-level impacts. This analysis of impacts has the potential to help designers and engineers create more impactful products that aid in reaching the UN sustainable development goals.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4056006","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment","journal":"Journal of Mechanical Design","year":2023,"volume":"145","issue":"3","page":"032001","doi":"10.1115/1.4056006","authors_resolved":[{"family":"Liechty","given":"Joseph C."},{"family":"Mabey","given":"Christopher S."},{"family":"Mattson","given":"Christopher A."},{"family":"Salmon","given":"John L."},{"family":"Weaver","given":"Jason M."}],"notes":[],"apa":"Liechty, J. C., Mabey, C. S., Mattson, C. A., Salmon, J. L., & Weaver, J. M. (2023). Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment. Journal of Mechanical Design, 145(3), Article 032001. https://doi.org/10.1115/1.4056006","mla":"Liechty, Joseph C., et al. \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment.\" Journal of Mechanical Design, vol. 145, no. 3, 2023, p. 032001, https://doi.org/10.1115/1.4056006.","chicago_author_date":"Liechty, Joseph C., Christopher S. Mabey, Christopher A. Mattson, John L. Salmon, and Jason M. Weaver. 2023. \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment.\" Journal of Mechanical Design 145 (3): 032001. https://doi.org/10.1115/1.4056006.","chicago_bibliography":"Liechty, Joseph C., Christopher S. Mabey, Christopher A. Mattson, John L. Salmon, and Jason M. Weaver. \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment.\" Journal of Mechanical Design 145, no. 3 (2023): 032001. https://doi.org/10.1115/1.4056006.","chicago_footnote":"Joseph C. Liechty, Christopher S. Mabey, Christopher A. Mattson, John L. Salmon, and Jason M. Weaver, \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment,\" Journal of Mechanical Design 145, no. 3 (2023): 032001, https://doi.org/10.1115/1.4056006.","ieee":"J. C. Liechty, C. S. Mabey, C. A. Mattson, J. L. Salmon, and J. M. Weaver, \"Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment,\" Journal of Mechanical Design, vol. 145, no. 3, Art. no. 032001, Mar. 2023, doi: 10.1115/1.4056006.","bibtex":"@article{liechty2023trade,\n  author    = {Liechty, Joseph C. and Mabey, Christopher S. and Mattson, Christopher A. and Salmon, John L. and Weaver, Jason M.},\n  title     = {Trade-Off Characterization Between Social and Environmental Impacts Using Agent-Based Product Adoption Models and Life Cycle Assessment},\n  journal   = {Journal of Mechanical Design},\n  volume    = {145},\n  number    = {3},\n  pages     = {032001},\n  year      = {2023},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4056006}\n}"},{"id":"assessing-global-needs-when-identifying-potential-engineering-for-global-develop","slug":"/assessing-global-needs-for-global-development","title":"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects","catalog_title":"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects","abstract":"Abstract With limited time and resources available to carry out Engineering for Global Development (EGD) projects, it can be difficult to know where those resources should be allocated to have greater potential for meaningful impact. It is easy to assume that projects should occur in a particular location based on personal experience or where other development projects are taking place. This can be a consideration, but it may not lead to the greatest social impact. Where to work on a project and what problem to work on are key questions in the early stages of product development in the context of EGD. To aid in this process, this article presents a method for assessing global needs to ensure thoughtful use of limited EGD resources. We introduce a method for identifying locations where there is human need, gaps in technological achievement, and what the work environment is in a country. Results of the method are compared to what countries receive the most foreign aid dollars per capita. Measures were calculated using the principal component analysis on data from development agencies. These results can help practitioners in selecting where to undertake development projects with an eye toward targeting locations that may yield high levels of social impact.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4052223","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects","journal":"Journal of Mechanical Design","year":2022,"volume":"144","issue":"3","page":"031402","doi":"10.1115/1.4052223","authors_resolved":[{"family":"Mabey","given":"Christopher S."},{"family":"Mattson","given":"Christopher A."},{"family":"Dahlin","given":"Eric C."}],"notes":[],"apa":"Mabey, C. S., Mattson, C. A., & Dahlin, E. C. (2022). Assessing Global Needs When Identifying Potential Engineering for Global Development Projects. Journal of Mechanical Design, 144(3), Article 031402. https://doi.org/10.1115/1.4052223","mla":"Mabey, Christopher S., et al. \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects.\" Journal of Mechanical Design, vol. 144, no. 3, 2022, p. 031402, https://doi.org/10.1115/1.4052223.","chicago_author_date":"Mabey, Christopher S., Christopher A. Mattson, and Eric C. Dahlin. 2022. \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects.\" Journal of Mechanical Design 144 (3): 031402. https://doi.org/10.1115/1.4052223.","chicago_bibliography":"Mabey, Christopher S., Christopher A. Mattson, and Eric C. Dahlin. \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects.\" Journal of Mechanical Design 144, no. 3 (2022): 031402. https://doi.org/10.1115/1.4052223.","chicago_footnote":"Christopher S. Mabey, Christopher A. Mattson, and Eric C. Dahlin, \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects,\" Journal of Mechanical Design 144, no. 3 (2022): 031402, https://doi.org/10.1115/1.4052223.","ieee":"C. S. Mabey, C. A. Mattson, and E. C. Dahlin, \"Assessing Global Needs When Identifying Potential Engineering for Global Development Projects,\" Journal of Mechanical Design, vol. 144, no. 3, Art. no. 031402, Mar. 2022, doi: 10.1115/1.4052223.","bibtex":"@article{mabey2022assessing,\n  author    = {Mabey, Christopher S. and Mattson, Christopher A. and Dahlin, Eric C.},\n  title     = {Assessing Global Needs When Identifying Potential Engineering for Global Development Projects},\n  journal   = {Journal of Mechanical Design},\n  volume    = {144},\n  number    = {3},\n  pages     = {031402},\n  year      = {2022},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4052223}\n}"},{"id":"systematic-review-and-classification-of-the-engineering-for-global-development-l","slug":"/systematic-review-and-classification-of-the-engineering-for-global-development","title":"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration","catalog_title":"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration","abstract":"Abstract While many tools and methodologies for assessing social impact exist and are used in the social science and global development fields, there is a lack of standard methods for considering the broader social impact of products in the engineering community. Some reasons these methods are not as widely used in the engineering community include designers not being aware of the methods, or methods not being widely applicable. The purpose of this research is to help designers and researchers find relevant design tools and methods for implementing social impact considerations. This is done through the classification of 374 papers in the Engineering for Global Development (EGD) literature along several dimensions including method purpose, industry sector, social impacts considered, sustainable development goals, paper setting, and data inputs required. This article describes how designers and researchers can use this set of classified papers to locate relevant design tools and methods to improve social impact considerations in their work.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4055325","badge":"journal","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration","journal":"Journal of Mechanical Design","year":2023,"volume":"145","issue":"3","page":"030801","doi":"10.1115/1.4055325","authors_resolved":[{"family":"Armstrong","given":"Andrew G."},{"family":"Suk","given":"Hailie"},{"family":"Mabey","given":"Christopher S."},{"family":"Mattson","given":"Christopher A."},{"family":"Hall","given":"John"},{"family":"Salmon","given":"John L."}],"notes":[],"apa":"Armstrong, A. G., Suk, H., Mabey, C. S., Mattson, C. A., Hall, J., & Salmon, J. L. (2023). Systematic Review and Classification of the Engineering for Global Development Literature Based on Design Tools and Methods for Social Impact Consideration. Journal of Mechanical Design, 145(3), Article 03
