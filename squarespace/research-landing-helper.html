<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DesX Research Landing Helper</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #c44b23;
      --accent-soft: #fff7ed;
      --done: #166534;
      --done-bg: #ecfdf5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 700;
    }

    header p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .controls {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    select, input[type="search"], button {
      font: inherit;
    }

    select, input[type="search"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }

    select:focus, input[type="search"]:focus {
      outline: 2px solid rgba(196, 75, 35, 0.35);
      border-color: var(--accent);
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: #94a3b8; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover { filter: brightness(0.95); }

    button.copied {
      background: var(--done-bg);
      border-color: #86efac;
      color: var(--done);
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 12px 14px 28px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      background: #fff;
    }

    .pill.done {
      color: var(--done);
      border-color: #86efac;
      background: var(--done-bg);
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    section h2 {
      margin: 0 0 10px;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .field {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }

    .field:first-of-type {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .field-head label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .value {
      width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
    }

    input.value {
      white-space: nowrap;
      resize: none;
    }

    .value.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; }

    .value:focus {
      outline: 2px solid rgba(196, 75, 35, 0.35);
      border-color: var(--accent);
      background: #fff;
    }

    .value.auto-sync {
      background: #fffbeb;
    }

    .hint {
      margin-top: 6px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.86rem;
    }

    .draft-status {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .draft-status.linked {
      border-color: #86efac;
      background: var(--done-bg);
      color: var(--done);
    }

    .draft-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .draft-actions button {
      font-size: 0.78rem;
      padding: 6px 8px;
    }

  </style>
</head>
<body>
  <header>
    <h1>Research landing helper</h1>
    <p>Snap this window to the right ~25% of your screen. Match fields to the Squarespace template on the left.</p>
    <div class="controls">
      <input id="search" type="search" placeholder="Filter papers by title or slug…" autocomplete="off" />
      <div class="row">
        <select id="paper-select" aria-label="Select paper"></select>
      </div>
      <div class="row">
        <button type="button" id="prev-btn" title="Previous paper">Prev</button>
        <button type="button" id="next-btn" title="Next paper">Next</button>
        <button type="button" id="copy-all-btn" class="primary">Copy full page text</button>
      </div>
      <div id="draft-status" class="draft-status">
        Drafts save in this browser only. Link <code>catalog/research-landing-drafts.json</code> once to auto-save edits for Cursor.
      </div>
      <div class="draft-actions">
        <button type="button" id="link-drafts-btn">Link drafts file…</button>
        <button type="button" id="export-drafts-btn">Export drafts</button>
      </div>
    </div>
  </header>
  <main id="main"></main>

hanisms: a bicycle derailleur and parallel-motion bicycle brakes. The PRBM allows compliant mechanisms to be modeled and analyzed as rigid-body mechanisms and significantly reduces the complexity of analysis. Mechanisms with straightforward properties are used to demonstrate the use of the PRBM to design commercially viable compliant mechanisms for required motion and force-deflection characteristics.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1177/1045389x04033256","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"scholar_citations":80,"resolved_title":"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms","journal":"Journal of Intelligent Material Systems and Structures","year":2004,"volume":"15","issue":"3","page":"195","doi":"10.1177/1045389x04033256","authors_resolved":[{"family":"Mattson","given":"Christopher A."},{"family":"Howell","given":"Larry L."},{"family":"Magleby","given":"Spencer P."}],"notes":[],"apa":"Mattson, C. A., Howell, L. L., & Magleby, S. P. (2004). Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms. Journal of Intelligent Material Systems and Structures, 15(3), 195. https://doi.org/10.1177/1045389x04033256","mla":"Mattson, Christopher A., et al.. \"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms.\" Journal of Intelligent Material Systems and Structures, vol. 15, no. 3, 2004, p. 195, https://doi.org/10.1177/1045389x04033256.","chicago_author_date":"Mattson, Christopher A., Larry L. Howell, and Spencer P. Magleby. 2004. \"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms.\" Journal of Intelligent Material Systems and Structures 15 (3): 195. https://doi.org/10.1177/1045389x04033256.","chicago_bibliography":"Mattson, Christopher A., Larry L. Howell, and Spencer P. Magleby. \"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms.\" Journal of Intelligent Material Systems and Structures 15, no. 3 (2004): 195. https://doi.org/10.1177/1045389x04033256.","chicago_footnote":"Christopher A. Mattson, Larry L. Howell, and Spencer P. Magleby, \"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms,\" Journal of Intelligent Material Systems and Structures 15, no. 3 (2004): 195, https://doi.org/10.1177/1045389x04033256.","ieee":"C. A. Mattson, L. L. Howell, and S. P. Magleby, \"Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms,\" Journal of Intelligent Material Systems and Structures, vol. 15, no. 3, pp. 195, Mar. 2004, doi: 10.1177/1045389x04033256.","bibtex":"@article{mattson2004development,\n  author    = {Mattson, Christopher A. and Howell, Larry L. and Magleby, Spencer P.},\n  title     = {Development of Commercially Viable Compliant Mechanisms Using the                Pseudo-Rigid-Body Model: Case Studies of Parallel Mechanisms},\n  journal   = {Journal of Intelligent Material Systems and Structures},\n  volume    = {15},\n  number    = {3},\n  pages     = {195},\n  year      = {2004},\n  publisher = {SAGE Publications},\n  doi       = {10.1177/1045389x04033256}\n}"},{"id":"the-personification-of-big-data","slug":"/the-personification-of-big-data","title":"The Personification of Big Data","catalog_title":"The Personification of Big Data","abstract":"Abstract Organizations all over the world, both national and international, gather demographic data so that the progress of nations and peoples can be tracked. This data is often made available to the public in the form of aggregated national level data or individual responses (microdata). Product designers likewise conduct surveys to better understand their customer and create personas. Personas are archetypes of the individuals who will use, maintain, sell or otherwise be affected by the products created by designers. Personas help designers better understand the person the product is designed for. Unfortunately, the process of collecting customer information and creating personas is often a slow and expensive process. In this paper, we introduce a new method of creating personas, leveraging publicly available databanks of both aggregated national level and information on individuals in the population. A computational persona generator is introduced that creates a population of personas that mirrors a real population in terms of size and statistics. Realistic individual personas are filtered from this population for use in product development.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/dsi.2019.409","badge":"conference","categories":["Social impact modeling"],"hidden":false,"scholar_citations":53,"resolved_title":"The Personification of Big Data","journal":"Proceedings of the Design Society: International Conference on Engineering Design","year":2019,"volume":"1","issue":"1","page":"4019","doi":"10.1017/dsi.2019.409","authors_resolved":[{"family":"Stevenson","given":"Phillip Douglas"},{"family":"Mattson","given":"Christopher Andrew"}],"notes":[],"apa":"Stevenson, P. D. & Mattson, C. A. (2019). The Personification of Big Data. Proceedings of the Design Society: International Conference on Engineering Design, 1(1), 4019. https://doi.org/10.1017/dsi.2019.409","mla":"Stevenson, Phillip Douglas, and Christopher Andrew Mattson. \"The Personification of Big Data.\" Proceedings of the Design Society: International Conference on Engineering Design, vol. 1, no. 1, 2019, p. 4019, https://doi.org/10.1017/dsi.2019.409.","chicago_author_date":"Stevenson, Phillip Douglas and Christopher Andrew Mattson. 2019. \"The Personification of Big Data.\" Proceedings of the Design Society: International Conference on Engineering Design 1 (1): 4019. https://doi.org/10.1017/dsi.2019.409.","chicago_bibliography":"Stevenson, Phillip Douglas and Christopher Andrew Mattson. \"The Personification of Big Data.\" Proceedings of the Design Society: International Conference on Engineering Design 1, no. 1 (2019): 4019. https://doi.org/10.1017/dsi.2019.409.","chicago_footnote":"Phillip Douglas Stevenson and Christopher Andrew Mattson, \"The Personification of Big Data,\" Proceedings of the Design Society: International Conference on Engineering Design 1, no. 1 (2019): 4019, https://doi.org/10.1017/dsi.2019.409.","ieee":"P. D. Stevenson and C. A. Mattson, \"The Personification of Big Data,\" Proceedings of the Design Society: International Conference on Engineering Design, vol. 1, no. 1, pp. 4019, Jul. 2019, doi: 10.1017/dsi.2019.409.","bibtex":"@article{stevenson2019personification,\n  author    = {Stevenson, Phillip Douglas and Mattson, Christopher Andrew},\n  title     = {The Personification of Big Data},\n  journal   = {Proceedings of the Design Society: International Conference on Engineering Design},\n  volume    = {1},\n  number    = {1},\n  pages     = {4019},\n  year      = {2019},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/dsi.2019.409}\n}"},{"id":"the-influence-of-product-modularity-during-concept-selection-of-consumer-products","slug":"/the-influence-of-product-modularity-during-concept-selection-of-consumer-products","title":"The Influence of Product Modularity During Concept Selection of Consumer Products","catalog_title":"The Influence of Product Modularity During Concept Selection of Consumer Products","abstract":"Abstract The design of modular products, or modular-product design, is a powerful design strategy that can boost the competitive edge of a company that employs its benefits. We introduce in this paper an approach for managing the influence of product modularity during concept selection of consumer products. We propose a process that consists of four steps. The first step is to define the business strategy and associated objectives for the product, based on an expanded definition of modularity. The second step is to prioritize the objectives using an objective tree. The third step is to establish design metrics and the final step is to weigh each metric by the design objectives. The outcome of the process is an overall objective metric (composite score) that is used for concept selection and is a measure of the balance of design objectives affected by modularity. Finally, three product concepts of varying modularity are analyzed using various design objectives to show that the selection of the best (most suitable) concepts depend fully on the design objectives and that the most modular designs are not necessarily the best.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2001/dtm-21712","badge":"conference","categories":["Systems & Product Architecture"],"hidden":false,"scholar_citations":51,"resolved_title":"The Influence of Product Modularity During Concept Selection of Consumer Products","journal":"Volume 4: 13th International Conference on Design Theory and Methodology","year":2001,"volume":"","issue":"","page":"299","doi":"10.1115/detc2001/dtm-21712","authors_resolved":[{"family":"Mattson","given":"Christopher A."},{"family":"Magleby","given":"Spencer P."}],"notes":[],"apa":"Mattson, C. A. & Magleby, S. P. (2001). The Influence of Product Modularity During Concept Selection of Consumer Products. Volume 4: 13th International Conference on Design Theory and Methodology, 299. https://doi.org/10.1115/detc2001/dtm-21712","mla":"Mattson, Christopher A., and Spencer P. Magleby. \"The Influence of Product Modularity During Concept Selection of Consumer Products.\" Volume 4: 13th International Conference o he need for adaptable cookstoves","abstract":"Presents research on a global review of end user needs: Establishing the need for adaptable cookstoves.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1109/ghtc.2014.6970352","badge":"conference","categories":["Social impact modeling"],"hidden":false,"scholar_citations":46,"resolved_title":"A global review of end user needs: Establishing the need for adaptable cookstoves","journal":"IEEE Global Humanitarian Technology Conference (GHTC 2014)","year":2014,"volume":"","issue":"","page":"649","doi":"10.1109/ghtc.2014.6970352","authors_resolved":[{"family":"Thacker","given":"Kendall S."},{"family":"Barger","given":"McCall"},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Thacker, K. S., Barger, M., & Mattson, C. A. (2014). A global review of end user needs: Establishing the need for adaptable cookstoves. IEEE Global Humanitarian Technology Conference (GHTC 2014), 649. https://doi.org/10.1109/ghtc.2014.6970352","mla":"Thacker, Kendall S., et al.. \"A global review of end user needs: Establishing the need for adaptable cookstoves.\" IEEE Global Humanitarian Technology Conference (GHTC 2014), 2014, p. 649, https://doi.org/10.1109/ghtc.2014.6970352.","chicago_author_date":"Thacker, Kendall S., McCall Barger, and Christopher A. Mattson. 2014. \"A global review of end user needs: Establishing the need for adaptable cookstoves.\" IEEE Global Humanitarian Technology Conference (GHTC 2014): 649. https://doi.org/10.1109/ghtc.2014.6970352.","chicago_bibliography":"Thacker, Kendall S., McCall Barger, and Christopher A. Mattson. \"A global review of end user needs: Establishing the need for adaptable cookstoves.\" IEEE Global Humanitarian Technology Conference (GHTC 2014) (2014): 649. https://doi.org/10.1109/ghtc.2014.6970352.","chicago_footnote":"Kendall S. Thacker, McCall Barger, and Christopher A. Mattson, \"A global review of end user needs: Establishing the need for adaptable cookstoves,\" IEEE Global Humanitarian Technology Conference (GHTC 2014) (2014): 649, https://doi.org/10.1109/ghtc.2014.6970352.","ieee":"K. S. Thacker, M. Barger, and C. A. Mattson, \"A global review of end user needs: Establishing the need for adaptable cookstoves,\" IEEE Global Humanitarian Technology Conference (GHTC 2014), pp. 649, Oct. 2014, doi: 10.1109/ghtc.2014.6970352.","bibtex":"@article{thacker2014global,\n  author    = {Thacker, Kendall S. and Barger, McCall and Mattson, Christopher A.},\n  title     = {A global review of end user needs: Establishing the need for adaptable cookstoves},\n  journal   = {IEEE Global Humanitarian Technology Conference (GHTC 2014)},\n  pages     = {649},\n  year      = {2014},\n  publisher = {IEEE},\n  doi       = {10.1109/ghtc.2014.6970352}\n}"},{"id":"social-impact-in-product-design-an-exploration-of-current-industry-practices","slug":"/social-impact-in-product-design-an-exploration-of-current-industry-practices","title":"Social Impact in Product Design, An Exploration of Current Industry Practices","catalog_title":"Social Impact in Product Design, An Exploration of Current Industry Practices","abstract":"Abstract Though academic research for identifying and considering the social impact of products is emerging, additional insights can be gained from engineers who design products every day. This paper explores current practices in industries used by design engineers to consider the social impact of products. Forty-six individuals from 34 different companies were interviewed to discover what disconnects exist between academia and industry when considering a product’s social impact. These interviews were also used to discover how social impact might be considered in a design setting moving forward. This is not a study to find “the state of the art,” but considers the average engineering professional’s work to design products in various industries. Social impact assessments (SIA) and social life cycle assessments (SLCA) are two of the most common processes discussed in the literature to evaluate social impact, both generally and in products. Interestingly, these processes did not arise in any discussion in interviews, despite respondents affirming that they do consider social impact in the product design. Processes used to predict social impact, rather than simply evaluate, were discussed by the respondents. These tended to be developed within the company and often related to industry imposed government regulations. To build on this study, the findings herein should be further validated for executives, managers, and engineers. A study specific to these roles should be designed to understand the disconnect better. Additionally, processes should be developed to assist engineers in considering the social impact of their products. Work should also be done to help educate engineers and their leaders on the value of considering the social impact in product design.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4045448","badge":"journal","categories":["Social impact modeling"],"hidden":false,"scholar_citations":42,"resolved_title":"Social Impact in Product Design, An Exploration of Current Industry Practices","journal":"Journal of Mechanical Design","year":2020,"volume":"142","issue":"7","page":"071702","doi":"10.1115/1.4045448","authors_resolved":[{"family":"Pack","given":"Andrew T."},{"family":"Rose Phipps","given":"Emma"},{"family":"Mattson","given":"Christopher A."},{"family":"Dahlin","given":"Eric C."}],"notes":[],"apa":"Pack, A. T., Rose Phipps, E., Mattson, C. A., & Dahlin, E. C. (2020). Social Impact in Product Design, An Exploration of Current Industry Practices. Journal of Mechanical Design, 142(7), Article 071702. https://doi.org/10.1115/1.4045448","mla":"Pack, Andrew T., et al.. \"Social Impact in Product Design, An Exploration of Current Industry Practices.\" Journal of Mechanical Design, vol. 142, no. 7, 2020, p. 071702, https://doi.org/10.1115/1.4045448.","chicago_author_date _url":"https://www.overleaf.com/read/mgsyqnjkpshg#d76e66","badge":"whitepaper","categories":["Engineering For Global Health"],"hidden":false,"resolved_title":"Global Health Glossary","journal":"","year":2025,"volume":"","issue":"","page":"","doi":null,"authors_resolved":[{"family":"Hardy","given":"J. P."},{"family":"Zubeldia","given":"S. T."},{"family":"Mattson","given":"C. A."}],"notes":["No Crossref record — citations built from catalog fields only.","Non-journal / incomplete venue metadata."],"apa":"Hardy, J. P., Zubeldia, S. T., & Mattson, C. A. (2025). Global Health Glossary. https://www.overleaf.com/read/mgsyqnjkpshg#d76e66","mla":"Hardy, J. P., et al. \"Global Health Glossary.\" 2025. https://www.overleaf.com/read/mgsyqnjkpshg#d76e66.","chicago_author_date":"Hardy, J. P., S. T. Zubeldia, and Christopher A. Mattson. 2025. \"Global Health Glossary.\" https://www.overleaf.com/read/mgsyqnjkpshg#d76e66.","chicago_bibliography":"Hardy, J. P., S. T. Zubeldia, and Christopher A. Mattson. \"Global Health Glossary.\" https://www.overleaf.com/read/mgsyqnjkpshg#d76e66.","chicago_footnote":"J. P. Hardy, S. T. Zubeldia, and Christopher A. Mattson, \"Global Health Glossary,\", https://www.overleaf.com/read/mgsyqnjkpshg#d76e66.","ieee":"J. P. Hardy, S. T. Zubeldia, and C. A. Mattson, \"Global Health Glossary,\" https://www.overleaf.com/read/mgsyqnjkpshg#d76e66.","bibtex":"@misc{hardy2025global,\n  author    = {Hardy, J. P. and Zubeldia, S. T. and Mattson, Christopher A.},\n  title     = {Global Health Glossary},\n  year      = {2025},\n  url       = {https://www.overleaf.com/read/mgsyqnjkpshg#d76e66}\n}"},{"id":"path-optimization-from-en-route-3d-printed-aircraft-using-physics-based-estimati","slug":"/path-optimization-from-en-route-3d-printed-aircraft","title":"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models","catalog_title":"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models","abstract":"Abstract In a previous study, a general approach to increasing the range capability of an unmanned aerial system was assessed by 3D printing components or parts for the unmanned aerial systems (UAS) while a carrier platform, of both the printer and UAS systems, travels to a launch point for the UAS. As a result, the platform could launch the UAS from a distance further away from the location of interest. This article outlines the parameters of a physics-based model to determine the actual range increase of an attritable aircraft, constrained by the amount of time available for printing while en route. It develops the formulation of the UAS range increase from the lift-to-drag ratio increases caused by the physical wing section enhancements printed in a constrained amount of time while the carrier platform travels from one location to another. The relationship is leveraged to optimize the shortest path necessary for the carrier platform to access or reach the set of locations of interest in an operational environment. Scenarios of up to 15 locations are explored by first optimizing the sequence of the locations in a traveling salesman problem and then optimizing the actual path taken by the carrier platform along that sequence. Statistical results are presented to summarize the benefits of 3D printing en route across different scenarios.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/1.4069685","badge":"journal","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models","journal":"Journal of Mechanical Design","year":2026,"volume":"148","issue":"4","page":"041704","doi":"10.1115/1.4069685","authors_resolved":[{"family":"Dickerson","given":"Tevin J."},{"family":"Salmon","given":"John L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Dickerson, T. J., Salmon, J. L., & Mattson, C. A. (2026). Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models. Journal of Mechanical Design, 148(4), Article 041704. https://doi.org/10.1115/1.4069685","mla":"Dickerson, Tevin J., et al. \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models.\" Journal of Mechanical Design, vol. 148, no. 4, 2026, p. 041704, https://doi.org/10.1115/1.4069685.","chicago_author_date":"Dickerson, Tevin J., John L. Salmon, and Christopher A. Mattson. 2026. \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models.\" Journal of Mechanical Design 148 (4): 041704. https://doi.org/10.1115/1.4069685.","chicago_bibliography":"Dickerson, Tevin J., John L. Salmon, and Christopher A. Mattson. \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models.\" Journal of Mechanical Design 148, no. 4 (2026): 041704. https://doi.org/10.1115/1.4069685.","chicago_footnote":"Tevin J. Dickerson, John L. Salmon, and Christopher A. Mattson, \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models,\" Journal of Mechanical Design 148, no. 4 (2026): 041704, https://doi.org/10.1115/1.4069685.","ieee":"T. J. Dickerson, J. L. Salmon, and C. A. Mattson, \"Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models,\" Journal of Mechanical Design, vol. 148, no. 4, Art. no. 041704, Apr. 2026, doi: 10.1115/1.4069685.","bibtex":"@article{dickerson2026path,\n  author    = {Dickerson, Tevin J. and Salmon, John L. and Mattson, Christopher A.},\n  title     = {Path Optimization From En Route 3D-Printed Aircraft Using Physics-Based Estimation Methods and Surrogate Models},\n  journal   = {Journal of Mechanical Design},\n  volume    = {148},\n  number    = {4},\n  pages     = {041704},\n  year      = {2026},\n  publisher = {ASME International},\n  doi       = {10.1115/1.4069685}\n}"},{"id":"an-approach-for-developing-a-decision-support-tool-for-emerging-concepts-designi","slug":"/emerging-concepts-decision-support-tool","title":"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions","catalog_title":"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions","abstract":"Abstract Developing decision support tools (DSTs) for novel or poorly defined design challenges presents unique challenges. Emerging concepts often lack established design data and are characterized by high uncertainty and unconventional requirements, requiring a structured approach to tool development. This paper examines insights gained from two sources: (1) the development of a DST for early-stage exploration of blended wing body (BWB) aircraft, and (2) from the application of the Product Architecture Strategies and Effects (PASE) database. By leveraging these complementary sources, we identify nine principles to guide effective DST development in such environments. Our findings address fundamental challenges such as balancing resource efficiency with analytical depth, structuring user interactions to enhance decision-making, and ensuring that DSTs remain adaptable in evolving design environments. Finally, by drawing insights from these tools, we propose a framework for constructing DSTs that support exploratory design under uncertainty, providing actionable guidelines for structuring decision-making in engineering fields where innovation requires navigating ambiguity and incomplete data.1","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2025-169042","badge":"conference","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions","journal":"Volume 3B: 51st Design Automation Conference (DAC)","year":2025,"volume":"","issue":"","page":"V03BT03A037","doi":"10.1115/detc2025-169042","authors_resolved":[{"family":"Humphrey","given":"Tyson M."},{"family":"Wooley","given":"Henry C. W."},{"family":"Mattson","given":"Christopher A."},{"family":"Anderson","given":"Michael L."},{"family":"Carr","given":"Ryan W."}],"notes":[],"apa":"Humphrey, T. M., Wooley, H. C. W., Mattson, C. A., Anderson, M. L., & Carr, R. W. (2025). An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions. Volume 3B: 51st Design Automation Conference (DAC), V03BT03A037. https://doi.org/10.1115/detc2025-169042","mla":"Humphrey, Tyson M., et al. \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions.\" Volume 3B: 51st Design Automation Conference (DAC), 2025, p. V03BT03A037, https://doi.org/10.1115/detc2025-169042.","chicago_author_date":"Humphrey, Tyson M., Henry C. W. Wooley, Christopher A. Mattson, Michael L. Anderson, and Ryan W. Carr. 2025. \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions.\" Volume 3B: 51st Design Automation Conference (DAC): V03BT03A037. https://doi.org/10.1115/detc2025-169042.","chicago_bibliography":"Humphrey, Tyson M., Henry C. W. Wooley, Christopher A. Mattson, Michael L. Anderson, and Ryan W. Carr. \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions.\" Volume 3B: 51st Design Automation Conference (DAC) (2025): V03BT03A037. https://doi.org/10.1115/detc2025-169042.","chicago_footnote":"Tyson M. Humphrey, Henry C. W. Wooley, Christopher A. Mattson, Michael L. Anderson, and Ryan W. Carr, \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions,\" Volume 3B: 51st Design Automation Conference (DAC) (2025): V03BT03A037, https://doi.org/10.1115/detc2025-169042.","ieee":"T. M. Humphrey, H. C. W. Wooley, C. A. Mattson, M. L. Anderson, and R. W. Carr, \"An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions,\" Volume 3B: 51st Design Automation Conference (DAC), pp. V03BT03A037, Aug. 2025, doi: 10.1115/detc2025-169042.","bibtex":"@article{humphrey2025approach,\n  author    = {Humphrey, Tyson M. and Wooley, Henry C. W. and Mattson, Christopher A. and Anderson, Michael L. and Carr, Ryan W.},\n  title     = {An Approach for Developing a Decision Support Tool for Emerging Concepts: Designing Blended Wing Body Aircraft for Logistics Missions},\n  journal   = {Volume 3B: 51st Design Automation Conference (DAC)},\n  pages     = {V03BT03A037},\n  year      = {2025},\n  publisher = {American Society of Mechanical Engineers},\n  doi       = {10.1115/detc2025-169042}\n}"},{"id":"designing-for-machine-longevity-a-literature-survey","slug":"/designing-for-machine-longevity-a-literature-survey","title":"Designing for Machine Longevity - A Literature Survey","catalog_title":"Designing for Machine Longevity - A Literature Survey","abstract":"ABSTRACT: Complex machines are increasingly expensive to develop and build, which causes many to be maintained in service for longer than initially designed, as they still effectively perform valuable tasks. Longlasting, effective service lives of centuries rather than decades are a valuable characteristic for certain machines in several industries, whether for continual service, extended storage, or extremely remote deployment, such as in military service, agriculture and space exploration. Although there are various archival publications that focus on longevity, we seek to identify product architecture decisions which impact a machine’s longevity and can then be extrapolated out for timescales greater than 100 years. We refer to this as hyper-longevity. This paper seeks to find patterns in the literature that can identify causes linked to longevity effects, their frequency in the literature, and the types of impacts they have in facilitating longevity.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/pds.2025.10147","badge":"conference","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Designing for Machine Longevity - A Literature Survey","journal":"Proceedings of the Design Society","year":2025,"volume":"5","issue":"","page":"1335","doi":"10.1017/pds.2025.10147","authors_resolved":[{"family":"Rice","given":"Scott E."},{"family":"Sannar","given":"Benjamin C."},{"family":"Mattson","given":"Christopher A."},{"family":"Anderson","given":"Michael L."}],"notes":[],"apa":"Rice, S. E., Sannar, B. C., Mattson, C. A., & Anderson, M. L. (2025). Designing for Machine Longevity - A Literature Survey. Proceedings of the Design Society, 5, 1335. https://doi.org/10.1017/pds.2025.10147","mla":"Rice, Scott E., et al. \"Designing for Machine Longevity - A Literature Survey.\" Proceedings of the Design Society, vol. 5, 2025, p. 1335, https://doi.org/10.1017/pds.2025.10147.","chicago_author_date":"Rice, Scott E., Benjamin C. Sannar, Christopher A. Mattson, and Michael L. Anderson. 2025. \"Designing for Machine Longevity - A Literature Survey.\" Proceedings of the Design Society 5: 1335. https://doi.org/10.1017/pds.2025.10147.","chicago_bibliography":"Rice, Scott E., Benjamin C. Sannar, Christopher A. Mattson, and Michael L. Anderson. \"Designing for Machine Longevity - A Literature Survey.\" Proceedings of the Design Society 5 (2025): 1335. https://doi.org/10.1017/pds.2025.10147.","chicago_footnote":"Scott E. Rice, Benjamin C. Sannar, Christopher A. Mattson, and Michael L. Anderson, \"Designing for Machine Longevity - A Literature Survey,\" Proceedings of the Design Society 5 (2025): 1335, https://doi.org/10.1017/pds.2025.10147.","ieee":"S. E. Rice, B. C. Sannar, C. A. Mattson, and M. L. Anderson, \"Designing for Machine Longevity - A Literature Survey,\" Proceedings of the Design Society, vol. 5, pp. 1335, Aug. 2025, doi: 10.1017/pds.2025.10147.","bibtex":"@article{rice2025designing,\n  author    = {Rice, Scott E. and Sannar, Benjamin C. and Mattson, Christopher A. and Anderson, Michael L.},\n  title     = {Designing for Machine Longevity - A Literature Survey},\n  journal   = {Proceedings of the Design Society},\n  volume    = {5},\n  pages     = {1335},\n  year      = {2025},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2025.10147}\n}"},{"id":"extending-solid-principles-to-systems-engineering-leveraging-sysml-for-modular-d","slug":"/extending-solid-principles-to-systems-engineering","title":"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis","catalog_title":"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis","abstract":"Abstract Software systems are usually designed for modularity and maintenance due to ever-changing package and system configurations and have, in recent years, implemented abstract design methods such as Agile Development and SOLID Principles. Software Engineering can also be considered a subdivision of the large and extensive field of Systems Engineering (SE), and therefore, extending and applying Agile and SOLID Principles into SE may be beneficial as SE also must respond to changing requirements, technology obsolescence and evolution, stakeholders dynamics, and other factors. A commonly used format for Systems Engineering is SysML. This paper seeks to develop a method for quantifying feature os SysML that can help validate SOLID and Agile design principles. During this process and development, tools are proposed to help users make better decisions when designing SysML diagrams and in other SE processes. Diagrams are then converted to Design Structure Matrices, Domain Mapping Matrices, and Multi-Domain Matrices. These matrices are then used to measure the system complexity. A case study with a simple arduino blinking light is presented.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1115/detc2025-169752","badge":"conference","categories":["Systems & Product Architecture"],"hidden":false,"resolved_title":"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis","journal":"Volume 2B: 45th Computers and Information in Engineering Conference (CIE)","year":2025,"volume":"","issue":"","page":"V02BT02A062","doi":"10.1115/detc2025-169752","authors_resolved":[{"family":"Dickerson","given":"Tevin"},{"family":"Salmon","given":"John L."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"Dickerson, T., Salmon, J. L., & Mattson, C. A. (2025). Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis. Volume 2B: 45th Computers and Information in Engineering Conference (CIE), V02BT02A062. https://doi.org/10.1115/detc2025-169752","mla":"Dickerson, Tevin, et al. \"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis.\" Volume 2B: 45th Computers and Information in Engineering Conference (CIE), 2025, p. V02BT02A062, https://doi.org/10.1115/detc2025-169752.","chicago_author_date":"Dickerson, Tevin, John L. Salmon, and Christopher A. Mattson. 2025. \"Extending Solid Principles to Systems Engineering: Leveraging SysML for Modular Design and Complexity Analysis.\" Volume 2B: 45th Computers and Information in Engineering Conference (CIE): V02BT02A062. https://doi.org/10.1115/detc2025-169752.","chicago_bibliography":"Dickerson, Tevin, John L. Salmon, and Christopher A. Mattson. \"Ext ducts. An essential part of design for sustainable development is understanding the social impacts that technology has on people. Social impact diffusion can model how these impacts propagate through society. This paper combines social impact diffusion models, graph-based socio-technical representations, and computational optimization techniques to present a social impact diffusion objective function for optimizing social impact in socio-technical systems. The results of the paper indicate that using social impact diffusion objective functions can improve upon random or best guess designs for socio-technical systems.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1017/pds.2025.10210","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System","journal":"Proceedings of the Design Society","year":2025,"volume":"5","issue":"","page":"1963","doi":"10.1017/pds.2025.10210","authors_resolved":[{"family":"McKinnon","given":"Samuel A."},{"family":"Mattson","given":"Christopher A."}],"notes":[],"apa":"McKinnon, S. A. & Mattson, C. A. (2025). Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System. Proceedings of the Design Society, 5, 1963. https://doi.org/10.1017/pds.2025.10210","mla":"McKinnon, Samuel A., and Christopher A. Mattson. \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System.\" Proceedings of the Design Society, vol. 5, 2025, p. 1963, https://doi.org/10.1017/pds.2025.10210.","chicago_author_date":"McKinnon, Samuel A. and Christopher A. Mattson. 2025. \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System.\" Proceedings of the Design Society 5: 1963. https://doi.org/10.1017/pds.2025.10210.","chicago_bibliography":"McKinnon, Samuel A. and Christopher A. Mattson. \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System.\" Proceedings of the Design Society 5 (2025): 1963. https://doi.org/10.1017/pds.2025.10210.","chicago_footnote":"Samuel A. McKinnon and Christopher A. Mattson, \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System,\" Proceedings of the Design Society 5 (2025): 1963, https://doi.org/10.1017/pds.2025.10210.","ieee":"S. A. McKinnon and C. A. Mattson, \"Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System,\" Proceedings of the Design Society, vol. 5, pp. 1963, Aug. 2025, doi: 10.1017/pds.2025.10210.","bibtex":"@article{mckinnon2025graph,\n  author    = {McKinnon, Samuel A. and Mattson, Christopher A.},\n  title     = {Graph-Based Social Impact Diffusion Optimization across a Theoretical Socio-Technical System},\n  journal   = {Proceedings of the Design Society},\n  volume    = {5},\n  pages     = {1963},\n  year      = {2025},\n  publisher = {Cambridge University Press (CUP)},\n  doi       = {10.1017/pds.2025.10210}\n}"},{"id":"quantifiable-theory-of-change","slug":"/quantifiable-theory-of-change","title":"Quantifiable Theory of Change","catalog_title":"Quantifiable Theory of Change","abstract":"Presents a quantifiable Theory of Change approach for measuring and designing toward intended social outcomes.","abstract_source":"catalog","publisher_url":"https://doi.org/10.1109/ghtc66843.2025.11266770","badge":"conference","categories":["Social impact modeling"],"hidden":false,"resolved_title":"Quantifiable Theory of Change","journal":"2025 IEEE Global Humanitarian Technology Conference (GHTC)","year":2025,"volume":"","issue":"","page":"1","doi":"10.1109/ghtc66843.2025.11266770","authors_resolved":[{"family":"Busse","given":"Franz"},{"family":"Mattson","given":"Chris"},{"family":"Spring","given":"Truman"}],"notes":[],"apa":"Busse, F., Mattson, C., & Spring, T. (2025). Quantifiable Theory of Change. 2025 IEEE Global Humanitarian Technology Conference (GHTC), 1. https://doi.org/10.1109/ghtc66843.2025.11266770","mla":"Busse, Franz, et al. \"Quantifiable Theory of Change.\" 2025 IEEE Global Humanitarian Technology Conference (GHTC), 2025, p. 1, https://doi.org/10.1109/ghtc66843.2025.11266770.","chicago_author_date":"Busse, Franz, Chris Mattson, and Truman Spring. 2025. \"Quantifiable Theory of Change.\" 2025 IEEE Global Humanitarian Technology Conference (GHTC): 1. https://doi.org/10.1109/ghtc66843.2025.11266770.","chicago_bibliography":"Busse, Franz, Chris Mattson, and Truman Spring. \"Quantifiable Theory of Change.\" 2025 IEEE Global Humanitarian Technology Conference (GHTC) (2025): 1. https://doi.org/10.1109/ghtc66843.2025.11266770.","chicago_footnote":"Franz Busse, Chris Mattson, and Truman Spring, \"Quantifiable Theory of Change,\" 2025 IEEE Global Humanitarian Technology Conference (GHTC) (2025): 1, https://doi.org/10.1109/ghtc66843.2025.11266770.","ieee":"F. Busse, C. Mattson, and T. Spring, \"Quantifiable Theory of Change,\" 2025 IEEE Global Humanitarian Technology Conference (GHTC), pp. 1, Oct. 2025, doi: 10.1109/ghtc66843.2025.11266770.","bibtex":"@article{busse2025quantifiable,\n  author    = {Busse, Franz and Mattson, Chris and Spring, Truman},\n  title     = {Quantifiable Theory of Change},\n  journal   = {2025 IEEE Global Humanitarian Technology Conference (GHTC)},\n  pages     = {1},\n  year      = {2025},\n  publisher = {IEEE},\n  doi       = {10.1109/ghtc66843.2025.11266770}\n}"},{"id":"a-decision-support-system-for-multi-stakeholder-exploration-of-the-airship-desig","slug":"/a-decision-support-system-for-exploration-of-airship-design","title":"A decision support system for multi-stakeholder exploration of the airship design space","catalog_title":"A decision support system for multi-stakeholder exploration of the airship design space","abstract":"Although there have been oscillations in airship interest since their use in the early 1900s, technological advancements and the need for more flexible and environmentally friendly transportation modes have caused a stream of study and surge in airship development in recent years. For companies and governments to understand how airships can be incorporated into their fleets to fulfill new or existing mission types, system design space exploration is an important step in understanding airships, their uses, and their design parameters. A decision support system (DSS), Design Exploration of Lighter-Than-Air Systems (DELTAS), was developed to help stakeholders with this task. DELTAS allows users to design airships and missions to determine how a design will perform in the scenario. As airships are sensitive to elevation and altitude, wind and terrain can also be studied to see how they may affect a mission scenario. Simulations can also be run for a given mission to find the Pareto-optimal designs for user-defined ranges of high-level airship design parameters. A case study is provided that demonstrates how DELTAS can be used to explore the airship design space for a specified mission. This case study shows how a design of experiments is important to more thoroughly cover the design space and to find and understand the relationships between airship design variables that lead to optimal mission times and costs.","abstract_source":"crossref","publisher_url":"https://doi.org/10.1177/15485129231164416","badge":"journal","categories":["Social impact modeling"],"hidden":false,"resolved_title":"A decision support system for multi-stakeholder exploration of the airship design space","journal":"The Journal of Defense Modeling and Simulation: Applications, Methodology, Technology","year":2024,"volume":"21","issue":"4","page":"363","doi":"10.1177/15485129231164416","authors_resolved":[{"family":"Richards","given":"DC"},{"family":"Salmon","given":"John L"},{"family":"Dickerson","given":"Tevin J"},{"family":"Mattson","given":"Christopher A"},{"family":"Neff","given":"William J"}],"notes":[],"apa":"Richards, D., Salmon, J. L.,
